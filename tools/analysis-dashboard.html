<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>双 GPU 解析监控</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Serif+SC:wght@600;700;900&display=swap');
:root{--ink:#182333;--muted:#667588;--line:#d8e1e8;--paper:#f4f6f2;--mac:#e64f27;--nvidia:#72a424;--night:#132332}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% -20%,#e1f5d4 0,transparent 35%),radial-gradient(circle at 8% 0,#ffe4d7 0,transparent 28%),var(--paper);color:var(--ink);font-family:'DM Mono',monospace;min-height:100vh}.page{max-width:1320px;margin:auto;padding:45px 30px 70px}.eyebrow{color:#677789;font-size:11px;letter-spacing:.16em;text-transform:uppercase}.titleline{display:flex;justify-content:space-between;align-items:end;gap:24px;border-bottom:2px solid var(--ink);padding:15px 0 25px}.title{font:900 clamp(36px,6vw,76px)/.94 'Noto Serif SC',serif;letter-spacing:-.08em}.title b{color:#ee542e;font-family:'DM Mono',monospace;font-size:.38em;letter-spacing:-.06em;vertical-align:top}.clock{text-align:right;font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:28px}.lane{border:1px solid var(--line);border-top:8px solid var(--accent);background:rgba(255,255,255,.86);box-shadow:7px 7px 0 rgba(24,35,51,.08);padding:25px;min-height:420px}.lanehead{display:flex;justify-content:space-between;align-items:start}.machine{font:700 30px/1 'Noto Serif SC',serif}.sub{margin-top:7px;color:var(--muted);font-size:12px;line-height:1.6}.state{padding:7px 10px;border:1px solid currentColor;color:var(--accent);font-size:11px;font-weight:700}.progress{margin:34px 0 14px}.numbers{display:flex;justify-content:space-between;align-items:baseline}.big{font-size:52px;letter-spacing:-.08em}.big small{font-size:18px;color:var(--muted);letter-spacing:0}.rail{height:12px;background:#e4e9e6;margin-top:12px}.fill{height:100%;width:0;background:var(--accent);transition:width .5s ease}.metrics{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line);margin-top:24px}.metric{padding:15px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.metric label{display:block;color:var(--muted);font-size:10px;margin-bottom:9px}.metric strong{font-size:21px}.quality{margin-top:25px;padding:14px;background:#e9f6e4;border-left:5px solid var(--nvidia);font-size:12px;line-height:1.8}.quality.check{background:#fff0e7;border-left-color:var(--mac)}.footer{margin-top:25px;color:var(--muted);font-size:11px;line-height:1.8}.note{margin-top:28px;background:var(--night);padding:18px 22px;color:#edf5f0;font-size:12px;display:flex;justify-content:space-between;gap:20px}.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:currentColor;margin-right:7px}.paused{color:#e79a30}@media(max-width:780px){.grid{grid-template-columns:1fr}.titleline{align-items:start;flex-direction:column}.clock{text-align:left}}
</style></head><body><main class="page"><div class="eyebrow">Reading analysis / staged verification</div><div class="titleline"><div class="title">双 GPU<br>解析监控 <b>LIVE</b></div><div class="clock" id="clock">正在连接…</div></div><section class="grid"><article class="lane" style="--accent:var(--mac)" id="mac"></article><article class="lane" style="--accent:var(--nvidia)" id="p920"></article></section><div class="note"><span>只读取临时产物：原文与正式书架均不会被此 dashboard 修改。</span><span id="refresh"><span class="pulse"></span>5 秒刷新</span></div></main><script>
const lane=(name,data,extra='')=>{const active=Boolean(data.process), status=active?'RUNNING':(data.pending?'BLOCKED':'IDLE'), pct=data.expected?Math.round(data.completed/data.expected*100):0, q=data.quality==='CLEAN';return `<div class="lanehead"><div><div class="machine">${name}</div><div class="sub">${extra||'staged reader analysis'}${data.process?` · PID ${data.process.pid} · ${data.process.elapsed}`:''}</div></div><div class="state ${active?'':'paused'}"><span class="pulse"></span>${status}</div></div><div class="progress"><div class="numbers"><div class="big">${data.completed}<small> / ${data.expected} 篇</small></div><div>${pct}%</div></div><div class="rail"><div class="fill" style="width:${pct}%"></div></div></div><div class="metrics"><div class="metric"><label>已解析句子</label><strong>${data.sentences}</strong></div><div class="metric"><label>待处理文章</label><strong>${data.pending}</strong></div><div class="metric"><label>原文重建错误</label><strong>${data.mismatches}</strong></div><div class="metric"><label>缺少切片</label><strong>${data.missingSegments}</strong></div><div class="metric"><label>非法标签</label><strong>${data.invalidTypes}</strong></div><div class="metric"><label>fallback</label><strong>${data.fallbacks}</strong></div></div><div class="quality ${q?'':'check'}"><strong>${q?'✓ QUALITY CLEAN':'! QUALITY CHECK'}</strong><br>${q?'原文重建、切片完整性、标签白名单与 fallback 检查当前无异常。':'发现质量异常；该跑道产物不会进入正式书架。'}</div><div class="footer">每篇完成后才写入临时产物；推理中数字可能暂时不变。</div>`};
async function refresh(){try{const r=await fetch('/api/status');const s=await r.json();document.querySelector('#mac').innerHTML=lane('MAC · MLX',s.mac,'qwen3.6:35b-a3b-mlx-bf16');document.querySelector('#p920').innerHTML=lane('P920 · NVIDIA',s.p920,'Qwen3.6 35B · health '+s.p920.health);document.querySelector('#clock').textContent='最后刷新 '+new Date(s.updatedAt).toLocaleTimeString('zh-CN');}catch(e){document.querySelector('#clock').textContent='连接 dashboard 失败';}}refresh();setInterval(refresh,5000);
</script></body></html>
