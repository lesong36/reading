name: Storage regression
on: [push, pull_request]
jobs:
  storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check scripts/reader-storage.js
      - run: node --test tests/storage-quota.test.mjs tests/reader-storage.test.mjs
