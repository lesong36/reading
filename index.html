        setGuidedSelections(prev => {
          const sentenceSelections = prev[sentenceId] || {};
          const clauseSelections = sentenceSelections[clauseKey] || {};
          const stepSelections = clauseSelections[stepKey] || {};
          const roleSelections = stepSelections[roleKey] || [];
          const nextRoleSelections = roleSelections.includes(segmentIndex)
            ? roleSelections.filter(index => index !== segmentIndex)
            : [...roleSelections, segmentIndex].sort((a, b) => a - b);
          return {
            ...prev,
            [sentenceId]: {
              ...sentenceSelections,
              [clauseKey]: {
                ...clauseSelections,
                [stepKey]: {
                  ...stepSelections,
                  [roleKey]: nextRoleSelections
                }
              }
            }
          };
        });
        setGuidedCheckState(prev => ({
          ...prev,
          [sentenceId]: {
            ...(prev[sentenceId] || {}),
            [clauseKey]: {
              ...((prev[sentenceId] || {})[clauseKey] || {}),
              [stepKey]: null
            }
          }
        }));
      };

      const handleGuidedDrop = (sentence, segmentIndex, roleKey) => {
        if (!guidedInteractiveStep || !roleKey) return;
        setGuidedActiveRole(roleKey);
        const sentenceId = sentence.id;
        const clauseKey = guidedCurrentClause;
        const stepKey = guidedStepIndex;
        setGuidedSelections(prev => {
          const sentenceSelections = prev[sentenceId] || {};
          const clauseSelections = sentenceSelections[clauseKey] || {};
          const stepSelections = clauseSelections[stepKey] || {};
          const nextStepSelections = Object.fromEntries(
            Object.entries(stepSelections).map(([key, indexes]) => [key, (indexes || []).filter(index => index !== segmentIndex)])
          );
          const roleSelections = nextStepSelections[roleKey] || [];
          nextStepSelections[roleKey] = [...roleSelections, segmentIndex].sort((a, b) => a - b);
          return {
            ...prev,
            [sentenceId]: {
              ...sentenceSelections,
              [clauseKey]: {
                ...clauseSelections,
                [stepKey]: nextStepSelections
              }
            }
          };
        });
        setGuidedCheckState(prev => ({
          ...prev,
          [sentenceId]: {
            ...(prev[sentenceId] || {}),
            [clauseKey]: {
              ...((prev[sentenceId] || {})[clauseKey] || {}),
              [stepKey]: null
            }
          }
        }));
      };

      const handleGuidedCheck = () => {
        const isCorrect = mapsMatch(guidedCurrentSelections, guidedExpectedSelections);
        setGuidedCheckState(prev => ({
          ...prev,
          [selectedSentence.id]: {
            ...(prev[selectedSentence.id] || {}),
            [guidedCurrentClause]: {
              ...((prev[selectedSentence.id] || {})[guidedCurrentClause] || {}),
              [guidedStepIndex]: isCorrect ? 'correct' : 'incorrect'
            }
          }
        }));
      };

      const revealGuidedAnswer = () => {
        setGuidedSelections(prev => ({
          ...prev,
          [selectedSentence.id]: {
            ...(prev[selectedSentence.id] || {}),
            [guidedCurrentClause]: {
              ...((prev[selectedSentence.id] || {})[guidedCurrentClause] || {}),
              [guidedStepIndex]: guidedExpectedSelections
            }
          }
        }));
        setGuidedCheckState(prev => ({
          ...prev,
          [selectedSentence.id]: {
            ...(prev[selectedSentence.id] || {}),
            [guidedCurrentClause]: {
              ...((prev[selectedSentence.id] || {})[guidedCurrentClause] || {}),
              [guidedStepIndex]: 'revealed'
            }
          }
        }));
      };

      const resetGuidedCurrentStep = () => {
        setGuidedSelections(prev => ({
          ...prev,
          [selectedSentence.id]: {
            ...(prev[selectedSentence.id] || {}),
            [guidedCurrentClause]: {
              ...((prev[selectedSentence.id] || {})[guidedCurrentClause] || {}),
              [guidedStepIndex]: {}
            }
          }
        }));
        setGuidedCheckState(prev => ({
          ...prev,
          [selectedSentence.id]: {
            ...(prev[selectedSentence.id] || {}),
            [guidedCurrentClause]: {
              ...((prev[selectedSentence.id] || {})[guidedCurrentClause] || {}),
              [guidedStepIndex]: null
            }
          }
        }));
      };

      const getGuidedSegmentClassName = (sentence, segmentIndex) => {
        if (sentence.id !== selectedSentence.id) return 'text-slate-800';
        const basePalette = {
          subject: 'bg-red-100 text-red-900 border border-red-200',
          verb: 'bg-blue-100 text-blue-900 border border-blue-200',
          object: 'bg-green-100 text-green-900 border border-green-200',
          predicative: 'bg-emerald-100 text-emerald-900 border border-emerald-200',
          conjunction: 'bg-purple-100 text-purple-900 border border-purple-200',
          'noun-modifier': 'bg-amber-100 text-amber-900 border border-amber-200',
          'verb-modifier': 'bg-slate-200 text-slate-800 border border-slate-300',
          clause: 'bg-fuchsia-100 text-fuchsia-900 border border-fuchsia-200'
        };

        const mainRole = GUIDED_MAIN_ROLE_OPTIONS.find(option => (guidedMainSelections[option.key] || []).includes(segmentIndex));
        const currentRole = guidedRoleOptions.find(option => (guidedCurrentSelections[option.key] || []).includes(segmentIndex));
        const focusIndexes = guidedFocusOptions.find(option => option.key === guidedCurrentFocus)?.indexes || [];

        if (guidedStepIndex === 2 && focusIndexes.includes(segmentIndex)) {
          return 'bg-indigo-100 text-indigo-900 border border-indigo-300 ring-2 ring-indigo-300';
        }
        if (currentRole) {
          return basePalette[currentRole.key] || 'bg-indigo-100 text-indigo-900 border border-indigo-200';
        }
        if (mainRole) {
          return basePalette[mainRole.key] || 'bg-indigo-100 text-indigo-900 border border-indigo-200';
        }
        if (!guidedInteractiveStep) return 'text-slate-800 border border-transparent';
        const palette = {
          subject: 'bg-red-100 text-red-900 border border-red-200',
          verb: 'bg-blue-100 text-blue-900 border border-blue-200',
          object: 'bg-green-100 text-green-900 border border-green-200',
          predicative: 'bg-emerald-100 text-emerald-900 border border-emerald-200',
          conjunction: 'bg-purple-100 text-purple-900 border border-purple-200',
          modifier: 'bg-amber-100 text-amber-900 border border-amber-200',
          adverbial: 'bg-slate-200 text-slate-800 border border-slate-300',
          clause: 'bg-fuchsia-100 text-fuchsia-900 border border-fuchsia-200'
        };
        return guidedInteractiveStep ? 'text-slate-800 hover:bg-indigo-50 border border-transparent' : 'text-slate-800 border border-transparent';
      };

      const handleGuidedWordDoubleClick = (e, sentenceText) => {
        openVocabPopupFromEvent(e, sentenceText);
      };

      const openVocabPopupFromEvent = (e, sentenceText) => {
        setTimeout(() => {
          const fromSelection = getSelectedWordHit();
          if (fromSelection) {
            setVocabPopup({
              word: fromSelection.word,
              x: fromSelection.x,
              y: fromSelection.y,
              context: sentenceText
            });
            return;
          }
          const point = e?.clientX != null
            ? { x: e.clientX, y: e.clientY }
            : (e?.changedTouches?.[0]
              ? { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY }
              : null);
          if (!point) return;
          const hit = getWordAtClientPoint(point.x, point.y);
          if (!hit) return;
          setVocabPopup({
            word: hit.word,
            x: hit.x,
            y: hit.y,
            context: sentenceText
          });
        }, 40);
      };

      const wordPressTimerRef = useRef(null);
      const wordPressOriginRef = useRef(null);

      const clearWordPressTimer = () => {
        if (wordPressTimerRef.current) {
          clearTimeout(wordPressTimerRef.current);
          wordPressTimerRef.current = null;
        }
        wordPressOriginRef.current = null;
      };

      const handleWordPressStart = (e, sentenceText, { enabled = true } = {}) => {
        if (!enabled) return;
        const touch = e.touches?.[0];
        if (!touch) return;
        clearWordPressTimer();
        wordPressOriginRef.current = {
          x: touch.clientX,
          y: touch.clientY,
          sentenceText
        };
        wordPressTimerRef.current = setTimeout(() => {
          const origin = wordPressOriginRef.current;
          wordPressTimerRef.current = null;
          if (!origin) return;
          const hit = getWordAtClientPoint(origin.x, origin.y);
          if (!hit) return;
          if (navigator.vibrate) {
            try { navigator.vibrate(12); } catch (_) {}
          }
          setVocabPopup({
            word: hit.word,
            x: hit.x,
            y: hit.y,
            context: origin.sentenceText
          });
        }, 480);
      };

      const handleWordPressMove = (e) => {
        const origin = wordPressOriginRef.current;
        const touch = e.touches?.[0];
        if (!origin || !touch) return;
        if (Math.abs(touch.clientX - origin.x) > 12 || Math.abs(touch.clientY - origin.y) > 12) {
          clearWordPressTimer();
        }
      };

      const handleWordPressEnd = () => {
        clearWordPressTimer();
      };

      const renderGuidedSentenceWorkbench = () => (
        <div className="rounded-3xl border border-slate-200 bg-white p-5 shadow-sm">
          <div className="flex flex-col gap-3 md:flex-row md:items-center md:justify-between mb-4">
            <div>
              <p className="text-sm font-semibold text-slate-700">操作句子</p>
              <p className="text-sm text-slate-500">
                {guidedInteractiveStep
                  ? '先选标签，再点句子里的对应片段。'
                  : '这里展示当前正在处理的句子。'}
              </p>
            </div>
            {guidedInteractiveStep && (
              <div className="text-sm font-medium text-indigo-700 bg-indigo-50 border border-indigo-100 rounded-full px-3 py-1.5">
                当前标签：{guidedRoleOptions.find(option => option.key === guidedActiveRole)?.label || '未选择'}
              </div>
            )}
          </div>

          {guidedClauseUnits.length > 1 && (
            <div className="flex flex-wrap gap-2 mb-4">
              {guidedClauseUnits.map(unit => (
                <button
                  key={unit.key}
                  type="button"
                  onClick={() => setGuidedClauseSelection(prev => ({ ...prev, [selectedSentence.id]: unit.key }))}
                  className={`px-3 py-1.5 rounded-full border text-sm font-semibold ${
                    guidedCurrentClause === unit.key
                      ? 'bg-slate-900 text-white border-slate-900'
                      : 'bg-white text-slate-700 border-slate-200'
                  }`}
                >
                  {unit.label}
                </button>
              ))}
            </div>
          )}

          {guidedInteractiveStep && (
            <div className="flex flex-wrap gap-2 mb-4">
              {guidedRoleOptions.map(option => (
                <button
                  key={option.key}
                  type="button"
                  onClick={() => setGuidedActiveRole(option.key)}
                  draggable
                  onDragStart={() => setGuidedDragRole(option.key)}
                  onDragEnd={() => setGuidedDragRole(null)}
                  className={`px-3 py-1.5 rounded-full border text-sm font-semibold transition-colors ${
                    guidedActiveRole === option.key
                      ? 'bg-indigo-600 text-white border-indigo-600'
                      : 'bg-white text-slate-700 border-slate-200 hover:border-indigo-300'
                  }`}
                >
                  {option.label}
                </button>
              ))}
            </div>
          )}

          <div
            className="rounded-2xl bg-slate-50 border border-slate-200 p-5 select-text reader-word-target"
            onDoubleClick={(e) => !guidedInteractiveStep && openVocabPopupFromEvent(e, selectedSentence.text)}
            onTouchStart={(e) => handleWordPressStart(e, selectedSentence.text, { enabled: !guidedInteractiveStep })}
            onTouchMove={handleWordPressMove}
            onTouchEnd={handleWordPressEnd}
            onTouchCancel={handleWordPressEnd}
            title={!guidedInteractiveStep ? '电脑双击 / iPad 长按单词可查词并加入生词本' : ''}
          >
            <div className="text-xl md:text-2xl font-serif leading-relaxed text-slate-900">
              {guidedNeedsSubSegmentation
                ? guidedSubSegments.map((seg, index) => (
                    <button
                      key={`${seg.text}-${index}`}
                      type="button"
                      onClick={() => handleGuidedSegmentToggle(selectedSentence, index)}
                      onDragOver={(e) => {
                        e.preventDefault();
                      }}
                      onDrop={(e) => {
                        e.preventDefault();
                        handleGuidedDrop(selectedSentence, index, guidedDragRole || guidedActiveRole);
                        setGuidedDragRole(null);
                      }}
                      className={`inline rounded-md px-1 py-0.5 mx-[1px] transition-all ${getGuidedSegmentClassName(selectedSentence, index)}`}
                      title={seg.forcedRole || ''}
                    >
                      {seg.text}{index === guidedSubSegments.length - 1 ? '' : ' '}
                    </button>
                  ))
                : (selectedSentence.segments || []).map((seg, index) => {
                    if (!guidedVisibleText.includes(index) && guidedClauseUnits.length > 1) {
                      return null;
                    }
                    return guidedInteractiveStep ? (
                      <button
                        key={`${seg.text}-${index}`}
                        type="button"
                        onClick={() => handleGuidedSegmentToggle(selectedSentence, index)}
                        onDragOver={(e) => {
                          e.preventDefault();
                        }}
                        onDrop={(e) => {
                          e.preventDefault();
                          handleGuidedDrop(selectedSentence, index, guidedDragRole || guidedActiveRole);
                          setGuidedDragRole(null);
                        }}
                        className={`inline rounded-md px-1 py-0.5 mx-[1px] transition-all ${getGuidedSegmentClassName(selectedSentence, index)}`}
                        title={seg.label}
                      >
                        {seg.text}
                      </button>
                    ) : (
                      <span
                        key={`${seg.text}-${index}`}
                        className={`inline rounded-md px-1 py-0.5 mx-[1px] transition-all ${getGuidedSegmentClassName(selectedSentence, index)}`}
                      >
                        {seg.text}
                      </span>
                    );
                  })}
            </div>
          </div>
        </div>
      );

      // --- Auth Handlers ---
      const handleAuthSubmit = async (e) => {
        e.preventDefault();
        if (!supabase) {
          setAuthError("Supabase 服务未初始化");
          return;
        }
        setIsAuthenticating(true);
        setAuthError("");
        try {
          if (isLoginMode) {
            const { error } = await supabase.auth.signInWithPassword({ email: loginEmail.trim(), password: loginPassword });
            if (error) throw error;
          } else {
            const username = loginUsername.trim().toLowerCase();
            if (!/^[a-z0-9_]{3,32}$/.test(username)) throw new Error('用户名需为 3–32 位英文字母、数字或下划线。');
            const { data, error } = await supabase.auth.signUp({
              email: loginEmail.trim(), password: loginPassword,
              options: {
                data: { username },
                emailRedirectTo: `${window.location.origin}${window.location.pathname}`
              }
            });
            if (error) throw error;
            if (!data.session) {
              setAuthError('注册成功，请先到邮箱点击验证链接，再回来登录。');
              return;
            }
          }
          setShowLoginModal(false);
        } catch (err) {
          if (/invalid login credentials/i.test(err.message || '')) setAuthError("邮箱或密码错误，请检查。");
          else if (/already registered/i.test(err.message || '')) setAuthError("该邮箱已被注册，请直接登录。");
          else setAuthError("认证失败：" + err.message);
        } finally {
          setIsAuthenticating(false);
        }
      };

      const handleLogout = async () => {
        if (!supabase) return;
        try {
          await supabase.auth.signOut();
          setSyncPassphrase('');
          setSyncVaultUnlocked(false);
        } catch (e) {
          console.error("Logout error", e);
        }
      };

      const handleSaveSupabaseConfig = () => {
        try {
          const parsed = JSON.parse(supabaseConfigInput);
          if (!parsed.url || !parsed.publishableKey) {
            setAuthError('Supabase 配置缺少 url 或 publishableKey。');
            return;
          }
          localStorage.setItem(SUPABASE_CONFIG_STORAGE_KEY, JSON.stringify(parsed));
          setToastMessage('✅ Supabase 配置已保存，页面即将刷新。');
          setTimeout(() => window.location.reload(), 800);
        } catch (error) {
          setAuthError(`Supabase 配置不是合法 JSON：${error.message}`);
        }
      };

      const handleUnlockSyncVault = async () => {
        if (!syncPassphrase) { setAuthError('请输入同步加密口令。'); return; }
        if (!supabase || !user) { setAuthError('请先登录云同步账号。'); return; }
        try {
          // Read at click time so a slow initial cloud fetch cannot leave the
          // second device with an unlocked vault but an empty API key.
          const { data, error } = await supabase
            .from('reader_sync_state')
            .select('encrypted_ai_key')
            .eq('user_id', user.id)
            .maybeSingle();
          if (error) throw error;
          const encryptedAiKey = data?.encrypted_ai_key || encryptedAiKeyRef.current;
          if (encryptedAiKey) {
            setCloudApiKey(await decryptFromSyncVault(encryptedAiKey, syncPassphrase));
            encryptedAiKeyRef.current = encryptedAiKey;
            setToastMessage('AI 密钥已在当前设备解密。');
          } else if (cloudApiKey) {
            // This is the first (source) device: write the ciphertext now,
            // rather than relying on the debounced background sync.
            const encrypted = await encryptForSyncVault(cloudApiKey, syncPassphrase);
            const { error: writeError } = await supabase
              .from('reader_sync_state')
              .upsert({ user_id: user.id, encrypted_ai_key: encrypted, updated_at: new Date().toISOString() }, { onConflict: 'user_id' });
            if (writeError) throw writeError;
            encryptedAiKeyRef.current = encrypted;
            setToastMessage('AI 密钥已加密并同步到云端。');
          } else {
            setToastMessage('当前设备没有填写 AI Key，因此没有可上传的密钥。');
          }
          setSyncVaultUnlocked(true);
          setAuthError('');
          setCloudSyncRevision(value => value + 1);
        } catch (error) { setAuthError('同步口令不正确，无法解密 AI 密钥。'); }
      };

      // --- Vocab / Dictionary Logic ---
      const handleAddWordToVocab = async (word, contextSentenceText) => {
        if (vocabBook.some(v => v.word === word)) return; 
        setAddingWordId(word);
        setActiveAiTask('vocab');
        setAiTaskStartedAt(Date.now());
        try {
          const sysPrompt = `你是一个专业的英语词汇与词源拓展助手。用户正在阅读英文文章，并希望将生词加入专属卡片本。
请提供以下细节，严格输出JSON格式：
{
  "meaning": "简明扼要的中文释义（请根据原文语境给出最合适的翻译）",
  "pronunciation": "英式或美式音标，例如 /əˈstrɒnəmə(r)/",
  "etymology": "词源简述，解释词根词缀。例如：由 astro-(星星) + -nomer(命名者) 组成，源自希腊语。",
  "exampleSentence": "造一个符合A2/B1难度的简短英文例句，并在括号内附带中文翻译。"
}`;
          const userPrompt = `【目标单词】：${word}\n【原文语境】：${contextSentenceText}`;
          const response = await fetchAiResponse({
            ...aiConfig,
            userPrompt,
            systemPrompt: sysPrompt,
            expectJson: true
          });
          const data = parseAiJsonOrThrow(response, 'Ollama');

          // Web API crypto fallback
          const generateId = () => window.crypto?.randomUUID ? crypto.randomUUID() : Math.random().toString(36).substring(2, 15);

          const newWordEntry = {
            id: generateId(),
            word: word,
            meaning: data.meaning || "暂无释义",
            pronunciation: data.pronunciation || "",
            etymology: data.etymology || "暂无词源信息",
            exampleSentence: data.exampleSentence || "",
            sourceContext: contextSentenceText,
            addedAt: new Date().toLocaleDateString(),
            timestamp: Date.now()
          };

          setVocabBook(prev => [newWordEntry, ...prev]);
          setToastMessage(`✅ 成功添加生词: ${word}`);
        } catch (error) {
          console.error(error);
          setToastMessage(`❌ 词汇解析失败：${error.message || '请稍后重试'}`);
        } finally {
          setAddingWordId(null);
          setActiveAiTask(null);
          setAiTaskStartedAt(null);
        }
      };

      const handleRemoveWord = (id) => {
        setConfirmDialog({
          message: "确定要从生词本彻底移除这个单词吗？",
          onConfirm: () => {
            setVocabBook(prev => prev.filter(w => w.id !== id));
            setConfirmDialog(null);
            setToastMessage("🗑️ 单词已移除");
          }
        });
      };

      const exportVocabData = () => {
        if(vocabBook.length === 0) {
          setToastMessage("⚠️ 生词本是空的，没什么可导出的！");
          return;
        }
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(vocabBook, null, 2));
        const downloadAnchorNode = document.createElement('a');
        downloadAnchorNode.setAttribute("href", dataStr);
        downloadAnchorNode.setAttribute("download", `vocab_backup_${new Date().toISOString().split('T')[0]}.json`);
        document.body.appendChild(downloadAnchorNode); 
        downloadAnchorNode.click();
        downloadAnchorNode.remove();
        setToastMessage("💾 生词本备份已成功导出");
      };

      const importVocabData = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const fileReader = new FileReader();
        fileReader.readAsText(file, "UTF-8");
        fileReader.onload = event => {
          try {
            const importedData = JSON.parse(event.target.result);
            if (Array.isArray(importedData)) {
              setVocabBook(prev => {
                const newDict = [...prev];
                importedData.forEach(newWord => {
                  if(!newDict.some(w => w.word === newWord.word)) {
                    newDict.push(newWord);
                  }
                });
                newDict.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                return newDict;
              });
              setToastMessage(`✅ 成功导入了 ${importedData.length} 个单词记录！`);
            } else {
              setToastMessage("❌ 文件格式不正确，应该是一个包含单词对象的数组。");
            }
          } catch (err) {
            setToastMessage("❌ 导入失败，JSON 格式可能已损坏！");
          }
          e.target.value = null;
        };
      };

      // --- Article Library Logic ---
      const handleSaveCurrentArticle = () => {
        setArticleTitleInput(`分析文章 ${new Date().toLocaleDateString()}`);
        setSaveModalOpen(true);
      };

      const handleRemoveArticle = (id) => {
        setConfirmDialog({
          message: "确定要从书架彻底删除这篇文章吗？",
          onConfirm: () => {
            setSavedArticles(prev => prev.filter(a => a.id !== id));
            setConfirmDialog(null);
            setToastMessage("🗑️ 文章已删除");
          }
        });
      };

      const handleClearLocalLearningData = () => {
        setConfirmDialog({
          message: "确定要清空本机学习记录吗？这会删除书架文章和生词本，但不会删除 AI 设置或磁盘上的生成 JSON 文件。",
          onConfirm: async () => {
            try {
              setSavedArticles([]);
              setVocabBook([]);
              localStorage.setItem(BUNDLED_LIBRARY_SEED_KEY, BUNDLED_LIBRARY_SEED_VERSION);
              await clearLocalLearningStorage();
              setLocalPersistenceStatus(prev => ({
                ...prev,
                message: `本地学习记录已清空：${LOCAL_DATA_FILE_NAME}`
              }));
              setConfirmDialog(null);
              setToastMessage("本机学习记录已清空");
            } catch (error) {
              setConfirmDialog(null);
              setToastMessage(`清空失败：${error.message || '请稍后重试'}`);
            }
          }
        });

        while ((match = pattern.exec(source)) !== null) {

【四步法的严苛分工约束（核心：绝对禁止内容交叉与重复赘述）】

1. main (骨架小火车) 专属职责：
   - 明确说出句子的三节车厢分别是什么：① 谁在做（主语）② 做了什么动作（谓语动词）③ 做给谁/看见什么（宾语/表语）。三节分开点名，让孩子听完能说出"谁做了什么"。
   - 如果主干中有生词，或者动词出现了变形（不是原形），简短说明这个词的中文意思或原形是什么。
   - 禁忌：严禁讲解任何修饰成分（形容词、副词、介词短语、时间/地点词、从句等）。
   - 比喻：请使用"小火车"或"小树干"的比喻。

2. grammar (语法放大镜) 专属职责：
   - 针对本句主干中实际出现的语法现象，逐一讲清楚。凡出现以下任何一种都必须讲到（只讲本句有的，不编造没有的）：
     · 时态（动词变形及其含义：过去式/完成时/进行时/将来时）
     · 主谓一致（主语单复数与动词形式是否匹配）
     · 语态（被动语态 be + 过去分词：是谁被谁做了什么）
     · 情态动词（can/could/must/should/may 等表能力/必须/建议）
     · 代词指代（it/they/this/that 等指的是前文哪个名词）
     · there be 句式（特殊语序，意思是"有……"）
     · 疑问句/否定句构成（助动词 do/does/did/is/are/was/were 的位置变化）
     · 重点动词及搭配（该动词常见搭配或固定介词用法）
   - 禁忌：严禁重新翻译主干大意，严禁讲修饰成分。
   - 比喻：请使用"语法放大镜"或"词汇变身装"的比喻。

3. modifier (细节修饰小贴纸) 专属职责：
   - 逐一介绍句子中所有起修饰作用的成分。重点帮孩子搞清楚：每张小贴纸贴在哪里——是贴在某个名词上，还是贴在动词/整个动作上？
   - 按本句实际有的类型处理：
     · 介宾短语（in Hawaii / at noon 等）：先说贴在名词旁还是动作旁，再说补充了什么（何地/何时/方式）。
     · 形容词/形容词短语：贴在哪个名词上，告诉我们那个词"什么样"。
     · 副词/副词短语：贴在动词或形容词上，告诉我们"怎么做/程度如何"。
     · 定语从句（who/which/that 引导）：贴在哪个名词后，进一步说明那个名词是什么/怎么样。
     · 同位语从句（that 引导，紧跟抽象名词）：贴在哪个名词后，解释那个名词的具体内容。
     · 状语从句（when/because/if/although 等引导）：贴在整个主句动作上，补充时间/原因/条件/让步。
   - 禁忌：绝对不要重复主干意思和动词时态。
   - 比喻：必须使用"小贴纸"/"小标签"/"小卡片"的比喻，并说清楚贴在哪里。

4. relationship (句子关系连接桥) 专属职责：
   - 本步骤专门讲句子内部从句与主句之间、或并列句之间的连接关系。
   - 如果是单句（只有一个主谓结构），直接说"这是一个单句，整趟小火车独立跑，不需要连接桥"，然后简单回顾整句结构顺序（时间/地点在前，主干居中，修饰收尾）。
   - 如果有多个从句或并列结构，必须讲清楚：
     · 并列关系（FANBOYS：for/and/nor/but/or/yet/so）——两列火车并肩跑，地位平等，点出连词是哪个。
     · 定语从句（who/which/that）——小附属车厢挂在某名词后给它打补丁，说清楚修饰的是哪个名词。
     · 同位语从句（that 引导）——专门解释某个抽象名词"到底是什么"，说清楚是哪个名词的内容。
     · 状语从句（when/because/if/although/so that 等）——时间牌/原因牌/条件牌交代背景，说清楚连词和它补充的是主句的什么。
   - 禁忌：不要重复讲单个词，只讲结构连接关系。
   - 比喻：请使用"句子连接桥"或"拼图块拼接"的比喻。

   - encouragement: 一句简短的鼓励式收束话术

                      <div className="rounded-2xl border border-indigo-100 bg-indigo-50/70 p-4">
                        <div className="text-sm font-semibold text-indigo-950">同步 AI 设置</div>
                        <p className="mt-1 text-xs leading-5 text-indigo-800">模型、Base URL 等偏好会自动同步。输入一个只由你记住的同步加密口令，当前 AI Key 才会加密写入云端；另一台设备输入相同口令即可解密。</p>
                        <div className="mt-3 flex flex-col gap-2 sm:flex-row">
                          <input
                            type="password"
                            value={syncPassphrase}
                            onChange={(e) => setSyncPassphrase(e.target.value)}
                            placeholder="同步加密口令（不上传、不保存）"
                            className="min-w-0 flex-1 rounded-xl border border-indigo-200 bg-white px-3 py-2 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500/40"
                          />
                          <button onClick={handleUnlockSyncVault} className="rounded-xl bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-700">
                            {syncVaultUnlocked ? '已解锁并同步' : '加密并同步 Key'}
                          </button>
                        </div>
                      </div>
                      {authError && <p className="text-sm text-red-600">{authError}</p>}
                      <button
                        onClick={handleLogout}
                        className="w-full inline-flex items-center justify-center gap-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-white px-4 py-2.5 font-semibold transition-colors"
                      >
                        <LogOut className="w-4 h-4" />
                        退出账号
                      </button>
                    </div>
                  ) : (
                    <form onSubmit={handleAuthSubmit} className="space-y-4">
                      {!isLoginMode && <div>
                        <label className="block text-sm font-medium text-slate-700 mb-2">用户名</label>
                        <input type="text" value={loginUsername} onChange={(e) => setLoginUsername(e.target.value)} className="w-full rounded-xl border border-slate-300 px-4 py-2.5 text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500/40" autoComplete="username" placeholder="3–32 位字母、数字或下划线" required />
                      </div>}
                      <div>
                        <label className="block text-sm font-medium text-slate-700 mb-2">邮箱</label>
                        <input
                          type="email"
                          value={loginEmail}
                          onChange={(e) => setLoginEmail(e.target.value)}
                          className="w-full rounded-xl border border-slate-300 px-4 py-2.5 text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500/40"
                          autoComplete="email"
                          required
                        />
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-slate-700 mb-2">密码</label>
                        <input
                          type="password"
                          value={loginPassword}
                          onChange={(e) => setLoginPassword(e.target.value)}
                          className="w-full rounded-xl border border-slate-300 px-4 py-2.5 text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500/40"
                          autoComplete={isLoginMode ? 'current-password' : 'new-password'}
                          required
                        />
                      </div>
                      {authError && <p className="text-sm text-red-600 whitespace-pre-line">{authError}</p>}
                      <button
                        type="submit"
                        disabled={isAuthenticating}
                        className="w-full inline-flex items-center justify-center gap-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 font-semibold transition-colors disabled:opacity-70"
                      >
                        {isAuthenticating ? <Loader2 className="w-4 h-4 animate-spin" /> : <KeyRound className="w-4 h-4" />}
                        {isLoginMode ? '登录并同步' : '注册并同步'}
                      </button>
                      <button
                        type="button"
                        onClick={() => {
                          setIsLoginMode(prev => !prev);
                          setAuthError("");
                        }}
                        className="w-full text-sm font-semibold text-emerald-700 hover:text-emerald-800"
                      >
                        {isLoginMode ? '没有账号？切换到注册' : '已有账号？切换到登录'}
                      </button>
                    </form>
                  )}
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
