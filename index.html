    import { BookOpen, Search, Info, MousePointerClick, Zap, AlignLeft, Underline, Link as LinkIcon, Tag, Sparkles, Send, Loader2, UploadCloud, FileText, ArrowLeft, BookMarked, Printer, Plus, Trash2, CheckCircle2, Download, Upload, MessageSquare, Library, Save, FolderOpen, User, LogOut, X, Bot, RefreshCw, KeyRound, ZoomIn, ZoomOut } from 'https://esm.sh/lucide-react@0.292.0?bundle&deps=react@18.2.0';

    const DEFAULT_SUPABASE_CONFIG = {

    const LOCAL_PRIVATE_CONFIG = typeof window !== 'undefined' ? (window.__reader_local_config || {}) : {};

    const DEFAULT_DOUBAO_VOICE_TOKEN = LOCAL_PRIVATE_CONFIG.volcengineAccessToken || '';
    const DEFAULT_DOUBAO_VOICE_CLUSTER = 'volcano_tts';

    // 临时关闭豆包云端 TTS（按量计费）；恢复时改为 true
    const DOUBAO_VOICE_ENABLED = false;
    const LEGACY_DOUBAO_VOICE_TYPE_MAP = {
      BV701_streaming: 'zh-female-warm',

    const normalizeDoubaoVoiceType = (value) => {
      const cleaned = String(value || '').trim();
      if (!cleaned) return DEFAULT_DOUBAO_VOICE_TYPE;

    const getStoredSupabaseConfig = () => {
      try {
        const stored = localStorage.getItem(SUPABASE_CONFIG_STORAGE_KEY);

    const SYNC_VAULT_VERSION = 1;
    const textEncoder = new TextEncoder();
    const textDecoder = new TextDecoder();
    const bytesToBase64 = (bytes) => btoa(String.fromCharCode(...bytes));
    const base64ToBytes = (value) => Uint8Array.from(atob(value), char => char.charCodeAt(0));
    const deriveSyncVaultKey = async (passphrase, salt) => {
      const material = await crypto.subtle.importKey('raw', textEncoder.encode(passphrase), 'PBKDF2', false, ['deriveKey']);
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt, iterations: 310000, hash: 'SHA-256' },
        material,
        { name: 'AES-GCM', length: 256 },
        false,
        ['encrypt', 'decrypt']
      );
    };
    const encryptForSyncVault = async (value, passphrase) => {
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const key = await deriveSyncVaultKey(passphrase, salt);
      const ciphertext = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, textEncoder.encode(value));
      return { v: SYNC_VAULT_VERSION, salt: bytesToBase64(salt), iv: bytesToBase64(iv), ciphertext: bytesToBase64(new Uint8Array(ciphertext)) };
    };
    const decryptFromSyncVault = async (payload, passphrase) => {
      if (!payload || payload.v !== SYNC_VAULT_VERSION) throw new Error('不支持的加密数据版本');
      const key = await deriveSyncVaultKey(passphrase, base64ToBytes(payload.salt));
      const plaintext = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: base64ToBytes(payload.iv) }, key, base64ToBytes(payload.ciphertext));
      return textDecoder.decode(plaintext);
    };

    let supabase = null, supabaseConfigSource = 'none';
    const suppliedSupabaseConfig = LOCAL_PRIVATE_CONFIG.supabaseUrl && LOCAL_PRIVATE_CONFIG.supabasePublishableKey
      ? { url: LOCAL_PRIVATE_CONFIG.supabaseUrl, publishableKey: LOCAL_PRIVATE_CONFIG.supabasePublishableKey }
      : getStoredSupabaseConfig() || DEFAULT_SUPABASE_CONFIG;
    if (suppliedSupabaseConfig?.url && suppliedSupabaseConfig?.publishableKey) {
      try {
        supabase = createClient(suppliedSupabaseConfig.url, suppliedSupabaseConfig.publishableKey, {
          auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
        });
        supabaseConfigSource = LOCAL_PRIVATE_CONFIG.supabaseUrl ? 'local' : 'bundled';
      } catch (e) {
        console.error('Supabase Initialization Error:', e);

    }

    // Default built-in data
    const defaultArticleGlossary = [
      {
        term: 'astronomers',
        translation: '天文学家',
        kind: 'term',

        aliases: []

      {

      }
    ];

    const defaultArticleData = [
      {
        id: 's1',
        para: 1,
        text: "In October 2017, astronomers in Hawaii saw something surprising.",
        segments: [
          { text: "In October 2017, ", type: "adverbial", label: "状语" },
          { text: "astronomers ", type: "subject", label: "主语(复数)" },
          { text: "in Hawaii ", type: "modifier", label: "定语" },
          { text: "saw ", type: "verb", label: "谓语(过去时)" },
          { text: "something ", type: "object", label: "宾语" },
          { text: "surprising.", type: "modifier", label: "定语(分词)" }
        ],
        translation: "2017年10月，夏威夷的天文学家看到了一些令人惊讶的现象。",
        grammarFocus: "时态与原形 / 主谓一致 / 非谓语",
        analysis: "### 【主干结构】\n主句的主语是 **astronomers**，谓语是 **saw**，宾语是 **something**。\n\n### 【主谓一致】\n主语 astronomers（天文学家）为可数名词复数形式。\n\n### 【动词时态与原形】\n谓语动词 `saw` 是一般过去时，其动词原形为 `see`。由于是一般过去时，谓语动词的形态不受主语单复数影响。\n\n### 【非谓语动词】\n`surprising`（令人惊讶的）是现在分词（原形 `surprise`）在此处作后置定语，修饰不定代词 `something`（英语规则：修饰不定代词的形容词必须后置）。\n\n### 【代词指代】\n`something` 为不定代词，指代某种未知的现象或物体。"
      },
      {
        id: 's2',
        para: 1,
        text: "A strange object was moving through the solar system.",
        segments: [
          { text: "A strange object ", type: "subject", label: "主语(单数)" },

          { text: "through the solar system.", type: "adverbial", label: "状语" }
        ],
        translation: "一个奇怪的物体正穿过太阳系。",
        grammarFocus: "时态 / 主谓一致",
        analysis: "### 【主干结构】\n主句主语是 **object**，谓语是 **was moving**，`through the solar system` 作地点状语。\n\n### 【主谓一致】\n主语 object 为单数第三人称名词，因此系动词严格对应使用单数形式的 `was`。\n\n### 【动词时态与原形】\n`was moving` 构成过去进行时，强调在过去某一特定时间段内正在持续发生的动作。动词原形为 `move`。\n\n### 【被动语态】\n本句为主动语态，物体自己正在移动。"
      },
      {
        id: 's3',
        para: 1,
        text: "They had seen many asteroids before, but this was something different.",

          { text: "They ", type: "subject", label: "主语(复数)" },
          { text: "had seen ", type: "verb", label: "谓语(过去完成时)" },
          { text: "many asteroids ", type: "object", label: "宾语" },
          { text: "before, ", type: "adverbial", label: "状语" },
          { text: "but ", type: "conjunction", label: "连词" },
          { text: "this ", type: "subject", label: "主语(单数)" },

        logicConnector: "but (但是) 表转折，连接两个独立的分句。",
        analysis: "### 【主干结构】\n由 but 连接的并列句。前半句主干：**They had seen asteroids**；后半句主干：**this was something**。\n\n### 【主谓一致】\n前半句主语 They 是复数；后半句主语 this 是单数，对应系动词 was。\n\n### 【动词时态与原形】\n* 前半句 `had seen` 为过去完成时（原形 `see`），表示“看”的动作发生在过去某个时间点之前（即“过去的过去”）；\n* 后半句 `was` 为一般过去时（原形 `be`）。\n\n### 【代词指代】\n`They` 是人称代词主格，指代第一句中的 astronomers；`this` 是指示代词，代指刚出现的这个“奇怪物体”；`something` 是不定代词。"

      },
      {
        id: 's5',
        para: 1,
        text: "The object's speed and direction also showed something surprising.",
        segments: [
          { text: "The object's speed and direction ", type: "subject", label: "主语(并列)" },
          { text: "also ", type: "adverbial", label: "状语" },
          { text: "showed ", type: "verb", label: "谓语" },
          { text: "something surprising.", type: "object", label: "宾语" }
        ],
        translation: "这个物体的速度和方向也显示出了一些令人惊讶的地方。",
        grammarFocus: "并列主语 / 时态",

        analysis: "### 【主干结构】\n主语是 speed and direction，谓语是 showed，宾语是 something。\n\n### 【主谓一致】\n主语由 and 连接的两个名词构成（并列主语），逻辑上为复数概念，但因时态是一般过去时，谓语动词 showed 没有单复数变化。\n\n### 【动词时态与原形】\n`showed` 是一般过去时，动词原形为 `show`。\n\n### 【代词指代】\n`object's` 包含名词所有格，表示归属；`something` 为不定代词。\n\n### 【非谓语动词】\n`surprising`（原形 surprise）现在分词作后置定语修饰 something。"

      }
    ];

    // --- 优雅排版 Markdown 渲染器 ---
    const formatMarkdown = (text, baseClassName = "") => {
      if (!text) return null;
      
      const lines = text.split('\n');
      const result = [];
      let listItems = [];

      const flushList = () => {
        if (listItems.length > 0) {
          result.push(
            <ul className="list-disc pl-6 my-4 space-y-2 text-inherit marker:text-indigo-300" key={`ul-${result.length}`}>
              {listItems}
            </ul>
          );
          listItems = [];
        }
      };

      const parseInline = (str) => {
        const parts = str.split(/(\*\*.*?\*\*|\*.*?\*|`.*?`)/g);
        return parts.map((part, i) => {
          if (part.startsWith('**') && part.endsWith('**')) {
            return <strong key={i} className="font-bold text-slate-900">{part.slice(2, -2)}</strong>;
          }
          if (part.startsWith('*') && part.endsWith('*') && part.length > 2) {
            return <em key={i} className="italic text-slate-700">{part.slice(1, -1)}</em>;
          }
          if (part.startsWith('`') && part.endsWith('`')) {
            return <code key={i} className="bg-indigo-50 text-indigo-700 px-1.5 py-0.5 rounded-md text-[0.9em] font-mono border border-indigo-100/50">{part.slice(1, -1)}</code>;
          }
          return <React.Fragment key={i}>{part}</React.Fragment>;
        });
      };

      lines.forEach((line, index) => {
        const trimmed = line.trim();
        const listMatch = trimmed.match(/^[-*]\s+(.*)/);
        
        if (listMatch) {
          listItems.push(<li key={index}>{parseInline(listMatch[1])}</li>);
        } else {
          flushList();
          if (trimmed.startsWith('### ')) {
            // 使用优雅的左侧强调线替代下划线和卡片框
            result.push(
              <h3 key={index} className="text-xl font-bold text-slate-900 mt-8 mb-4 flex items-center gap-2.5">
                <div className="w-1.5 h-6 bg-indigo-500 rounded-full"></div>
                {parseInline(trimmed.slice(4))}
              </h3>
            );
          } else if (trimmed.startsWith('## ')) {
            result.push(<h2 key={index} className="text-2xl font-bold text-slate-900 mt-10 mb-4">{parseInline(trimmed.slice(3))}</h2>);
          } else if (trimmed.startsWith('# ')) {
            result.push(<h1 key={index} className="text-3xl font-bold text-slate-900 mt-12 mb-5">{parseInline(trimmed.slice(2))}</h1>);
          } else if (trimmed === '---') {
            result.push(<hr key={index} className="my-8 border-slate-100" />);
          } else if (trimmed === '') {
            result.push(<div key={index} className="h-2"></div>); 
          } else {
            result.push(<p key={index} className="mb-4 text-slate-700">{parseInline(line)}</p>); 
          }
        }
      });
      flushList();

      return <div className={baseClassName}>{result}</div>;
    };

    // Structure analyses are long-form teaching content. Treat each markdown
    // heading as a readable section with a compact label rail instead of
    // shrinking the entire explanation into one dense text block.
    const formatStructuralAnalysis = (text = '') => {
      const sections = [];
      let current = { heading: '结构说明', body: [] };
      String(text || '暂无结构分析。').split('\n').forEach(line => {
        const match = line.trim().match(/^#{2,3}\s+(.+)$/);
        if (match) {
          if (current.body.length) sections.push(current);
          current = { heading: match[1].replace(/^【|】$/g, ''), body: [] };
        } else {
          current.body.push(line);
        }
      });
      if (current.body.length || sections.length === 0) sections.push(current);

      return (
        <div className="divide-y divide-slate-100">
          {sections.map((section, index) => (

    const buildGuidedFocusOptions = (sentence = {}) => {

    const buildClauseUnits = (sentence = {}) => {
      const text = sentence.text || '';
      const segments = Array.isArray(sentence.segments) ? sentence.segments : [];
      const units = [];
      if (segments.length > 0) {
        units.push({
          key: 'whole',
          label: '整句',
          indexes: segments.map((_, index) => index)
        });
      }

      if (sentence.logicConnector && /\bbut\b/i.test(sentence.logicConnector) && text.includes(',')) {
        const conjunctionIndex = segments.findIndex(seg => /\bbut\b/i.test(seg.text || ''));
        if (conjunctionIndex > 0 && conjunctionIndex < segments.length - 1) {
          units.push(
            { key: 'part-1', label: '并列分句 1', indexes: segments.map((_, index) => index).filter(index => index < conjunctionIndex) },
            { key: 'part-2', label: '并列分句 2', indexes: segments.map((_, index) => index).filter(index => index > conjunctionIndex) }
          );
        }
      }

      const quotedIndexes = segments
        .map((seg, index) => /[“”"]/u.test(seg.text || '') || /^[“"]/.test(seg.text || '') || /[”"]$/.test(seg.text || '') ? index : -1)
        .filter(index => index !== -1);
      if (quotedIndexes.length > 0) {
        const start = Math.min(...quotedIndexes);
        const end = Math.max(...quotedIndexes);
        units.push({
          key: 'quoted-speech',
          label: '直接引语',
          indexes: segments.map((_, index) => index).filter(index => index >= start && index <= end)
        });
        const outsideIndexes = segments.map((_, index) => index).filter(index => index < start || index > end);
        if (outsideIndexes.length > 0) {
          units.push({
            key: 'reporting-clause',
            label: '引述部分',
            indexes: outsideIndexes
          });
        }
      }

      if (/(that|which|who|because|if|when|although|while)\b/i.test(text)) {
        const clauseIndex = segments.findIndex(seg => /\b(that|which|who|because|if|when|although|while)\b/i.test(seg.text || ''));
        if (clauseIndex !== -1) {
          const leftIndexes = segments.map((_, index) => index).filter(index => index < clauseIndex);
          const rightIndexes = segments.map((_, index) => index).filter(index => index >= clauseIndex);
          if (leftIndexes.length > 0) units.push({ key: 'main-clause', label: '主句部分', indexes: leftIndexes });
          if (rightIndexes.length > 0) units.push({ key: 'sub-clause', label: '从句部分', indexes: rightIndexes });
        }
      }

      return units.filter((unit, index, arr) => {
        const signature = JSON.stringify(unit.indexes || []);
        return (unit.indexes || []).length > 0 && arr.findIndex(item => item.label === unit.label && JSON.stringify(item.indexes || []) === signature) === index;
      }).slice(0, 4);

    const normalizeSegmentLabel = (seg = {}) => {
      const type = seg.type || '';
      const label = (seg.label || '').trim();

      if (GUIDED_SKIP_LABELS.has(label)) return '跳过';

    const normalizeGlossaryEntry = (entry = {}) => {
      const term = String(entry.term || entry.word || '').trim();
      if (!term) return null;
      return {
        term,
        translation: String(entry.translation || entry.meaning || '').trim(),
        kind: String(entry.kind || entry.type || 'term').trim() || 'term',
        note: String(entry.note || entry.context || '').trim(),
        aliases: Array.isArray(entry.aliases)
          ? entry.aliases.map(alias => String(alias || '').trim()).filter(Boolean)
          : []
      };
    };

    const normalizeGlossary = (glossary = []) => {
      if (!Array.isArray(glossary)) return [];
      const byKey = new Map();
      glossary.forEach(raw => {
        const entry = normalizeGlossaryEntry(raw);
        if (!entry) return;
        const key = entry.term.toLowerCase();
        const existing = byKey.get(key);
        if (!existing || (entry.translation && !existing.translation)) {
          byKey.set(key, entry);
        }
      });
      return Array.from(byKey.values()).sort((a, b) => b.term.length - a.term.length || a.term.localeCompare(b.term));
    };

      normalizeGlossary(glossary).forEach(entry => {
        matches.push({ ...entry, match: entry.term });
        (entry.aliases || []).forEach(alias => {
          if (alias) matches.push({ ...entry, match: alias });
        });
      });
      return matches.sort((a, b) => b.match.length - a.match.length);
    };

      const needle = String(word || '').trim().toLowerCase();

      return normalizeGlossary(glossary).find(entry => {
        if (entry.term.toLowerCase() === needle) return true;
        return (entry.aliases || []).some(alias => alias.toLowerCase() === needle);
      }) || null;

    const getDifficultyBand = (grade = 0) => {

    const LEXILE_CALIBRATION_ANCHORS = [
      { raw: -455.6, lexile: 100 },
      { raw: -146.0196, lexile: 100 },
      { raw: 25.86, lexile: 300 },
      { raw: 61.4336, lexile: 300 },
      { raw: 78.0987, lexile: 400 },

    const estimateLexileRawScore = ({ fkGrade = 0, avgSentenceLength = 0, difficultWordRatio = 0, wordCount = 0 }) => {
      let raw = -100 + (fkGrade * 20) + (avgSentenceLength * 14) + (difficultWordRatio * 50);

      // Short early-reader texts behave very differently from normal passages,
      // so we downshift them using the public RIF calibration set.
      if (wordCount < 80) raw -= 180;
      if (wordCount < 50) raw -= 220;

      return raw;
    };

    const calibrateLexileEstimate = (rawScore = 0) => {
      if (!Number.isFinite(rawScore)) return null;
      const anchors = LEXILE_CALIBRATION_ANCHORS;

      if (rawScore <= anchors[0].raw) return Math.round(anchors[0].lexile / 10) * 10;
      if (rawScore >= anchors[anchors.length - 1].raw) return Math.round(anchors[anchors.length - 1].lexile / 10) * 10;

      for (let index = 0; index < anchors.length - 1; index += 1) {
        const current = anchors[index];
        const next = anchors[index + 1];
        if (rawScore < current.raw || rawScore > next.raw) continue;

        if (Math.abs(next.raw - current.raw) < 1e-9) {
          return Math.round(next.lexile / 10) * 10;
        }

        const progress = (rawScore - current.raw) / (next.raw - current.raw);
        const calibrated = current.lexile + (next.lexile - current.lexile) * progress;
        return Math.max(0, Math.round(calibrated / 10) * 10);
      }

      return Math.max(0, Math.round(rawScore / 10) * 10);
    };

    const estimateLexileFromReadability = ({ fkGrade = 0, avgSentenceLength = 0, difficultWordRatio = 0, wordCount = 0 }) => {
      const rawScore = estimateLexileRawScore({ fkGrade, avgSentenceLength, difficultWordRatio, wordCount });
      return calibrateLexileEstimate(rawScore);

    const computeArticleReadability = (articleData = []) => {
      const text = joinArticleText(articleData);

      const wordCount = Number(readability.lexiconCount(text) || 0);
      const sentenceCount = Number(readability.sentenceCount(text) || 0);
      const avgSentenceLength = Number(readability.averageSentenceLength(text) || 0);
      const difficultWordCount = Number(readability.difficultWords(text) || 0);
      const fkGrade = Number(readability.fleschKincaidGrade(text) || 0);
      const readingEase = Number(readability.fleschReadingEase(text) || 0);
      const difficultWordRatio = wordCount > 0 ? difficultWordCount / wordCount : 0;
      const estimatedLexile = estimateLexileFromReadability({ fkGrade, avgSentenceLength, difficultWordRatio, wordCount });

      return {
        wordCount,
        sentenceCount,
        avgSentenceLength,
        difficultWordCount,
        difficultWordRatio,
        fkGrade: Number.isFinite(fkGrade) ? fkGrade : null,
        readingEase: Number.isFinite(readingEase) ? readingEase : null,

    const formatLexile = (value) => {

    const formatGrade = (value) => {

    };

    const getDifficultyBandShortLabel = (band = '') => {
      if (band === 'Very Easy') return 'VE.';
      if (band === 'Easy') return 'EZ.';
      if (band === 'Moderate') return 'MOD.';
      if (band === 'Challenging') return 'CH.';
      if (band === 'Advanced') return 'ADV.';
      return 'N/A';
    };

    const HoverTip = ({ text, align = 'left', wide = false, children }) => (
      <span className="group relative inline-flex">
        {children}
        <span
          className={`pointer-events-none absolute top-full z-30 mt-2 rounded-xl bg-slate-950 px-3 py-2 text-[11px] leading-4 text-white shadow-xl ring-1 ring-white/10 opacity-0 translate-y-1 transition-all duration-150 group-hover:opacity-100 group-hover:translate-y-0 group-focus-within:opacity-100 group-focus-within:translate-y-0 ${
            wide ? 'w-72' : 'w-max max-w-[16rem]'
          } ${
            align === 'right' ? 'right-0' : 'left-0'
          }`}
        >
          {text}
        </span>
      </span>
    );

    const getGradeShortLabel = (value) => (
      value === null || value === undefined || Number.isNaN(value)
        ? 'G-N/A'
        : `G${Number(value).toFixed(1)}`
    );

    const getWordCountShortLabel = (value) => (
      value === null || value === undefined || Number.isNaN(value)
        ? 'N/A'
        : `${value}w`
    );

    const getReadabilityTooltip = (kind, readability = {}) => {
      if (kind === 'lexile') {
        return `Lexile 估算值：${formatLexile(readability.estimatedLexile)}。基于公开样本校准的自动难度估算，并非官方认证分值。`;
      }
      if (kind === 'grade') {
        const grade = Number(readability.fkGrade ?? 0).toFixed(1);
        return `Flesch-Kincaid 年级估算。G${grade} 表示大约适合 ${grade} 年级阅读。`;
      }
      if (kind === 'words') {
        return `全文词数。${readability.wordCount ?? 0}w 表示约 ${readability.wordCount ?? 0} 个单词。`;
      }
      if (kind === 'band') {
        return `难度分级。${getDifficultyBandShortLabel(readability.difficultyBand)} 表示 ${readability.difficultyBand || 'Unknown'}。`;
      }
      return '';
    };

    const ReadabilityBadge = ({ kind, readability = {}, theme = 'dark' }) => {
      const tone = theme === 'light'
        ? 'bg-white text-slate-700 border border-slate-200'
        : 'bg-white/10 text-slate-100 border border-white/10';
      const lexileTone = theme === 'light'
        ? 'bg-indigo-50 text-indigo-700 border border-indigo-200'
        : 'bg-white/10 text-indigo-100 border border-white/10';

      const contentByKind = {
        lexile: {
          label: `LX ${formatLexile(readability.estimatedLexile)}`,
          icon: <Info className="w-3.5 h-3.5" />,
          className: lexileTone
        },
        grade: {
          label: getGradeShortLabel(readability.fkGrade),
          icon: null,
          className: tone
        },
        words: {
          label: getWordCountShortLabel(readability.wordCount),
          icon: null,
          className: tone
        },
        band: {
          label: getDifficultyBandShortLabel(readability.difficultyBand),
          icon: null,
          className: tone
        }
      };

      const content = contentByKind[kind];
      if (!content) return null;

      return (
        <HoverTip text={getReadabilityTooltip(kind, readability)}>
          <span className={`inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full cursor-help ${content.className}`}>
            {content.icon}
            {content.label}
          </span>
        </HoverTip>
      );
    };

    const ReadabilityBadgeRow = ({ readability = {}, theme = 'dark', compact = false }) => (
      <div className={`flex flex-wrap gap-2 ${compact ? 'text-[11px]' : 'text-xs'}`}>
        <ReadabilityBadge kind="lexile" readability={readability} theme={theme} />
        <ReadabilityBadge kind="grade" readability={readability} theme={theme} />
        <ReadabilityBadge kind="words" readability={readability} theme={theme} />
        <ReadabilityBadge kind="band" readability={readability} theme={theme} />
      </div>
    );

    const segmentTextList = (segments = []) => segments.map(seg => seg.text?.trim()).filter(Boolean);
    const formatTeachingList = (items = []) => {
      const cleaned = items.map(item => String(item || '').trim()).filter(Boolean);
      if (cleaned.length === 0) return '';
      if (cleaned.length === 1) return cleaned[0];
      if (cleaned.length === 2) return `${cleaned[0]} 和 ${cleaned[1]}`;
      return `${cleaned.slice(0, -1).join('、')}，以及 ${cleaned[cleaned.length - 1]}`;
    };
    const pickFirstMeaningful = (items = []) => items.find(item => String(item || '').trim()) || '';
    const classifyGrammarFocus = (grammarPoints = []) => {
      const text = grammarPoints.join(' / ');
      return {
        hasAgreement: /主谓一致/.test(text),
        hasPronoun: /代词|指代/.test(text),
        hasTenseVoice: /时态|语态|被动/.test(text),
        hasVerbPattern: /动词|非谓语|原形|搭配/.test(text),
        hasPrepPattern: /介词|介宾/.test(text)
      };
    };


    const describeSegmentForChild = (seg = {}) => {
      const text = (seg.text || '').trim();
      const label = normalizeSegmentLabel(seg) || seg.label || '';
      const type = seg.type || '';
      const lower = text.toLowerCase();
      const prefix = text ? `${text} ` : '这一块 ';

      if (type === 'adverbial' || label === '动词修饰语') {
        if (/^(in|on|at|during|before|after|when|while)\b/i.test(lower) || /时间/.test(seg.label || '')) return `${prefix}像一个“时间/地点小贴纸”，告诉我们事情在什么时候、什么地方发生`;
        if (/^(because|for|to|so that)\b/i.test(lower) || /原因|目的/.test(seg.label || '')) return `${prefix}像一个“原因小贴纸”，告诉我们为什么做、为了什么做`;
        return `${prefix}像贴在动作旁边的小贴纸，让动作说得更清楚`;
      }

      if (label === '名词修饰语' || type === 'modifier') {
        if (/^[-—]/.test(text)) return `${prefix}像补充说明的小尾巴，给前面的词多加一点信息`;
        return `${prefix}像贴在名词旁边的小标签，告诉我们这个人或东西是什么样的`;
      }

      if (type === 'conjunction' || label === '连接词') return `${prefix}像一座小桥，把前后两块意思接起来`;
      if (String(type).startsWith('clause') || label === '从句核心') return `${prefix}像句子里的“小房间”，里面也有自己的小结构`;
      return `${prefix}是补充信息，先放在旁边，等主干站稳了再加回来`;
    };

    const getSegmentTextByTypes = (segments = [], types = []) =>
      formatTeachingList(segmentTextList(segments.filter(seg => types.includes(seg.type))));

    const getExcludedMainPartsExplanation = (segments = []) => {
      const extras = segments
        .filter(seg => !['subject', 'verb', 'object', 'predicative', 'clause-subject', 'clause-verb', 'clause-object', 'clause-predicative', 'coord-subject', 'coord-verb', 'coord-object', 'coord-predicative'].includes(seg.type))
        .map(seg => {
          const text = (seg.text || '').trim();
          if (!text) return '';
          return `${describeSegmentForChild(seg)}，先不放进骨架里`;
        })
        .filter(Boolean);
      return extras.length ? `旁边的词先放一放：${extras.join('；')}。` : '这句话的补充信息不多，所以主干会比较清楚。';
    };

    const IRREGULAR_VERB_BASE_MAP = {
      saw: 'see',
      seen: 'see',
      was: 'be',
      were: 'be',
      had: 'have',
      showed: 'show',
      went: 'go',
      came: 'come',
      took: 'take',
      made: 'make',
      found: 'find',
      thought: 'think',
      said: 'say',
      told: 'tell',
      knew: 'know',
      gave: 'give',
      became: 'become',
      wrote: 'write',
      read: 'read',
      felt: 'feel',
      kept: 'keep',
      left: 'leave'
    };

    const inferVerbBaseForm = (verbText = '') => {
      const cleaned = String(verbText || '').trim().toLowerCase();
      if (!cleaned) return '';
      const words = cleaned.split(/\s+/).filter(Boolean);
      const mainWord = words[words.length - 1] || '';
      if (IRREGULAR_VERB_BASE_MAP[mainWord]) return IRREGULAR_VERB_BASE_MAP[mainWord];
      if (mainWord.endsWith('ing')) {
        if (mainWord.endsWith('ying')) return `${mainWord.slice(0, -4)}ie`;
        if (/([b-df-hj-np-tv-z])\1ing$/.test(mainWord)) return mainWord.slice(0, -4);
        if (mainWord.endsWith('ing')) return mainWord.slice(0, -3);
      }
      if (mainWord.endsWith('ied')) return `${mainWord.slice(0, -3)}y`;
      if (mainWord.endsWith('ed')) {
        const stem = mainWord.slice(0, -2);
        return stem.endsWith('e') ? stem : stem;
      }
      return mainWord;
    };

    const describeVerbFormForChild = (verbText = '') => {
      const cleaned = String(verbText || '').trim();
      if (!cleaned) return { label: '动作', explanation: '先看这个动作词，它会告诉我们句子正在说什么。' };

      const lower = cleaned.toLowerCase();
      const base = inferVerbBaseForm(cleaned);
      const baseText = base ? `，它的原形是 ${base}` : '';

      if (/\b(was|were)\s+\w+ing\b/.test(lower)) {
        return {
          label: '过去进行时',
          explanation: `${cleaned} 是过去进行时，表示那时候“正在”发生这个动作${baseText}。`
        };
      }

      if (/\bhad\s+\w+/.test(lower)) {
        return {
          label: '过去完成时',
          explanation: `${cleaned} 是过去完成时，表示这个动作发生在过去某个时间点之前${baseText}。`
        };
      }

      if (/\b(is|am|are|was|were)\s+\w+(ed|en)\b/.test(lower)) {
        return {
          label: '被动表达',
          explanation: `${cleaned} 带有“被怎么样”的感觉，重点是主语受到这个动作影响${baseText}。`
        };
      }

      if (/\b(was|were|did|saw|showed|found|came|went|made|thought|told|knew|gave|became|wrote|felt|kept|left)\b/.test(lower) || /\w+ed\b/.test(lower)) {
        return {
          label: '一般过去时',
          explanation: `${cleaned} 是过去式，表示这件事已经发生过了${baseText}。`
        };
      }

      return {
        label: '核心动作',
        explanation: `${cleaned} 是这句里最重要的动作词${baseText}。`
      };
    };

    const joinRoleSummary = (subjectText = '', verbText = '', objectText = '') =>
      [subjectText, verbText, objectText].filter(Boolean).join(' | ');

    const buildStepSentenceExample = ({ subjectText = '', verbText = '', objectText = '', modifierText = '', clauseText = '', logicConnector = '', pronounRef = '' } = {}) => {
      const parts = [];
      if (subjectText) parts.push(`谁在做：${subjectText}`);
      if (verbText) parts.push(`动作是：${verbText}`);
      if (objectText) parts.push(`动作落点：${objectText}`);
      if (modifierText) parts.push(`旁边的小贴纸：${modifierText}`);
      if (clauseText) parts.push(`句子里的小房间：${clauseText}`);
      if (logicConnector) parts.push(`连接线索：${logicConnector}`);
      if (pronounRef) parts.push(`代词回收：${pronounRef}`);
      return parts;
    };

    const buildMainStepTeaching = (sentence = {}, mainSegments = []) => {
      const subjectText = formatTeachingList(segmentTextList(mainSegments.filter(seg => seg.type === 'subject')));
      const verbText = formatTeachingList(segmentTextList(mainSegments.filter(seg => seg.type === 'verb')));
      const objectText = formatTeachingList(segmentTextList(mainSegments.filter(seg => ['object', 'predicative'].includes(seg.type))));
      const answerParts = [subjectText, verbText, objectText].filter(Boolean);
      const answerText = answerParts.length ? answerParts.join(' | ') : (sentence.text || '先从核心动作开始。');
      const teachingFocus = sentence.teachingFocus || {};
      const thinkingPath = Array.isArray(teachingFocus.thinkingPath) ? teachingFocus.thinkingPath : [];
      const guidingQuestion = teachingFocus.mainQuestion || '这句里真正的动作是什么？谁在做这个动作？';
      const hintLine = thinkingPath.length
        ? `你可以按这个顺序想：${formatTeachingList(thinkingPath)}。`
        : '提示你一下，先找真正的动作，再找动作前后的核心名词或代词。';
      const mistakeLine = teachingFocus.commonMistake || '常见错误是把介词短语、形容词或长修饰语直接误当成主干。';
      const encouragement = teachingFocus.encouragement || '慢慢来，你已经抓到句子的骨架了。';
      const excludedExplanation = getExcludedMainPartsExplanation(sentence.segments || []);
      const verbForm = describeVerbFormForChild(verbText);
      return {
        prompt: `这一小步只做一件事：把句子的骨架找出来。先看动作 ${verbText || '核心动作'}，再看是谁在做，最后看动作落到谁或什么上面。`,
        explanation: `这句的主干可以先收成：${answerText}。其中 ${subjectText || '主语'} 是“谁在做”，${verbText || '谓语'} 是“在做什么”，${objectText || '宾语/表语'} 是“动作落到哪里”或“最后变成什么”。${excludedExplanation}`,
        coachLine: `${encouragement} 这一步只要先把骨架站稳，后面的补充信息就不会把你绕晕。`,
        focusLabel: '先把主线找出来',
        screenTitle: '先找谁在做什么',
        screenPrompt: '我们先把最重要的三块找出来。',
        sentenceCardTitle: '这句里的骨架',
        sentenceCardLines: [
          `谁在做：${subjectText || '还没找到时，先盯动作前面的核心名词'}`,
          `动作是：${verbText || '先找最能表示动作或状态的词'}`,
          `动作落点：${objectText || '再看动作后面最重要的对象或结果'}`
        ],
        voiceSegments: [
          { kind: 'explain', text: `第一步，我们只做一件事：给句子找骨架。骨架通常有三块，谁在做、做了什么、动作落到谁或什么上面。` },
          { kind: 'explain', text: `这句里，${subjectText || '前面的核心成员'} 是主语，表示谁在做；${verbText || '这个动作词'} 是谓语，表示在做什么；${objectText || '后面的结果部分'} 是宾语或表语，表示动作落点或最后的状态。` },
          { kind: 'explain', text: `${verbForm.explanation}` },
          { kind: 'explain', text: `${hintLine}${mistakeLine} ${excludedExplanation}` },
          { kind: 'encourage', text: `${encouragement} 所以这句的主干可以收成：${answerText}。` }
        ]
      };
    };
    const buildGrammarStepTeaching = (sentence = {}, grammarPoints = [], segments = []) => {
      const grammarFlags = classifyGrammarFocus(grammarPoints);
      const verbText = pickFirstMeaningful(segmentTextList(segments.filter(seg => seg.type === 'verb')));
      const subjectText = pickFirstMeaningful(segmentTextList(segments.filter(seg => seg.type === 'subject')));
      const objectText = pickFirstMeaningful(segmentTextList(segments.filter(seg => ['object', 'predicative'].includes(seg.type))));
      const pronounTip = sentence.pronounRef ? `这句还要回收代词指代：${sentence.pronounRef}` : '';
      const teachingFocus = sentence.teachingFocus || {};
      const verbForm = describeVerbFormForChild(verbText);
      const checks = [
        grammarFlags.hasAgreement ? `先看主语 ${subjectText || '的中心词'} 和谓语 ${verbText || '动词'} 是不是搭得上` : '',
        grammarFlags.hasTenseVoice ? `再看谓语 ${verbText || '动词'} 的时态或语态，它会告诉我们动作发生在什么时候、是主动还是被动` : '',
        grammarFlags.hasPronoun ? pronounTip || '再看代词到底指谁，不要让 it、they、this 飘在空中' : '',
        grammarFlags.hasVerbPattern ? '如果看到非谓语或动词搭配，要先分清哪个是核心谓语，哪个只是补充动作' : '',
        grammarFlags.hasPrepPattern ? '看到介词时别急着往主干里塞，先判断它是在补地点、时间，还是固定搭配' : ''
      ].filter(Boolean);
      const fallbackChecks = [
        `先看主语 ${subjectText || '的中心词'} 和谓语 ${verbText || '动词'} 能不能对上`,
        '再看时态语态，判断动作发生在什么时候',
        sentence.pronounRef ? pronounTip : '如果句里有代词，再追问它到底指谁'
      ].filter(Boolean);
      const checklist = checks.length ? checks : fallbackChecks;
      const guidingQuestion = teachingFocus.grammarQuestion || '这句最先该盯哪个语法信号，才能不走偏？';
      const mistakeLine = teachingFocus.commonMistake || '常见错误是看见很多术语就慌，却没有先盯住谓语和主语的配合。';
      const encouragement = teachingFocus.encouragement || '语法不是背标签，而是按顺序排查。';
      return {
        prompt: `现在只看语法信号。先盯住谓语 ${verbText || '动词'}，因为它最能告诉我们动作发生在什么时候，以及主语和它配得对不对。`,
        explanation: `这句可以按顺序检查：${formatTeachingList(checklist)}。${grammarPoints.length ? `这句最值得注意的点是：${grammarPoints.join('、')}。` : ''}`,
        coachLine: `${encouragement} 先看谓语，再看主语搭配，最后看代词和补充结构，语法就不会乱。`,
        focusLabel: '看看动作的样子',
        screenTitle: '先看动作长什么样',
        screenPrompt: '这个动作一露面，就会告诉我们很多事。',
        sentenceCardTitle: '这句里的语法信号',
        sentenceCardLines: [
          `主语：${subjectText || '先找动作前最核心的人或物'}`,
          `谓语：${verbText || '先看动作词'}`,
          `谓语说明：${verbForm.explanation}`,
          objectText ? `动作落点：${objectText}` : ''
        ].filter(Boolean),
        voiceSegments: [
          { kind: 'explain', text: `第二步，我们看语法信号。最先盯的不是一大串术语，而是谓语长什么样。` },
          { kind: 'explain', text: `${verbForm.explanation}` },
          { kind: 'explain', text: `再看主语 ${subjectText || '这个成员'} 和谓语 ${verbText || '这个动作'} 配不配。如果主语是单个成员，谓语形式也要跟它搭上。` },
          { kind: 'explain', text: `${pronounTip || '如果句子里有 it、they、this 这样的词，还要回头找它到底指谁。'} ${mistakeLine}`.trim() },
          { kind: 'encourage', text: `${encouragement}${grammarPoints.length ? ` 这句最需要记住的是：${grammarPoints.join('、')}。` : ''}` }
        ]
      };
    };
    const buildModifierStepTeaching = (sentence = {}, modifierSegments = [], clauseSegments = []) => {
      const modifierText = formatTeachingList(segmentTextList(modifierSegments));
      const clauseText = formatTeachingList(segmentTextList(clauseSegments));
      const hasClauseCore = clauseSegments.length > 0;
      const teachingFocus = sentence.teachingFocus || {};
      const guidingQuestion = teachingFocus.modifierQuestion || '这些长长的部分，哪些是在修饰名词，哪些是在补充动作，哪些其实是从句？';
      const mistakeLine = teachingFocus.commonMistake || '常见错误是把所有长结构都一股脑塞回主干，结果主干越找越乱。';
      const encouragement = teachingFocus.encouragement || '你不是在拆碎句子，而是在给主干减负。';
      return {
        prompt: `主干抓住以后，再看旁边的小贴纸和小房间。它们不是骨架，但会告诉我们更多细节。`,
        explanation: `${modifierText ? `${modifierText} 更像贴在名词或动作旁边的小标签，告诉我们时间、地点、样子或补充说明。` : '这句补充部分不多，所以更适合练习把骨架和补充分开。'}${hasClauseCore ? ` 如果看到 ${clauseText}，就把它当成句子里的小房间，里面也有自己的小结构。` : ''}`,
        coachLine: `${encouragement} 先分清骨架和补充，长句就会立刻轻很多。`,
        focusLabel: '把旁边的小信息理一理',
        screenTitle: '看看哪些是小贴纸',
        screenPrompt: '这些小贴纸会补充意思，但不用抢主位。',
        sentenceCardTitle: '这句里的补充信息',
        sentenceCardLines: [
          modifierText ? `小贴纸：${modifierText}` : '这句补充信息不多，重点是别把小贴纸误当骨架。',
          hasClauseCore ? `小房间：${clauseText}` : '这句没有特别大的从句小房间。',
          '主干先站好，补充信息再慢慢挂回去。'
        ],
        voiceSegments: [
          { kind: 'explain', text: `第三步，我们看补充信息。补充信息不是骨架，但它会让句子更完整。` },
          { kind: 'explain', text: `${modifierText ? `这句里的小贴纸主要有：${modifierText}。它们告诉我们时间、地点、样子，或者多加一点说明。` : '这句补充信息不多，所以更适合练习“先骨架，后补充”。'}` },
          { kind: 'explain', text: `${hasClauseCore ? `如果看到 ${clauseText}，就把它想成句子里的小房间。它自己也有小结构，但它是来补充主句的。` : '这句没有特别大的从句，所以我们重点练习把修饰语和主干分开。'}` },
          { kind: 'explain', text: `${mistakeLine} 看到长尾巴时，不要全塞进主干里。` },
          { kind: 'encourage', text: `${encouragement} 你现在是在帮句子减负。` }
        ]
      };
    };
    const buildRelationshipStepTeaching = (sentence = {}, clauseSegments = []) => {
      const clauseText = formatTeachingList(segmentTextList(clauseSegments));
      const pronounTip = sentence.pronounRef ? `代词还要回收到前文：${sentence.pronounRef}` : '';
      const teachingFocus = sentence.teachingFocus || {};
      const guidingQuestion = teachingFocus.relationshipQuestion || '这句到底是在并列推进、转折，还是主句带着补充信息往前走？';

          }

      } else if (document.caretPositionFromPoint) {
        const pos = document.caretPositionFromPoint(clientX, clientY);
        if (pos?.offsetNode) {
          range = document.createRange();
          range.setStart(pos.offsetNode, pos.offset);
          range.collapse(true);
        }
      }
      if (!range || range.startContainer.nodeType !== Node.TEXT_NODE) return null;

      const textNode = range.startContainer;
      const text = textNode.textContent || '';
      let start = range.startOffset;
      let end = range.startOffset;
      while (start > 0 && /[A-Za-z']/.test(text[start - 1])) start -= 1;
      while (end < text.length && /[A-Za-z']/.test(text[end])) end += 1;
      const raw = text.slice(start, end);
      const word = normalizeLookupWord(raw);
      if (!word || word.length < 2 || !/[a-z]/i.test(word)) return null;

      const wordRange = document.createRange();
      wordRange.setStart(textNode, start);
      wordRange.setEnd(textNode, end);
      const rect = wordRange.getBoundingClientRect();
      return {
        word,
        x: Math.min(Math.max(rect.left + rect.width / 2, 24), window.innerWidth - 24),
        y: Math.min(Math.max(rect.bottom + 8, 24), window.innerHeight - 80)
      };
    };

    const createLocalDataSnapshot = (articles = [], vocab = []) => ({
      version: 1,
      savedAt: new Date().toISOString(),
      savedArticles: articles,
      vocabBook: vocab
    });

    const QUIZ_PROGRESS_STORAGE_KEY_PREFIX = 'reader_quiz_progress_';

    const normalizeQuizQuestion = (question = {}, fallbackIndex = 0) => {
      const options = Array.isArray(question.options)
        ? question.options
            .map(option => String(option ?? '').trim())
            .filter(Boolean)
        : [];
      const parsedIndex = Number(question.index);
      const answerIndex = Number.isInteger(question.answerIndex) ? question.answerIndex : null;
      const explicitType = String(question.type || '').trim().toLowerCase();
      const inferredType = explicitType || (
        Number.isInteger(answerIndex) && options.length >= 2 ? 'single' : 'unsupported'
      );
      const normalizedType = inferredType === 'single' && Number.isInteger(answerIndex) && options.length >= 2
        ? 'single'
        : 'unsupported';
      return {
        ...question,
        id: String(question.id || `q${parsedIndex || fallbackIndex + 1}`),
        index: Number.isFinite(parsedIndex) ? parsedIndex : fallbackIndex + 1,
        prompt: String(question.prompt || '').trim(),
        options,
        answerIndex,
        paragraphHint: question.paragraphHint == null || question.paragraphHint === ''
          ? null
          : String(question.paragraphHint).trim(),
        type: normalizedType,
        rawAnswer: question.rawAnswer ? String(question.rawAnswer).trim() : ''
      };
    };

    const normalizeArticleQuestions = (article = {}) => {
      const combined = [
        ...(Array.isArray(article.questions) ? article.questions : []),
        ...(Array.isArray(article.unsupportedQuestions) ? article.unsupportedQuestions : [])
      ];
      return combined
        .map((question, index) => normalizeQuizQuestion(question, index))
        .sort((left, right) => left.index - right.index);
    };

    const isSupportedQuizQuestion = (question = {}) =>
      question.type === 'single' &&
      Number.isInteger(question.answerIndex) &&
      Array.isArray(question.options) &&
      question.options.length >= 2;

    const createEmptyQuizProgress = () => ({
      answers: {},
      submitted: false,
      submittedAt: null
    });

    const normalizeQuizProgress = (progress = {}) => {
      const normalizedAnswers = Object.entries(progress?.answers || {}).reduce((acc, [questionId, value]) => {
        if (Number.isInteger(value)) acc[questionId] = value;
        return acc;
      }, {});
      return {
        answers: normalizedAnswers,
        submitted: Boolean(progress?.submitted),
        submittedAt: progress?.submittedAt || null
      };

    const getQuizProgressStorageKey = (articleId) =>

    const fetchBundledLibraryArticles = async () => {
      const bundles = await Promise.all(BUNDLED_LIBRARY_URLS.map(async (url) => {

        const importedData = await response.json();
        if (!Array.isArray(importedData)) throw new Error(`预置教材文件格式不正确：${url}`);
        return importedData;
      }));
      return mergeSavedArticles([], bundles.flat());
    };

    const normalizeVocabBook = (vocab = []) => Array.isArray(vocab) ? vocab : [];

    const LIBRARY_FILTERS = [
      { key: 'all', label: '全部' },
      { key: 'rfd1', label: 'RFD1' },
      { key: 'rfd2', label: 'RFD2' },
      { key: 'rfd3', label: 'RFD3' },
      { key: '四上', label: '四上' },
      { key: 'tpo', label: 'TPO' },
      { key: 'og', label: 'OG' },
      { key: 're', label: 'RE' }
    ];

    const getArticleFilterKey = (article = {}) => {
      const sourceText = [
        article.id,
        article.title,
        article.source?.file,
        article.source?.section
      ].filter(Boolean).join(' ').toLowerCase();

      if (sourceText.includes('rfd1')) return 'rfd1';
      if (sourceText.includes('rfd2')) return 'rfd2';
      if (sourceText.includes('rfd3')) return 'rfd3';
      if (sourceText.includes('四上')) return '四上';
      if (sourceText.includes('tpo-')) return 'tpo';
      if (sourceText.includes('og /') || sourceText.includes('og-test') || sourceText.includes('online-test') || sourceText.includes('official-model-exam')) return 'og';
      if (sourceText.includes('re-foundations') || sourceText.includes('re foundations')) return 're';
      return 'other';
    };

    const getTpoArticleCount = (articles = []) =>
      normalizeSavedArticles(articles)
        .filter(article => getArticleFilterKey(article) === 'tpo')
        .length;

    const getReFoundationsArticleCount = (articles = []) =>
      normalizeSavedArticles(articles)
        .filter(article => getArticleFilterKey(article) === 're')
        .length;

    const sortArticlesByTitle = (articles = []) =>
      [...articles].sort((left, right) =>
        String(left.title || '').localeCompare(String(right.title || ''), 'en', {
          numeric: true,
          sensitivity: 'base'
        })
      );

    const mergeSavedArticles = (current = [], incoming = []) => {
      const byId = new Map();
      [...normalizeSavedArticles(current), ...normalizeSavedArticles(incoming)].forEach(article => {
        if (!article || !article.id) return;
        const existing = byId.get(article.id);
        if (!existing || (article.timestamp || 0) >= (existing.timestamp || 0)) {
          byId.set(article.id, article);
        }
      });
      return Array.from(byId.values()).sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
    };

    const mergeVocabBook = (current = [], incoming = []) => {
      const byKey = new Map();
      [...normalizeVocabBook(current), ...normalizeVocabBook(incoming)].forEach(word => {
        if (!word) return;
        const key = (word.word || word.id || '').toString().trim().toLowerCase();
        if (!key) return;
        const existing = byKey.get(key);
        if (!existing || (word.timestamp || 0) >= (existing.timestamp || 0)) {
          byKey.set(key, word);
        }
      });
      return Array.from(byKey.values()).sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
    };

    const readLocalDataFile = async () => {
      if (!navigator.storage?.getDirectory) {
        throw new Error('当前浏览器不支持本地文件持久化。');
      }
      const root = await navigator.storage.getDirectory();
      const handle = await root.getFileHandle(LOCAL_DATA_FILE_NAME, { create: true });
      const file = await handle.getFile();
      const text = await file.text();
      if (!text.trim()) return createLocalDataSnapshot();
      const parsed = JSON.parse(text);
      return {
        version: parsed.version || 1,
        savedAt: parsed.savedAt || "",
        savedArticles: Array.isArray(parsed.savedArticles) ? parsed.savedArticles : [],
        vocabBook: Array.isArray(parsed.vocabBook) ? parsed.vocabBook : []
      };
    };

    const writeLocalDataFile = async (articles, vocab) => {
      if (!navigator.storage?.getDirectory) {
        throw new Error('当前浏览器不支持本地文件持久化。');
      }
      const root = await navigator.storage.getDirectory();
      const handle = await root.getFileHandle(LOCAL_DATA_FILE_NAME, { create: true });
      const writable = await handle.createWritable();
      await writable.write(JSON.stringify(createLocalDataSnapshot(articles, vocab), null, 2));
      await writable.close();
    };

    // Full reader bundles are larger than the browser's localStorage quota.
    // OPFS is the primary store; localStorage is a best-effort fallback only.
    const trySetLocalStorage = (key, value) => {
      try {
        localStorage.setItem(key, value);
        return true;
      } catch (error) {
        if (error?.name === 'QuotaExceededError') {
          console.warn(`localStorage quota reached; ${key} will remain in the local data file.`, error);
          return false;
        }
        throw error;
      }
    };

    const clearLocalLearningStorage = async () => {
      localStorage.removeItem('my_local_articles');
      localStorage.removeItem('my_local_vocab_book');

      if (navigator.storage?.getDirectory) {
        const root = await navigator.storage.getDirectory();
        const handle = await root.getFileHandle(LOCAL_DATA_FILE_NAME, { create: true });
        const writable = await handle.createWritable();
        await writable.write(JSON.stringify(createLocalDataSnapshot([], []), null, 2));
        await writable.close();
      }
    };

    const buildAiRequestError = (provider, err) => {
      const message = err?.message || '未知错误';
      if (provider === 'ollama') {
        const fileOriginBlocked = window.location.protocol === 'file:' && (
          message.includes('Failed to fetch') ||
          message.includes('NetworkError')
        );
        if (fileOriginBlocked) {
          return new Error('当前浏览器未能从 file:// 页面访问 Ollama。此机器通常可以直接双击 HTML 使用；如果你的浏览器拦截了本地请求，再考虑改用本地静态服务。');
        }
        return new Error(`Ollama 请求失败：${message}`);
      }
      return new Error(`云端模型请求失败：${message}`);
    };

    const formatElapsed = (ms = 0) => {
      const totalSeconds = Math.max(0, Math.floor(ms / 1000));
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      return minutes > 0 ? `${minutes}分${seconds}秒` : `${seconds}秒`;
    };

    const decodeOpenAICompatStream = async (response, onProgress) => {
      if (!response.body) {
        const data = await response.json();
        return data?.choices?.[0]?.message?.content || "";
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let content = "";
      let chunkCount = 0;

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        const parts = buffer.split("\n\n");
        buffer = parts.pop() || "";

        for (const part of parts) {
          const lines = part.split("\n").map(line => line.trim()).filter(Boolean);
          for (const line of lines) {
            if (!line.startsWith("data:")) continue;
            const payload = line.slice(5).trim();
            if (!payload || payload === "[DONE]") continue;
            try {
              const parsed = JSON.parse(payload);
              const delta = parsed?.choices?.[0]?.delta?.content || "";
              if (delta) {
                content += delta;
                chunkCount += 1;
                onProgress?.({
                  phase: 'streaming',
                  receivedChars: content.length,
                  receivedChunks: chunkCount,
                  lastProgressAt: Date.now(),
                  text: content
                });
              }
            } catch (_) {
              // Ignore malformed interim SSE chunks and continue collecting.
            }
          }
        }
      }

      if (!content.trim()) {
        throw new Error('云端模型返回了空响应。');
      }
      return content;
    };

    const decodeOllamaStream = async (response, onProgress) => {
      if (!response.body) {
        const data = await response.json();
        return data?.message?.content?.trim?.() || "";
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let content = "";
      let chunkCount = 0;

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        const lines = buffer.split("\n");
        buffer = lines.pop() || "";

        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed) continue;
          try {
            const parsed = JSON.parse(trimmed);
            const piece = parsed?.message?.content || "";
            if (piece) {
              content += piece;
              chunkCount += 1;
              onProgress?.({
                phase: 'streaming',
                receivedChars: content.length,
                receivedChunks: chunkCount,
                lastProgressAt: Date.now(),
                text: content
              });
            }
          } catch (_) {
            // Ignore malformed interim NDJSON lines and continue collecting.
          }
        }
      }

      if (!content.trim()) {
        throw new Error('Ollama 返回了空响应。');
      }
      return content.trim();
    };

    const fetchOpenAICompatResponse = async ({
      userPrompt,
      systemPrompt,
      expectJson = false,
      apiKey = DEFAULT_OPENAI_COMPAT_API_KEY,
      model = DEFAULT_OPENAI_COMPAT_MODEL,
      baseUrl = DEFAULT_OPENAI_COMPAT_BASE_URL,
      onProgress
    }) => {
      const trimmedApiKey = sanitizeApiCredential(apiKey);
      if (!trimmedApiKey) {
        throw new Error('请先填写云端模型 API Key。');
      }
      if (/[^\x20-\x7E]/.test(trimmedApiKey)) {
        throw new Error('云端模型 API Key 包含异常字符。请重新粘贴纯文本 Key，避免中文空格、换行或隐藏字符。');
      }

      const url = `${baseUrl.replace(/\/+$/, '')}/chat/completions`;
      if (!baseUrl.trim()) {
        throw new Error('请先填写云端模型 API Base。');
      }
      if (!model.trim()) {
        throw new Error('请先填写云端模型名称。');
      }
      const payload = {
        model,
        stream: true,
        temperature: 0.6,
        max_tokens: 32000,
        response_format: expectJson ? { type: 'json_object' } : { type: 'text' },
        messages: [
          { role: 'system', content: systemPrompt },
          { role: 'user', content: userPrompt }
        ]
      };

      const delays = [1000, 2000];
      let lastError;

      for (let attempt = 0; attempt < 3; attempt++) {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 60000); // 60秒超时限制
        try {
          onProgress?.({ phase: 'requesting', lastProgressAt: Date.now() });
          const response = await fetch(url, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": `Bearer ${trimmedApiKey}`
            },
            body: JSON.stringify(payload),
            signal: controller.signal
          });
          clearTimeout(timeoutId);

          if (!response.ok) {
            const text = await response.text();
            const errMsg = `HTTP ${response.status}${text ? `: ${text}` : ''}`;
            const err = new Error(errMsg);
            // 400(Bad Request), 401(Unauthorized), 403(Forbidden), 404(Not Found) 等属于配置错误，不予重试直接抛出
            if ([400, 401, 403, 404].includes(response.status)) {
              throw err;
            }
            throw err;
          }
          onProgress?.({ phase: 'connected', lastProgressAt: Date.now() });
          const content = await decodeOpenAICompatStream(response, onProgress);
          return content;
        } catch (err) {
          clearTimeout(timeoutId);
          lastError = err;
          // 如果是 AbortError (超时) 或特定的网络配置错误，可以尝试重试；如果是 4xx 错误，直接向上抛出
          const isAbort = err.name === 'AbortError';
          const isConfigError = err.message.includes('HTTP 400') || err.message.includes('HTTP 401') || err.message.includes('HTTP 403') || err.message.includes('HTTP 404');
          if (isConfigError) {
            break;
          }
          if (attempt < 2) {
            await new Promise(r => setTimeout(r, delays[attempt]));
          }
        }
      }
      throw buildAiRequestError('cloud', lastError);
    };

    // 长文解析可能持续远超 5 分钟；用「空闲超时」代替绝对超时：
    // 有流式进度就重置计时，模型卡死无输出才会中断；另设绝对上限防挂死。
    // 空闲窗口略放宽，覆盖长文首 token 前的预填充等待。
    const OLLAMA_IDLE_TIMEOUT_MS = 10 * 60 * 1000;
    const OLLAMA_MAX_TIMEOUT_MS = 45 * 60 * 1000;

    const fetchOllamaResponse = async ({
      userPrompt,
      systemPrompt,
      expectJson = false,
      baseUrl = DEFAULT_OLLAMA_BASE_URL,
      model = DEFAULT_OLLAMA_MODEL,
      onProgress
    }) => {
      const cleanBaseUrl = sanitizeBaseUrl(baseUrl);
      const cleanModel = model.trim();
      if (!cleanModel) {
        throw new Error('请先填写 Ollama 模型名。');
      }

      const abortController = new AbortController();
      let abortReason = '';
      let idleTimeoutId = null;
      const absoluteTimeoutId = setTimeout(() => {
        abortReason = 'absolute';
        abortController.abort();
      }, OLLAMA_MAX_TIMEOUT_MS);

      const clearAllTimeouts = () => {
        if (idleTimeoutId) clearTimeout(idleTimeoutId);
        clearTimeout(absoluteTimeoutId);
      };

      const resetIdleTimeout = () => {
        if (idleTimeoutId) clearTimeout(idleTimeoutId);
        idleTimeoutId = setTimeout(() => {
          abortReason = 'idle';
          abortController.abort();
        }, OLLAMA_IDLE_TIMEOUT_MS);
      };

      const wrappedOnProgress = (progress) => {
        resetIdleTimeout();
        onProgress?.(progress);
      };

      resetIdleTimeout();
      try {
        wrappedOnProgress({ phase: 'requesting', lastProgressAt: Date.now() });
        const response = await fetch(`${cleanBaseUrl}/api/chat`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          signal: abortController.signal,
          body: JSON.stringify({
            model: cleanModel,
            stream: true,
            think: false,
            options: {
              temperature: expectJson ? 0.1 : 0.3,
              num_predict: 32000,
              num_ctx: 32768
            },
            messages: [
              { role: "system", content: systemPrompt },
              { role: "user", content: userPrompt }
            ]
          })
        });

        if (!response.ok) {
          const text = await response.text();
          throw new Error(`HTTP ${response.status}${text ? `: ${text}` : ''}`);
        }

        wrappedOnProgress({ phase: 'connected', lastProgressAt: Date.now() });
        const content = await decodeOllamaStream(response, wrappedOnProgress);
        clearAllTimeouts();
        return content;
      } catch (err) {
        clearAllTimeouts();
        if (err.name === 'AbortError') {
          if (abortReason === 'idle') {
            throw new Error('Ollama 长时间无响应（10分钟无新内容），请检查模型是否正常运行。');
          }
          throw new Error('Ollama 请求超时（已超过 45 分钟），请尝试缩短文本或稍后重试。');
        }
        throw buildAiRequestError('ollama', err);
      }
    };

    const fetchOllamaJsonResponse = async ({
      userPrompt,
      systemPrompt,
      baseUrl = DEFAULT_OLLAMA_BASE_URL,
      model = DEFAULT_OLLAMA_MODEL,
      onProgress
    }) => {
      const primaryPrompt = `${systemPrompt}\n\n【输出要求】\n1. 你必须输出合法 JSON。\n2. 不要输出 Markdown 代码块。\n3. 不要输出解释、前言或结语。\n4. JSON 之外不能有任何文字。`;

      const firstRaw = await fetchOllamaResponse({
        userPrompt,
        systemPrompt: primaryPrompt,
        expectJson: false,
        baseUrl,
        model,
        onProgress
      });

      try {
        onProgress?.({ phase: 'validating_json', lastProgressAt: Date.now() });
        return parseJsonWithRecovery(firstRaw).candidate;
      } catch (firstError) {
        onProgress?.({ phase: 'repairing_json', lastProgressAt: Date.now() });
        const repairPrompt = `你刚才的输出不是合法 JSON。请在不降低要求、不省略字段的前提下，把下面内容修复成唯一的合法 JSON 输出。\n\n【原始输出开始】\n${firstRaw}\n【原始输出结束】`;

        const repairedRaw = await fetchOllamaResponse({
          userPrompt: repairPrompt,
          systemPrompt: `${systemPrompt}\n\n【修复要求】\n1. 保留原任务要求和字段结构。\n2. 只输出合法 JSON。\n3. 不要输出代码块。\n4. 不要输出任何解释。`,
          expectJson: false,
          baseUrl,
          model,
          onProgress
        });

        try {
          onProgress?.({ phase: 'validating_json', lastProgressAt: Date.now() });
          return parseJsonWithRecovery(repairedRaw).candidate;
        } catch (repairError) {
          throw new Error(`Ollama 返回内容未通过 JSON 校验。首次错误：${firstError.message}；修复后仍失败：${repairError.message}`);
        }
      }
    };

    const fetchOpenAICompatJsonResponse = async ({
      userPrompt,
      systemPrompt,
      apiKey = DEFAULT_OPENAI_COMPAT_API_KEY,
      model = DEFAULT_OPENAI_COMPAT_MODEL,
      baseUrl = DEFAULT_OPENAI_COMPAT_BASE_URL,
      onProgress
    }) => {
      const primaryPrompt = `${systemPrompt}\n\n【输出要求】\n1. 你必须输出合法 JSON。\n2. 不要输出 Markdown 代码块。\n3. 不要输出解释、前言或结语。\n4. JSON 之外不能有任何文字。`;

      const firstRaw = await fetchOpenAICompatResponse({
        userPrompt,
        systemPrompt: primaryPrompt,
        expectJson: false,
        apiKey,
        model,
        baseUrl,
        onProgress
      });

      try {
        onProgress?.({ phase: 'validating_json', lastProgressAt: Date.now() });
        return parseJsonWithRecovery(firstRaw).candidate;
      } catch (firstError) {
        onProgress?.({ phase: 'repairing_json', lastProgressAt: Date.now() });
        const repairPrompt = `你刚才的输出不是合法 JSON，很可能存在字符串未闭合、转义不完整、换行破坏 JSON、或末尾截断。请在不降低要求、不省略字段的前提下，把下面内容修复成唯一的合法 JSON 输出。\n\n【原始输出开始】\n${firstRaw}\n【原始输出结束】`;

        const repairedRaw = await fetchOpenAICompatResponse({
          userPrompt: repairPrompt,
          systemPrompt: `${systemPrompt}\n\n【修复要求】\n1. 保留原任务要求和字段结构。\n2. 只输出合法 JSON。\n3. 不要输出代码块。\n4. 不要输出任何解释。`,
          expectJson: false,
          apiKey,
          model,
          baseUrl,
          onProgress
        });

        try {
          onProgress?.({ phase: 'validating_json', lastProgressAt: Date.now() });
          return parseJsonWithRecovery(repairedRaw).candidate;
        } catch (repairError) {
          throw new Error(`云端模型返回内容未通过 JSON 校验。首次错误：${firstError.message}；修复后仍失败：${repairError.message}`);
        }
      }

        const writeCloudState = async () => {

            try {
              const endpoint = useCosyVoice ? '/api/tts/cosyvoice' : '/api/tts/hermes';

                headers: { 'Content-Type': 'application/json' },

              if (!res.ok || json.code || json.error) {
