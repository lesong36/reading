          const clauseSelections = sentenceSelections[clauseKey] || {};
          const stepSelections = clauseSelections[stepKey] || {};
          const roleSelections = stepSelections[roleKey] || [];
          const nextRoleSelections = roleSelections.includes(segmentIndex)
            ? roleSelections.filter(index => index !== segmentIndex)
            : [...roleSelections, segmentIndex].sort((a, b) => a - b);
          return {
            ...prev,
            [sentenceId]: {
              ...sentenceSelections,
              [clauseKey]: {
                ...clauseSelections,
                [stepKey]: {
                  ...stepSelections,
                  [roleKey]: nextRoleSelections
                }
              }
            }
          };
        });
        setGuidedCheckState(prev => ({
          ...prev,
          [sentenceId]: {
            ...(prev[sentenceId] || {}),
            [clauseKey]: {
              ...((prev[sentenceId] || {})[clauseKey] || {}),
              [stepKey]: null
            }
          }
        }));
      };

      const handleGuidedDrop = (sentence, segmentIndex, roleKey) => {
        if (!guidedInteractiveStep || !roleKey) return;
        setGuidedActiveRole(roleKey);
        const sentenceId = sentence.id;
        const clauseKey = guidedCurrentClause;
        const stepKey = guidedStepIndex;
        setGuidedSelections(prev => {
          const sentenceSelections = prev[sentenceId] || {};
          const clauseSelections = sentenceSelections[clauseKey] || {};
          const stepSelections = clauseSelections[stepKey] || {};
          const nextStepSelections = Object.fromEntries(
            Object.entries(stepSelections).map(([key, indexes]) => [key, (indexes || []).filter(index => index !== segmentIndex)])
          );
          const roleSelections = nextStepSelections[roleKey] || [];
          nextStepSelections[roleKey] = [...roleSelections, segmentIndex].sort((a, b) => a - b);
          return {
            ...prev,
            [sentenceId]: {
              ...sentenceSelections,
              [clauseKey]: {
                ...clauseSelections,
                [stepKey]: nextStepSelections
              }
            }
          };
        });
        setGuidedCheckState(prev => ({
          ...prev,
          [sentenceId]: {
            ...(prev[sentenceId] || {}),
            [clauseKey]: {
              ...((prev[sentenceId] || {})[clauseKey] || {}),
              [stepKey]: null
            }
          }
        }));
      };

      const handleGuidedCheck = () => {
        const isCorrect = mapsMatch(guidedCurrentSelections, guidedExpectedSelections);
        setGuidedCheckState(prev => ({
          ...prev,
          [selectedSentence.id]: {
            ...(prev[selectedSentence.id] || {}),
            [guidedCurrentClause]: {
              ...((prev[selectedSentence.id] || {})[guidedCurrentClause] || {}),
              [guidedStepIndex]: isCorrect ? 'correct' : 'incorrect'
            }
          }
        }));
      };

      const revealGuidedAnswer = () => {
        setGuidedSelections(prev => ({
          ...prev,
          [selectedSentence.id]: {
            ...(prev[selectedSentence.id] || {}),
            [guidedCurrentClause]: {
              ...((prev[selectedSentence.id] || {})[guidedCurrentClause] || {}),
              [guidedStepIndex]: guidedExpectedSelections
            }
          }
        }));
        setGuidedCheckState(prev => ({
          ...prev,
          [selectedSentence.id]: {
            ...(prev[selectedSentence.id] || {}),
            [guidedCurrentClause]: {
              ...((prev[selectedSentence.id] || {})[guidedCurrentClause] || {}),
              [guidedStepIndex]: 'revealed'
            }
          }
        }));
      };

      const resetGuidedCurrentStep = () => {
        setGuidedSelections(prev => ({
          ...prev,
          [selectedSentence.id]: {
            ...(prev[selectedSentence.id] || {}),
            [guidedCurrentClause]: {
              ...((prev[selectedSentence.id] || {})[guidedCurrentClause] || {}),
              [guidedStepIndex]: {}
            }
          }
        }));
        setGuidedCheckState(prev => ({
          ...prev,
          [selectedSentence.id]: {
            ...(prev[selectedSentence.id] || {}),
            [guidedCurrentClause]: {
              ...((prev[selectedSentence.id] || {})[guidedCurrentClause] || {}),
              [guidedStepIndex]: null
            }
          }
        }));
      };

      const getGuidedSegmentClassName = (sentence, segmentIndex) => {
        if (sentence.id !== selectedSentence.id) return 'text-slate-800';
        const basePalette = {
          subject: 'bg-red-100 text-red-900 border border-red-200',
          verb: 'bg-blue-100 text-blue-900 border border-blue-200',
          object: 'bg-green-100 text-green-900 border border-green-200',
          predicative: 'bg-emerald-100 text-emerald-900 border border-emerald-200',
          conjunction: 'bg-purple-100 text-purple-900 border border-purple-200',
          'noun-modifier': 'bg-amber-100 text-amber-900 border border-amber-200',
          'verb-modifier': 'bg-slate-200 text-slate-800 border border-slate-300',
          clause: 'bg-fuchsia-100 text-fuchsia-900 border border-fuchsia-200'
        };

        const mainRole = GUIDED_MAIN_ROLE_OPTIONS.find(option => (guidedMainSelections[option.key] || []).includes(segmentIndex));
        const currentRole = guidedRoleOptions.find(option => (guidedCurrentSelections[option.key] || []).includes(segmentIndex));
        const focusIndexes = guidedFocusOptions.find(option => option.key === guidedCurrentFocus)?.indexes || [];

        if (guidedStepIndex === 2 && focusIndexes.includes(segmentIndex)) {
          return 'bg-indigo-100 text-indigo-900 border border-indigo-300 ring-2 ring-indigo-300';
        }
        if (currentRole) {
          return basePalette[currentRole.key] || 'bg-indigo-100 text-indigo-900 border border-indigo-200';
        }
        if (mainRole) {
          return basePalette[mainRole.key] || 'bg-indigo-100 text-indigo-900 border border-indigo-200';
        }
        if (!guidedInteractiveStep) return 'text-slate-800 border border-transparent';
        const palette = {
          subject: 'bg-red-100 text-red-900 border border-red-200',
          verb: 'bg-blue-100 text-blue-900 border border-blue-200',
          object: 'bg-green-100 text-green-900 border border-green-200',
          predicative: 'bg-emerald-100 text-emerald-900 border border-emerald-200',
          conjunction: 'bg-purple-100 text-purple-900 border border-purple-200',
          modifier: 'bg-amber-100 text-amber-900 border border-amber-200',
          adverbial: 'bg-slate-200 text-slate-800 border border-slate-300',
          clause: 'bg-fuchsia-100 text-fuchsia-900 border border-fuchsia-200'
        };
        return guidedInteractiveStep ? 'text-slate-800 hover:bg-indigo-50 border border-transparent' : 'text-slate-800 border border-transparent';
      };

      const handleGuidedWordDoubleClick = (e, sentenceText) => {
        openVocabPopupFromEvent(e, sentenceText);
      };

      const saveDictionaryLookupToVocab = (word, contextSentenceText, dictionary) => {
        if (!dictionary?.meaning) return;
        const key = String(word || '').trim().toLowerCase();
        // A lookup can finish after its card was deleted. Deleted words must
        // never be recreated by that delayed automatic save.
        if (deletedVocabKeys.includes(key)) return;
        if (!key || autoAddedVocabKeysRef.current.has(key)) return;
        if (vocabBook.some(entry => String(entry?.word || '').trim().toLowerCase() === key)) return;
        autoAddedVocabKeysRef.current.add(key);
        const generateId = () => window.crypto?.randomUUID ? crypto.randomUUID() : Math.random().toString(36).substring(2, 15);
        setVocabBook(previous => {
          if (previous.some(entry => String(entry?.word || '').trim().toLowerCase() === key)) return previous;
          return [{
            id: generateId(),
            word,
            meaning: dictionary.meaning,
            lemma: dictionary.lemma || word,
            partOfSpeech: dictionary.partOfSpeech || '',
            pronunciation: dictionary.pronunciation || '',
            etymology: dictionary.note || '来自原文语境查词',
            exampleSentence: '',
            sourceContext: contextSentenceText,
            sourceArticleId: currentArticleId || null,
            sourceArticleTitle: currentArticleTitle || '',
            addedAt: new Date().toLocaleDateString(),
            timestamp: Date.now()
          }, ...previous];
        });
        setToastMessage(`✅ 已查词并加入生词本: ${word}`);
      };

      const resolveP920DictionaryModel = async () => {
        if (p920DictionaryModelRef.current) return p920DictionaryModelRef.current;
        const response = await fetch(`${P920_DICTIONARY_BASE_URL}/models`);
        if (!response.ok) throw new Error(`P920 模型列表请求失败（HTTP ${response.status}）`);
        const payload = await response.json();
        const models = [
          ...(payload?.data || []).map(item => item?.id || item?.name),
          ...(payload?.models || []).map(item => item?.id || item?.name || item?.model)
        ].filter(Boolean);
        const model = models.find(id => /qwen/i.test(String(id))) || models[0];
        if (!model) throw new Error('P920 未找到可用模型。');
        p920DictionaryModelRef.current = model;
        return model;
      };

      const lookupContextualDictionary = async (word, contextSentenceText) => {
        const systemPrompt = `你是面向英语阅读学习者的英汉语境词典。只解释目标词在给定句子中的实际用法，不列举其他词义。只输出一个合法 JSON 对象，不要 Markdown：\n{\n  "lemma": "词典原形；短语保留完整短语",\n  "partOfSpeech": "名词|动词|形容词|副词|代词|介词|连词|限定词|短语",\n  "meaning": "不超过 16 个汉字的准确中文释义，不要写‘此处意为’等前缀",\n  "pronunciation": "IPA 音标；可为空字符串",\n  "note": "仅在需要时说明词形变化、支配介词或固定搭配；否则为空字符串"\n}\n\n规则：meaning 必须是这个句子中成立的具体义项；不得给词典式多义列表、泛泛解释、英文释义或占位词。`;
        const userPrompt = `【单词】${word}\n【原文句子】${contextSentenceText}`;
        const toDictionary = ({ content, usage, provider }) => {
          const data = parseAiJsonOrThrow(content, provider);
          const entry = validateContextualDictionary(data, provider);
          return {
            ...entry,
            provider,
            usage: {
              promptTokens: Number(usage?.prompt_tokens || 0),
              completionTokens: Number(usage?.completion_tokens || 0),
              totalTokens: Number(usage?.total_tokens || 0)
            }
          };
        };

        try {
          const model = await resolveP920DictionaryModel();
          return toDictionary({
            ...(await fetchDictionaryJson({
              baseUrl: P920_DICTIONARY_BASE_URL,
              model,
              disableThinking: true,
              systemPrompt,
              userPrompt
            })),
            provider: 'Qwen 特供服务（P920）'
          });
        } catch (qwenError) {
          const deepseekApiKey = LOCAL_PRIVATE_CONFIG.deepseekApiKey || (
            /api\.deepseek\.com/i.test(cloudBaseUrl) ? cloudApiKey : ''
          );
          if (!deepseekApiKey) {
            throw new Error(`Qwen 特供服务不可用：${qwenError.message}；DeepSeek 特供服务未配置 API Key。`);
          }
          try {
            return toDictionary({
              ...(await fetchDictionaryJson({
                baseUrl: DEEPSEEK_DICTIONARY_BASE_URL,
                apiKey: deepseekApiKey,
                model: DEEPSEEK_DICTIONARY_MODEL,
                systemPrompt,
                userPrompt
              })),
              provider: 'DeepSeek Flash V4 特供服务'
            });
          } catch (deepseekError) {
            throw new Error(`Qwen 特供服务失败：${qwenError.message}；DeepSeek Flash V4 特供服务失败：${deepseekError.message}`);
          }
        }
      };

      const openContextualDictionary = async (hit, contextSentenceText) => {
        if (!hit?.word) return;
        const cacheKey = `${currentArticleId || 'unsaved'}::${hit.word}::${contextSentenceText || ''}`;
        const cached = contextualDictionaryCacheRef.current.get(cacheKey);
        const dictionary = cached || null;

        setVocabPopup({
          word: hit.word,
          x: hit.x,
          y: hit.y,
          context: contextSentenceText,
          dictionary,
          lookupState: dictionary ? 'ready' : 'loading',
          lookupProvider: dictionary?.provider || 'Qwen 特供服务（P920）'
        });
        if (dictionary) {
          saveDictionaryLookupToVocab(hit.word, contextSentenceText, dictionary);
          return;
        }

        try {
          const resolved = await lookupContextualDictionary(hit.word, contextSentenceText);
          contextualDictionaryCacheRef.current.set(cacheKey, resolved);
          setVocabPopup(current => (
            current?.word === hit.word && current.context === contextSentenceText
              ? { ...current, dictionary: resolved, lookupState: 'ready', lookupProvider: resolved.provider }
              : current
          ));
          saveDictionaryLookupToVocab(hit.word, contextSentenceText, resolved);
        } catch (error) {
          setVocabPopup(current => (
            current?.word === hit.word && current.context === contextSentenceText
              ? { ...current, lookupState: 'error', lookupError: error.message || '词典查询失败' }
              : current
          ));
        }
      };

      const refreshVocabDefinition = async (entry) => {
        if (!entry?.id || !entry.word || !entry.sourceContext) {
          setToastMessage('⚠️ 这张卡缺少原文语境，无法重新校验释义。');
          return;
        }
        setRefreshingVocabId(entry.id);
        try {
          const dictionary = await lookupContextualDictionary(entry.word, entry.sourceContext);
          const cacheKey = `${entry.sourceArticleId || 'unsaved'}::${entry.word}::${entry.sourceContext}`;
          contextualDictionaryCacheRef.current.set(cacheKey, dictionary);
          setVocabBook(previous => previous.map(word => word.id === entry.id ? {
            ...word,
            meaning: dictionary.meaning,
            lemma: dictionary.lemma || entry.word,
            partOfSpeech: dictionary.partOfSpeech,
            pronunciation: dictionary.pronunciation || word.pronunciation || '',
            etymology: dictionary.note || word.etymology || '',
            definitionCheckedAt: new Date().toISOString(),
            definitionProvider: dictionary.provider
          } : word));
          setToastMessage(`✅ 已按原文语境重新校验 ${entry.word} 的释义。`);
        } catch (error) {
          setToastMessage(`❌ 释义校验失败：${error.message || '请稍后重试'}`);
        } finally {
          setRefreshingVocabId(null);
        }
      };

      const openVocabPopupFromEvent = (e, sentenceText) => {
        setTimeout(() => {
          const fromSelection = getSelectedLookupHit();
          if (fromSelection) {
            openContextualDictionary(fromSelection, fromSelection.contextSentenceText || sentenceText);
            return;
          }
          const point = e?.clientX != null
            ? { x: e.clientX, y: e.clientY }
            : (e?.changedTouches?.[0]
              ? { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY }
              : null);
          if (!point) return;
          const hit = getWordAtClientPoint(point.x, point.y);
          if (!hit) return;
          openContextualDictionary(hit, sentenceText);
        }, 40);
      };

      const wordPressTimerRef = useRef(null);
      const wordPressOriginRef = useRef(null);

      const clearWordPressTimer = () => {
        if (wordPressTimerRef.current) {
          clearTimeout(wordPressTimerRef.current);
          wordPressTimerRef.current = null;
        }
        wordPressOriginRef.current = null;
      };

      const handleWordPressStart = (e, sentenceText, { enabled = true } = {}) => {
        if (!enabled) return;
        const touch = e.touches?.[0];
        if (!touch) return;
        clearWordPressTimer();
        wordPressOriginRef.current = {
          x: touch.clientX,
          y: touch.clientY,
          sentenceText
        };
        wordPressTimerRef.current = setTimeout(() => {
          const origin = wordPressOriginRef.current;
          wordPressTimerRef.current = null;
          if (!origin) return;
          const hit = getWordAtClientPoint(origin.x, origin.y);
          if (!hit) return;
          if (navigator.vibrate) {
            try { navigator.vibrate(12); } catch (_) {}
          }
          openContextualDictionary(hit, origin.sentenceText);
        }, 480);
      };

      const handleWordPressMove = (e) => {
        const origin = wordPressOriginRef.current;
        const touch = e.touches?.[0];
        if (!origin || !touch) return;
        if (Math.abs(touch.clientX - origin.x) > 12 || Math.abs(touch.clientY - origin.y) > 12) {
          clearWordPressTimer();
        }
      };

      const handleWordPressEnd = () => {
        clearWordPressTimer();
      };

      useEffect(() => {
        const handleSelectedPhraseLookup = (event) => {
          if (event.repeat || (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight')) return;
          const target = event.target instanceof Element ? event.target : null;
          if (target?.closest('input, textarea, select, [contenteditable="true"], [role="textbox"]')) return;

          const hit = getSelectedLookupHit();
          if (!hit) return;
          event.preventDefault();
          openContextualDictionary(hit, hit.contextSentenceText || selectedSentence.text);
        };
        window.addEventListener('keydown', handleSelectedPhraseLookup);
        return () => window.removeEventListener('keydown', handleSelectedPhraseLookup);
      }, [selectedSentence, currentArticleId, vocabBook, cloudBaseUrl, cloudApiKey]);

      const quizLocatorPressTimerRef = useRef(null);
      const quizLocatorPressOriginRef = useRef(null);

      const clearQuizLocatorPressTimer = () => {
        if (quizLocatorPressTimerRef.current) {
          clearTimeout(quizLocatorPressTimerRef.current);
          quizLocatorPressTimerRef.current = null;
        }
        quizLocatorPressOriginRef.current = null;
      };

      const startQuizLocatorPress = (event, sentence) => {
        if (articleStudyMode !== 'quiz' || !currentQuizQuestion) return;
        const point = event.touches?.[0] || event;
        if (point.clientX == null || point.clientY == null) return;
        clearQuizLocatorPressTimer();
        quizLocatorPressOriginRef.current = { x: point.clientX, y: point.clientY, sentence };
        quizLocatorPressTimerRef.current = setTimeout(() => {
          const origin = quizLocatorPressOriginRef.current;
          quizLocatorPressTimerRef.current = null;
          if (origin) handleSetQuizLocatorSentence(origin.sentence);
        }, 550);
      };

      const moveQuizLocatorPress = (event) => {
        const origin = quizLocatorPressOriginRef.current;
        const point = event.touches?.[0] || event;
        if (!origin || point.clientX == null || point.clientY == null) return;
        if (Math.abs(point.clientX - origin.x) > 12 || Math.abs(point.clientY - origin.y) > 12) clearQuizLocatorPressTimer();
      };

      const renderGuidedSentenceWorkbench = () => (
        <div className="rounded-3xl border border-slate-200 bg-white p-5 shadow-sm">
          <div className="flex flex-col gap-3 md:flex-row md:items-center md:justify-between mb-4">
            <div>
              <p className="text-sm font-semibold text-slate-700">操作句子</p>
              <p className="text-sm text-slate-500">
                {guidedInteractiveStep
                  ? '先选标签，再点句子里的对应片段。'
                  : '这里展示当前正在处理的句子。'}
              </p>
            </div>
            {guidedInteractiveStep && (
              <div className="text-sm font-medium text-indigo-700 bg-indigo-50 border border-indigo-100 rounded-full px-3 py-1.5">
                当前标签：{guidedRoleOptions.find(option => option.key === guidedActiveRole)?.label || '未选择'}
              </div>
            )}
          </div>

          {guidedClauseUnits.length > 1 && (
            <div className="flex flex-wrap gap-2 mb-4">
              {guidedClauseUnits.map(unit => (
                <button
                  key={unit.key}
                  type="button"
                  onClick={() => setGuidedClauseSelection(prev => ({ ...prev, [selectedSentence.id]: unit.key }))}
                  className={`px-3 py-1.5 rounded-full border text-sm font-semibold ${
                    guidedCurrentClause === unit.key
                      ? 'bg-slate-900 text-white border-slate-900'
                      : 'bg-white text-slate-700 border-slate-200'
                  }`}
                >
                  {unit.label}
                </button>
              ))}
            </div>
          )}

          {guidedInteractiveStep && (
            <div className="flex flex-wrap gap-2 mb-4">
              {guidedRoleOptions.map(option => (
                <button
                  key={option.key}
                  type="button"
                  onClick={() => setGuidedActiveRole(option.key)}
                  draggable
                  onDragStart={() => setGuidedDragRole(option.key)}
                  onDragEnd={() => setGuidedDragRole(null)}
                  className={`px-3 py-1.5 rounded-full border text-sm font-semibold transition-colors ${
                    guidedActiveRole === option.key
                      ? 'bg-indigo-600 text-white border-indigo-600'
                      : 'bg-white text-slate-700 border-slate-200 hover:border-indigo-300'
                  }`}
                >
                  {option.label}
                </button>
              ))}
            </div>
          )}

          <div
            className="rounded-2xl bg-slate-50 border border-slate-200 p-5 select-text reader-word-target"
            data-lookup-context={selectedSentence.text}
            onDoubleClick={(e) => !guidedInteractiveStep && openVocabPopupFromEvent(e, selectedSentence.text)}
            onTouchStart={(e) => handleWordPressStart(e, selectedSentence.text, { enabled: !guidedInteractiveStep })}
            onTouchMove={handleWordPressMove}
            onTouchEnd={handleWordPressEnd}
            onTouchCancel={handleWordPressEnd}
            title={!guidedInteractiveStep ? '双击单词；选中 1–12 个英文词后按左右方向键可查文中释义并加入生词本' : ''}
          >
            <div className="text-xl md:text-2xl font-serif leading-relaxed text-slate-900">
              {guidedNeedsSubSegmentation
                ? guidedSubSegments.map((seg, index) => (
                    <button
                      key={`${seg.text}-${index}`}
                      type="button"
                      onClick={() => handleGuidedSegmentToggle(selectedSentence, index)}
                      onDragOver={(e) => {
                        e.preventDefault();
                      }}
                      onDrop={(e) => {
                        e.preventDefault();
                        handleGuidedDrop(selectedSentence, index, guidedDragRole || guidedActiveRole);
                        setGuidedDragRole(null);
                      }}
                      className={`inline rounded-md px-1 py-0.5 mx-[1px] transition-all ${getGuidedSegmentClassName(selectedSentence, index)}`}
                      title={seg.forcedRole || ''}
                    >
                      {seg.text}{index === guidedSubSegments.length - 1 ? '' : ' '}
                    </button>
                  ))
                : (selectedSentence.segments || []).map((seg, index) => {
                    if (!guidedVisibleText.includes(index) && guidedClauseUnits.length > 1) {
                      return null;
                    }
                    return guidedInteractiveStep ? (
                      <button
                        key={`${seg.text}-${index}`}
                        type="button"
                        onClick={() => handleGuidedSegmentToggle(selectedSentence, index)}
                        onDragOver={(e) => {
                          e.preventDefault();
                        }}
                        onDrop={(e) => {
                          e.preventDefault();
                          handleGuidedDrop(selectedSentence, index, guidedDragRole || guidedActiveRole);
                          setGuidedDragRole(null);
                        }}
                        className={`inline rounded-md px-1 py-0.5 mx-[1px] transition-all ${getGuidedSegmentClassName(selectedSentence, index)}`}
                        title={seg.label}
                      >
                        {seg.text}
                      </button>
                    ) : (
                      <span
                        key={`${seg.text}-${index}`}
                        className={`inline rounded-md px-1 py-0.5 mx-[1px] transition-all ${getGuidedSegmentClassName(selectedSentence, index)}`}
                      >
                        {seg.text}
                      </span>
                    );
                  })}
            </div>
          </div>
        </div>
      );

      // --- Auth Handlers ---
      const handleAuthSubmit = async (e) => {
        e.preventDefault();
        if (!supabase) {
          setAuthError("Supabase 服务未初始化");
          return;
        }
        setIsAuthenticating(true);
        setAuthError("");
        try {
          if (isLoginMode) {
            const { error } = await supabase.auth.signInWithPassword({ email: loginEmail.trim(), password: loginPassword });
            if (error) throw error;
          } else {
            const username = loginUsername.trim().toLowerCase();
            if (!/^[a-z0-9_]{3,32}$/.test(username)) throw new Error('用户名需为 3–32 位英文字母、数字或下划线。');
            const { data, error } = await supabase.auth.signUp({
              email: loginEmail.trim(), password: loginPassword,
              options: {
                data: { username },
                emailRedirectTo: `${window.location.origin}${window.location.pathname}`
              }
            });
            if (error) throw error;
            if (!data.session) {
              setAuthError('注册成功，请先到邮箱点击验证链接，再回来登录。');
              return;
            }
          }
          setShowLoginModal(false);
        } catch (err) {
          if (/invalid login credentials/i.test(err.message || '')) setAuthError("邮箱或密码错误，请检查。");
          else if (/already registered/i.test(err.message || '')) setAuthError("该邮箱已被注册，请直接登录。");
          else setAuthError("认证失败：" + err.message);
        } finally {
          setIsAuthenticating(false);
        }
      };

      const handleLogout = async () => {
        if (!supabase) return;
        try {
          await supabase.auth.signOut();
          setSyncPassphrase('');
          setSyncVaultUnlocked(false);
        } catch (e) {
          console.error("Logout error", e);
        }
      };

      const handleSaveSupabaseConfig = () => {
        try {
          const parsed = JSON.parse(supabaseConfigInput);
          if (!parsed.url || !parsed.publishableKey) {
            setAuthError('Supabase 配置缺少 url 或 publishableKey。');
            return;
          }
          localStorage.setItem(SUPABASE_CONFIG_STORAGE_KEY, JSON.stringify(parsed));
          setToastMessage('✅ Supabase 配置已保存，页面即将刷新。');
          setTimeout(() => window.location.reload(), 800);
        } catch (error) {
          setAuthError(`Supabase 配置不是合法 JSON：${error.message}`);
        }
      };

      const handleUnlockSyncVault = async () => {
        if (!syncPassphrase) { setAuthError('请输入同步加密口令。'); return; }
        if (!supabase || !user) { setAuthError('请先登录云同步账号。'); return; }
        try {
          // Read at click time so a slow initial cloud fetch cannot leave the
          // second device with an unlocked vault but an empty API key.
          const { data, error } = await supabase
            .from('reader_sync_state')
            .select('encrypted_ai_key')
            .eq('user_id', user.id)
            .maybeSingle();
          if (error) throw error;
          const encryptedAiKey = data?.encrypted_ai_key || encryptedAiKeyRef.current;
          if (encryptedAiKey) {
            setCloudApiKey(await decryptFromSyncVault(encryptedAiKey, syncPassphrase));
            encryptedAiKeyRef.current = encryptedAiKey;
            setToastMessage('AI 密钥已在当前设备解密。');
          } else if (cloudApiKey) {
            // This is the first (source) device: write the ciphertext now,
            // rather than relying on the debounced background sync.
            const encrypted = await encryptForSyncVault(cloudApiKey, syncPassphrase);
            const { error: writeError } = await supabase
              .from('reader_sync_state')
              .upsert({ user_id: user.id, encrypted_ai_key: encrypted, updated_at: new Date().toISOString() }, { onConflict: 'user_id' });
            if (writeError) throw writeError;
            encryptedAiKeyRef.current = encrypted;
            setToastMessage('AI 密钥已加密并同步到云端。');
          } else {
            setToastMessage('当前设备没有填写 AI Key，因此没有可上传的密钥。');
          }
          setSyncVaultUnlocked(true);
          setAuthError('');
          setCloudSyncRevision(value => value + 1);
        } catch (error) { setAuthError('同步口令不正确，无法解密 AI 密钥。'); }
      };

      // --- Vocab / Dictionary Logic ---
      const handleAddWordToVocab = async (word, contextSentenceText, dictionary = null) => {
        const wordKey = getVocabKey({ word });
        if (!wordKey || vocabBook.some(v => getVocabKey(v) === wordKey)) return;
        restoreVocabKeys([getVocabKey({ word })]);
        setAddingWordId(word);
        setActiveAiTask('vocab');
        setAiTaskStartedAt(Date.now());
        try {
          if (dictionary?.meaning) {
            const generateId = () => window.crypto?.randomUUID ? crypto.randomUUID() : Math.random().toString(36).substring(2, 15);
            const newWordEntry = {
              id: generateId(),
              word,
              meaning: dictionary.meaning,
              lemma: dictionary.lemma || word,
              partOfSpeech: dictionary.partOfSpeech || '',
              pronunciation: dictionary.pronunciation || '',
              etymology: dictionary.note || '来自原文语境查词',
              exampleSentence: '',
              sourceContext: contextSentenceText,
              sourceArticleId: currentArticleId || null,
              sourceArticleTitle: currentArticleTitle || '',
              addedAt: new Date().toLocaleDateString(),
              timestamp: Date.now()
            };
            setVocabBook(prev => normalizeVocabBook([newWordEntry, ...prev]));
            recordLearningEvent({ eventType: 'vocab_added', eventKey: `vocab:${newWordEntry.id}`, articleId: newWordEntry.sourceArticleId, articleTitle: newWordEntry.sourceArticleTitle, payload: { word: newWordEntry.word } });
            setToastMessage(`✅ 已加入生词本: ${word}`);
            return;
          }
          const sysPrompt = `你是一个专业的英语词汇与词源拓展助手。用户正在阅读英文文章，并希望将生词加入专属卡片本。
请提供以下细节，严格输出JSON格式：
{
  "meaning": "简明扼要的中文释义（请根据原文语境给出最合适的翻译）",
  "pronunciation": "英式或美式音标，例如 /əˈstrɒnəmə(r)/",
  "etymology": "词源简述，解释词根词缀。例如：由 astro-(星星) + -nomer(命名者) 组成，源自希腊语。",
  "exampleSentence": "造一个符合A2/B1难度的简短英文例句，并在括号内附带中文翻译。"
}`;
          const userPrompt = `【目标单词】：${word}\n【原文语境】：${contextSentenceText}`;
          const response = await fetchAiResponse({
            ...aiConfig,
            userPrompt,
            systemPrompt: sysPrompt,
            expectJson: true
          });
          const data = parseAiJsonOrThrow(response, 'Ollama');

          // Web API crypto fallback
          const generateId = () => window.crypto?.randomUUID ? crypto.randomUUID() : Math.random().toString(36).substring(2, 15);

          const newWordEntry = {
            id: generateId(),
            word: word,
            meaning: data.meaning || "暂无释义",
            lemma: data.lemma || word,
            partOfSpeech: normalizeDictionaryPartOfSpeech(data.partOfSpeech) || '',
            pronunciation: data.pronunciation || "",
            etymology: data.etymology || "暂无词源信息",
            exampleSentence: data.exampleSentence || "",
            sourceContext: contextSentenceText,
            sourceArticleId: currentArticleId || null,
            sourceArticleTitle: currentArticleTitle || '',
            addedAt: new Date().toLocaleDateString(),
            timestamp: Date.now()
          };

          setVocabBook(prev => normalizeVocabBook([newWordEntry, ...prev]));
          recordLearningEvent({ eventType: 'vocab_added', eventKey: `vocab:${newWordEntry.id || `${word}:${newWordEntry.timestamp}`}`, articleId: newWordEntry.sourceArticleId || null, articleTitle: newWordEntry.sourceArticleTitle || null, payload: { word: newWordEntry.word } });
          setToastMessage(`✅ 成功添加生词: ${word}`);
        } catch (error) {
          console.error(error);
          setToastMessage(`❌ 词汇解析失败：${error.message || '请稍后重试'}`);
        } finally {
          setAddingWordId(null);
          setActiveAiTask(null);
          setAiTaskStartedAt(null);
        }
      };

      const persistVocabDeletion = async (nextVocabBook, nextDeletedVocabKeys) => {
        trySetLocalStorage('my_local_vocab_book', JSON.stringify(nextVocabBook));
        trySetLocalStorage('reader_deleted_vocab_keys_v1', JSON.stringify(nextDeletedVocabKeys));

        if (localDataLoadedRef.current && localPersistenceStatus.enabled) {
          try {
            await writeLocalDataFile(savedArticles, nextVocabBook, completionRecords, nextDeletedVocabKeys);
          } catch (error) {
            setLocalPersistenceStatus({ enabled: false, message: '本地数据文件写入失败，已使用浏览器本地存储兜底。' });
          }
        }

        if (!supabase || !user || !cloudDataLoadedRef.current) return;
        const { data, error: readError } = await supabase
          .from('reader_sync_state')
          .select('preferences')
          .eq('user_id', user.id)
          .maybeSingle();
        if (readError) throw readError;
        const cloudPreferences = data?.preferences && typeof data.preferences === 'object' ? data.preferences : {};
        const cloudDeletedVocabKeys = normalizeDeletedVocabKeys([
          ...nextDeletedVocabKeys,
          ...(cloudPreferences.deletedVocabKeys || [])
        ]);
        const { error: writeError } = await supabase
          .from('reader_sync_state')
          .upsert({
            user_id: user.id,
            vocabulary: removeDeletedVocab(nextVocabBook, cloudDeletedVocabKeys),
            preferences: { ...cloudPreferences, deletedVocabKeys: cloudDeletedVocabKeys },
            updated_at: new Date().toISOString()
          }, { onConflict: 'user_id' });
        if (writeError) throw writeError;
        lastCloudSnapshotRef.current = '';
        setCloudSyncStatus({ enabled: true, message: 'Supabase 已立即保存删除记录。' });
      };

      const handleRemoveWord = (id) => {
        setConfirmDialog({
          message: "确定要从生词本彻底移除这个单词吗？",
          onConfirm: async () => {
            const removedKey = getVocabKey(vocabBook.find(word => word.id === id));
            if (!removedKey) return;
            const nextDeletedVocabKeys = normalizeDeletedVocabKeys([...deletedVocabKeys, removedKey]);
            const nextVocabBook = vocabBook.filter(word => getVocabKey(word) !== removedKey);
            setDeletedVocabKeys(nextDeletedVocabKeys);
            setVocabBook(nextVocabBook);
            setConfirmDialog(null);
            setToastMessage("🗑️ 单词已删除，正在保存同步记录...");
            try {
              await persistVocabDeletion(nextVocabBook, nextDeletedVocabKeys);
              setToastMessage("🗑️ 单词已彻底删除并同步");
            } catch (error) {
              scheduleCloudSyncRetry(`删除记录同步失败：${error.message || '网络连接中断'}`);
              setToastMessage("🗑️ 单词已在本机删除；云端将在网络恢复后更新");
            }
          }
        });
      };

      const exportVocabData = () => {
        if(vocabBook.length === 0) {
          setToastMessage("⚠️ 生词本是空的，没什么可导出的！");
          return;
        }
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(vocabBook, null, 2));
        const downloadAnchorNode = document.createElement('a');
        downloadAnchorNode.setAttribute("href", dataStr);
        downloadAnchorNode.setAttribute("download", `vocab_backup_${new Date().toISOString().split('T')[0]}.json`);
        document.body.appendChild(downloadAnchorNode); 
        downloadAnchorNode.click();
        downloadAnchorNode.remove();
        setToastMessage("💾 生词本备份已成功导出");
      };

      const sendVocabToVocabMaster = async () => {
        if (vocabBook.length === 0) {
          setToastMessage("⚠️ 生词本是空的，暂无可传递的单词。");
          return;
        }
        const entries = vocabBook
          .filter(entry => typeof entry?.word === 'string' && entry.word.trim())
          .map(entry => ({
            word: entry.word.trim(),
            meaning: entry.meaning || '',
            pronunciation: entry.pronunciation || '',
            etymology: entry.etymology || '',
            exampleSentence: entry.exampleSentence || '',
            sourceContext: entry.sourceContext || '',
            sourceArticleId: entry.sourceArticleId || null,
            sourceArticleTitle: entry.sourceArticleTitle || '',
            addedAt: entry.addedAt || '',
            timestamp: entry.timestamp || Date.now()
          }));
        let existingEntries = [];
        try {
          const existingInbox = JSON.parse(localStorage.getItem(VOCAB_MASTER_READING_INBOX_KEY) || '{}');
          existingEntries = Array.isArray(existingInbox.entries) ? existingInbox.entries : [];
        } catch (error) {}
        const incomingByWord = new Map(existingEntries.map(entry => [String(entry.word || '').trim().toLowerCase(), entry]));
        entries.forEach(entry => incomingByWord.set(entry.word.toLowerCase(), entry));
        incomingByWord.delete('');
        const inbox = { version: 1, updatedAt: new Date().toISOString(), entries: [...incomingByWord.values()] };

        try {
          localStorage.setItem(VOCAB_MASTER_READING_INBOX_KEY, JSON.stringify(inbox));
          if (supabase && user) {
            const { error } = await supabase
              .from('reader_sync_state')
              .upsert({ user_id: user.id, vocabulary: vocabBook, updated_at: new Date().toISOString() }, { onConflict: 'user_id' });
            if (error) throw error;
          }
          if (window.location.origin === 'https://lesong36.github.io') {
            window.open('https://lesong36.github.io/vocab-master/', '_blank', 'noopener');
            setToastMessage(`✅ 已将 ${entries.length} 个生词同步到 VocabMaster；登录同一阅读器账号即可跨设备导入。`);
          } else {
            const dataUri = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(inbox, null, 2));
            const link = document.createElement('a');
            link.href = dataUri;
            link.download = `reading-vocab-inbox_${new Date().toISOString().slice(0, 10)}.json`;
            document.body.appendChild(link);
            link.click();
            link.remove();
            setToastMessage('💾 已导出阅读生词本收件箱；线上版可直接导入 VocabMaster。');
          }
        } catch (error) {
          setToastMessage(`❌ 无法传递生词：${error.message || '浏览器本地存储不可用'}`);
        }
      };

      const importVocabData = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const fileReader = new FileReader();
        fileReader.readAsText(file, "UTF-8");
        fileReader.onload = event => {
          try {
            const importedData = JSON.parse(event.target.result);
            if (Array.isArray(importedData)) {
              // Importing is explicit, so it intentionally restores matching deleted words.
              restoreVocabKeys(importedData.map(getVocabKey));
              setVocabBook(prev => {
                const newDict = [...prev];
                importedData.forEach(newWord => {
                  if(!newDict.some(w => getVocabKey(w) === getVocabKey(newWord))) {
                    newDict.push(newWord);
                  }
                });
                return normalizeVocabBook(newDict);
              });
              setToastMessage(`✅ 成功导入了 ${importedData.length} 个单词记录！`);
            } else {
              setToastMessage("❌ 文件格式不正确，应该是一个包含单词对象的数组。");
            }
          } catch (err) {
            setToastMessage("❌ 导入失败，JSON 格式可能已损坏！");
          }
          e.target.value = null;
        };
      };

      // --- Article Library Logic ---
      const handleRemoveArticle = (id) => {
        setConfirmDialog({
          message: "确定要从书架彻底删除这篇文章吗？",
          onConfirm: () => {
            setSavedArticles(prev => prev.filter(a => a.id !== id));
            setConfirmDialog(null);
            setToastMessage("🗑️ 文章已删除");
          }
        });
      };

      const handleClearLocalLearningData = () => {
        setConfirmDialog({
          message: "确定要清空本机学习记录吗？这会清除教材缓存和生词本，但不会删除 AI 设置或磁盘上的生成 JSON 文件。",
          onConfirm: async () => {
            try {
              setSavedArticles([]);
              setVocabBook([]);
              setDeletedVocabKeys([]);
              localStorage.setItem(BUNDLED_LIBRARY_SEED_KEY, BUNDLED_LIBRARY_SEED_VERSION);
              await clearLocalLearningStorage();
              setLocalPersistenceStatus(prev => ({
                ...prev,
                message: `本地学习记录已清空：${LOCAL_DATA_FILE_NAME}`
              }));
              setConfirmDialog(null);
              setToastMessage("本机学习记录已清空");
            } catch (error) {
              setConfirmDialog(null);
              setToastMessage(`清空失败：${error.message || '请稍后重试'}`);
            }
          }
        });
      };

      const handleLoadArticle = (article) => {
        const normalizedData = normalizeArticleData(article.data);
        const normalizedQuestions = normalizeArticleQuestions(article);
        const glossary = collectArticleGlossary(article, normalizedData);
        setCurrentArticleId(article.id || null);
        setCurrentArticleTitle(article.title || '未命名文章');
        setCurrentArticleQuestions(normalizedQuestions);
        setCurrentArticleData(normalizedData);
        setCurrentArticleGlossary(glossary);
        setCurrentArticleReadability(article.readability || computeArticleReadability(normalizedData));
        setSelectedSentence(normalizedData[0]);
        readingSessionRef.current = { articleId: article.id || null, activeStartedAt: document.visibilityState === 'hidden' ? null : Date.now(), elapsedMs: 0 };
        setLastReadingSession(null);
        setViewMode('reading');
        setToastMessage(`📖 正在阅读：${article.title}`);
      };

      const handleToggleCurrentFavorite = () => {
        if (!currentArticleId) { setToastMessage('请先从书架打开一篇文章再收藏。'); return; }
        setFavoriteArticleIds(prev => prev.includes(currentArticleId)
          ? prev.filter(id => id !== currentArticleId)
          : [...prev, currentArticleId]);
      };

      const handleSelectQuizQuestion = (question) => {
        if (!question) return;
        setArticleStudyMode('quiz');
        setQuizActiveQuestionId(question.id);
      };

      const handleSetQuizLocatorSentence = (sentence) => {
        if (!sentence || !currentQuizQuestion || !currentQuizLocatorKey) return;
        setQuizProgress(prev => ({
          ...prev,
          locatorSentenceIds: {
            ...prev.locatorSentenceIds,
            [currentQuizLocatorKey]: sentence.id
          }
        }));
        setSelectedSentence(sentence);
        if (navigator.vibrate) {
          try { navigator.vibrate(12); } catch (_) {}
        }
        setToastMessage(`📍 已将第 ${currentQuizQuestion.index} 题${currentWordBankActiveBlank ? `第 ${currentQuizQuestion.blanks.indexOf(currentWordBankActiveBlank) + 1} 空` : ''}定位到这句话`);
      };

      const handleClearQuizLocatorSentence = () => {
        if (!currentQuizQuestion || !currentQuizLocatorKey) return;
        setQuizProgress(prev => {
          const { [currentQuizLocatorKey]: _removed, ...locatorSentenceIds } = prev.locatorSentenceIds || {};
          return { ...prev, locatorSentenceIds };
        });
        setToastMessage(`已清除第 ${currentQuizQuestion.index} 题${currentWordBankActiveBlank ? `第 ${currentQuizQuestion.blanks.indexOf(currentWordBankActiveBlank) + 1} 空` : ''}的定位句`);
      };

      const handleQuizAnswerSelect = (question, answerIndex) => {
        if (!question || question.type === 'word-bank' || !isSupportedQuizQuestion(question) || quizProgress.submitted) return;
        const answeredAt = new Date().toISOString();
        const existingAnswer = quizProgress.answers?.[question.id];
        const wasAlreadyAnswered = isQuizAnswerComplete(question, existingAnswer);
        const nextAnswer = question.type === 'multiple'
          ? (() => {
              const selected = Array.isArray(existingAnswer) ? existingAnswer : [];
              if (selected.includes(answerIndex)) return selected.filter(index => index !== answerIndex);
              if (selected.length >= question.answerIndexes.length) {
                setToastMessage(`本题请选择 ${question.answerIndexes.length} 项；请先取消一个已选项。`);
                return selected;
              }
              return [...selected, answerIndex].sort((left, right) => left - right);
            })()
          : answerIndex;
        setQuizProgress(prev => ({
          ...prev,
          answers: {
            ...prev.answers,
            [question.id]: nextAnswer
          },
          lastAnsweredAt: answeredAt
        }));
        if (!wasAlreadyAnswered && isQuizAnswerComplete(question, nextAnswer)) recordLearningEvent({ eventType: 'quiz_answered', eventKey: `answer:${currentArticleId}:${question.id}:${localDayKey(answeredAt)}`, articleId: currentArticleId, articleTitle: currentArticleTitle, questionId: question.id, payload: { questionIndex: question.index, questionPrompt: question.prompt, learnerAnswerIndex: nextAnswer } });
      };

      const handleWordBankAnswerSelect = (question, blankId, answerIndex) => {
        if (!question || question.type !== 'word-bank' || !question.blanks.some(blank => blank.id === blankId) || !Number.isInteger(answerIndex) || quizProgress.submitted) return;
        const answeredAt = new Date().toISOString();
        const existingAnswer = getWordBankAnswers(quizProgress.answers?.[question.id]);
        if (Object.entries(existingAnswer).some(([existingBlankId, existingAnswerIndex]) => existingBlankId !== blankId && existingAnswerIndex === answerIndex)) {
          setToastMessage('这个词已填入其他空格；如需调整，请先清除原空格。');
          return;
        }
        const wasAlreadyAnswered = isQuizAnswerComplete(question, existingAnswer);
        const nextAnswer = { ...existingAnswer, [blankId]: answerIndex };
        setQuizProgress(prev => ({
          ...prev,
          answers: { ...prev.answers, [question.id]: nextAnswer },
          lastAnsweredAt: answeredAt
        }));
        const nextBlank = question.blanks.find(blank => !Number.isInteger(nextAnswer[blank.id]));
        setActiveWordBankBlankId(nextBlank?.id || blankId);
        setWordBankSelectedOptionIndex(null);
        if (!wasAlreadyAnswered && isQuizAnswerComplete(question, nextAnswer)) recordLearningEvent({ eventType: 'quiz_answered', eventKey: `answer:${currentArticleId}:${question.id}:${localDayKey(answeredAt)}`, articleId: currentArticleId, articleTitle: currentArticleTitle, questionId: question.id, payload: { questionIndex: question.index, questionPrompt: question.prompt, learnerAnswerIndex: nextAnswer } });
      };

      const handleClearWordBankBlank = (question, blankId) => {
        if (!question || question.type !== 'word-bank' || quizProgress.submitted) return;
        setQuizProgress(prev => {
          const { [blankId]: _removed, ...answers } = getWordBankAnswers(prev.answers?.[question.id]);
          return { ...prev, answers: { ...prev.answers, [question.id]: answers } };
        });
        setActiveWordBankBlankId(blankId);
      };

      const renderWordBankBlank = (blank, blankIndex, label = `空格 ${blankIndex + 1}`) => {
        const selectedAnswerIndex = currentWordBankAnswers[blank.id];
        const hasAnswer = Number.isInteger(selectedAnswerIndex);
        const isActiveBlank = currentWordBankActiveBlank?.id === blank.id;
        const locatorSentenceId = quizProgress.locatorSentenceIds?.[getQuizLocatorKey(currentQuizQuestion, blank.id)] || null;
        const locatorSentence = locatorSentenceId ? currentArticleData.find(sentence => sentence.id === locatorSentenceId) || null : null;
        const isCorrect = quizProgress.submitted && selectedAnswerIndex === blank.answerIndex;
        const isWrong = quizProgress.submitted && hasAnswer && !isCorrect;
        const activate = () => {
          setActiveWordBankBlankId(blank.id);
          if (Number.isInteger(wordBankSelectedOptionIndex)) handleWordBankAnswerSelect(currentQuizQuestion, blank.id, wordBankSelectedOptionIndex);
        };
        return (
          <div
            key={blank.id}
            role="button"
            tabIndex="0"
            onClick={activate}
            onKeyDown={(event) => {
              if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                activate();
              }
            }}
            onDragOver={event => { if (!quizProgress.submitted) event.preventDefault(); }}
            onDrop={event => {
              event.preventDefault();
              const answerIndex = Number(event.dataTransfer.getData('text/plain'));
              if (Number.isInteger(answerIndex)) handleWordBankAnswerSelect(currentQuizQuestion, blank.id, answerIndex);
            }}
            className={`rounded-2xl border p-4 transition-all ${
              isCorrect ? 'border-emerald-300 bg-emerald-50'
                : isWrong ? 'border-rose-300 bg-rose-50'
                : isActiveBlank ? 'border-teal-400 bg-teal-50 shadow-sm ring-2 ring-teal-100'
                : 'border-slate-200 bg-white hover:border-teal-200'
            } ${quizProgress.submitted ? 'cursor-default' : 'cursor-pointer'}`}
          >
            <div className="flex items-start justify-between gap-3">
              <div className="min-w-0 flex-1">
                <p className="text-xs font-black uppercase tracking-[0.14em] text-teal-700">{label}{isActiveBlank ? ' · 当前定位' : ''}</p>
                <p className="mt-2 text-base font-semibold leading-7 text-slate-800">{blank.prompt.replace(/^\s*(?:main\s*idea|sub[-\s]*idea\s*\d*|detail\s*\d*)\s*:\s*/i, '')}</p>
              </div>
              {hasAnswer && !quizProgress.submitted && (
                <button type="button" onClick={event => { event.stopPropagation(); handleClearWordBankBlank(currentQuizQuestion, blank.id); }} className="shrink-0 rounded-lg px-2 py-1 text-xs font-black text-slate-400 hover:bg-white hover:text-rose-600" aria-label={`清除第 ${blankIndex + 1} 空`}>×</button>
              )}
            </div>
            <div className={`mt-3 rounded-2xl border border-dashed px-4 py-3 text-sm font-black ${hasAnswer ? 'border-teal-300 bg-white text-teal-800' : 'border-slate-300 bg-slate-50 text-slate-400'}`}>
              {hasAnswer ? currentQuizQuestion.options[selectedAnswerIndex] : '将词卡拖到这里，或先点选词卡'}
            </div>
            <p className={`mt-3 text-xs leading-5 ${locatorSentence ? 'font-semibold text-amber-800' : 'text-slate-500'}`}>
              {locatorSentence ? `📍 定位句：${locatorSentence.text}` : isActiveBlank ? '📍 当前空：长按左侧原文可设置定位句' : '点击此空后可单独设置定位句'}
            </p>
          </div>
        );

      const renderWordBankIdeaNode = (node) => {
        const entries = Array.isArray(node.entries) && node.entries.length > 0
          ? node.entries
          : [{ text: node.text, blankId: node.blankId }];
        const renderEntry = (entry, entryIndex, showLabel = false) => {
          const blankIds = Array.isArray(entry.blankIds) && entry.blankIds.length > 0
            ? entry.blankIds
            : [entry.blankId].filter(Boolean);
          if (blankIds.length > 1) return (
            <div key={`${node.label}-${entryIndex}`} className="rounded-xl border border-rose-100 bg-white px-3 py-3 shadow-sm">
              {showLabel && <p className="mb-2 text-xs font-black uppercase tracking-[0.14em] text-rose-700">{node.label}</p>}
              {renderWordBankCompareItem({ text: entry.text, blankIds }, entryIndex)}
            </div>
          );
          const blankIndex = currentQuizQuestion.blanks.findIndex(blank => blank.id === blankIds[0]);
          if (blankIndex >= 0) return <div key={`${node.label}-${entryIndex}`}>{renderWordBankBlank(currentQuizQuestion.blanks[blankIndex], blankIndex, showLabel ? node.label : '')}</div>;
          return (
            <div key={`${node.label}-${entryIndex}`} className="rounded-xl bg-rose-50/60 px-3 py-2 text-sm font-semibold leading-6 text-slate-700">
              <p className="text-xs font-black uppercase tracking-[0.14em] text-rose-700">{node.label}</p>
              <p className="mt-2">{entry.text}</p>
            </div>
          );
        };
        if (entries.length > 1) {
          return (
            <div className="rounded-2xl border border-rose-100 bg-white p-3 shadow-sm">
              <p className="px-1 text-xs font-black uppercase tracking-[0.14em] text-rose-700">{node.label}</p>
              <div className="mt-2 grid gap-3">{entries.map((entry, entryIndex) => renderEntry(entry, entryIndex))}</div>
            </div>
          );
        }
        return renderEntry(entries[0], 0, true);
      };

      const renderWordBankInlineBlank = (blankId) => {
        const blankIndex = currentQuizQuestion.blanks.findIndex(blank => blank.id === blankId);
        const blank = currentQuizQuestion.blanks[blankIndex];
        if (!blank) return null;
        const selectedAnswerIndex = currentWordBankAnswers[blank.id];
        const hasAnswer = Number.isInteger(selectedAnswerIndex);
        const isActiveBlank = currentWordBankActiveBlank?.id === blank.id;
        const isCorrect = quizProgress.submitted && selectedAnswerIndex === blank.answerIndex;
        const isWrong = quizProgress.submitted && hasAnswer && !isCorrect;
        const activate = () => {
          setActiveWordBankBlankId(blank.id);
          if (Number.isInteger(wordBankSelectedOptionIndex)) handleWordBankAnswerSelect(currentQuizQuestion, blank.id, wordBankSelectedOptionIndex);
        };
        return (
          <button
            key={blank.id}
            type="button"
            onClick={activate}
            onDragOver={event => { if (!quizProgress.submitted) event.preventDefault(); }}
            onDrop={event => {
              event.preventDefault();
              const answerIndex = Number(event.dataTransfer.getData('text/plain'));
              if (Number.isInteger(answerIndex)) handleWordBankAnswerSelect(currentQuizQuestion, blank.id, answerIndex);
            }}
            className={`mx-1 inline-flex min-w-24 items-center justify-center rounded-lg border-b-2 px-2 py-0.5 align-baseline text-sm font-black transition-all sm:min-w-28 ${
              isCorrect ? 'border-emerald-500 bg-emerald-50 text-emerald-800'
                : isWrong ? 'border-rose-500 bg-rose-50 text-rose-800'
                : hasAnswer ? 'border-teal-500 bg-teal-50 text-teal-800'
                  : isActiveBlank ? 'border-teal-600 bg-teal-100 text-teal-900 ring-2 ring-teal-200'
                    : 'border-slate-400 bg-slate-50 text-slate-500 hover:border-teal-500 hover:bg-teal-50'
            } ${quizProgress.submitted ? 'cursor-default' : 'cursor-pointer'}`}
            aria-label={`空格 ${blankIndex + 1}${isActiveBlank ? '，当前定位' : ''}`}
            title={hasAnswer ? `空格 ${blankIndex + 1}：${currentQuizQuestion.options[selectedAnswerIndex]}` : `空格 ${blankIndex + 1}：拖入词卡，或点选词卡后点击`}
          >
            {hasAnswer ? currentQuizQuestion.options[selectedAnswerIndex] : `空格 ${blankIndex + 1}`}
          </button>
        );
      };

      const renderWordBankCompareItem = (item, itemIndex) => {
        const pieces = item.text.split(/(\(\s*\)|_{2,}(?:\d+_{2,})?)/g);
        let blankOffset = 0;
        return (
          <div key={`${item.text}-${itemIndex}`} className="rounded-xl border border-emerald-100 bg-white/90 px-3 py-3 text-base font-semibold leading-8 text-slate-800 shadow-sm">
            {pieces.map((piece, pieceIndex) => {
              if (!/(?:\(\s*\)|_{2,}(?:\d+_{2,})?)/.test(piece)) return <span key={pieceIndex}>{piece}</span>;
              const blankId = item.blankIds[blankOffset++];
              return renderWordBankInlineBlank(blankId);
            })}
          </div>
        );
      };

      const renderWordBankGroupedChart = (chart, { title, subtitle, tone = 'indigo' }) => {
        const toneClasses = tone === 'amber'
          ? 'border-amber-200 bg-amber-50/60 text-amber-800 bg-amber-500'
          : tone === 'violet'
            ? 'border-violet-200 bg-violet-50/60 text-violet-800 bg-violet-500'
            : 'border-indigo-200 bg-indigo-50/60 text-indigo-800 bg-indigo-500';
        const blankIds = new Set(chart.groups.flatMap(group => group.items.flatMap(item => item.blankIds)));
        const unplacedBlanks = currentQuizQuestion.blanks.filter(blank => !blankIds.has(blank.id));
        return (
          <div className="space-y-4">
            <div className={`rounded-[28px] border-2 p-4 shadow-sm ${toneClasses.split(' ').slice(0, 3).join(' ')}`}>
              <div className="flex items-center gap-3">
                <span className={`grid h-8 w-8 place-items-center rounded-full text-sm font-black text-white ${toneClasses.split(' ').at(-1)}`}>↳</span>
                <div><p className="text-xs font-black uppercase tracking-[0.18em]">{title}</p><p className="text-xs font-semibold opacity-80">{subtitle}</p></div>
              </div>
            </div>
            <div className="grid gap-4 md:grid-cols-2 xl:grid-cols-3">
              {chart.groups.map((group, groupIndex) => (
                <section key={`${group.label}-${groupIndex}`} className={`overflow-hidden rounded-[26px] border-2 bg-white shadow-sm ${toneClasses.split(' ').slice(0, 1).join(' ')}`}>
                  <h4 className={`px-4 py-3 text-center text-sm font-black uppercase tracking-[0.13em] text-white ${toneClasses.split(' ').at(-1)}`}>{group.label}</h4>
                  <div className="space-y-3 p-3">{group.items.map(renderWordBankCompareItem)}</div>
                </section>
              ))}
            </div>
            {unplacedBlanks.length > 0 && <div className="grid gap-3">{unplacedBlanks.map(blank => renderWordBankBlank(blank, currentQuizQuestion.blanks.indexOf(blank)))}</div>}
          </div>
        );
      };

      const handleQuizTextAnswerChange = (question, value) => {
        if (!question || quizProgress.submitted) return;
        setQuizProgress(prev => ({ ...prev, answers: { ...prev.answers, [question.id]: value } }));
      };

      const recordLearningEvent = async ({ eventType, eventKey, articleId = null, articleTitle = null, questionId = null, payload = {} }) => {
        if (!supabase || !user) return;
        const { error } = await supabase.from('learning_events').insert({ user_id: user.id, event_type: eventType, event_key: eventKey, article_id: articleId, article_title: articleTitle, question_id: questionId, payload: { ...payload, device: deviceIdentity } });
        if (error && error.code !== '23505') console.warn('Learning event was not recorded:', error.message);
      };

      const handleEvaluateCurrentQuiz = async () => {
        if (!currentQuizQuestion || !currentArticleId || !quizProgress.submitted) return;
        const key = `${currentArticleId}::${currentQuizQuestion.id}`;
        const locatorId = quizProgress.locatorSentenceIds?.[currentQuizQuestion.id] || null;
        const locatorIndex = locatorId ? currentArticleData.findIndex(sentence => sentence.id === locatorId) : -1;
        const windowSentences = locatorIndex < 0 ? [] : currentArticleData.slice(Math.max(0, locatorIndex - 2), locatorIndex + 3).map(sentence => ({ id: sentence.id, text: sentence.text, para: sentence.para }));
        setEvaluatingQuestionKey(key);
        try {
          const result = await fetchAiResponse({
            ...aiConfig,
            expectJson: true,
            systemPrompt: '你是严谨的英语阅读题证据审核助手。独立判断选项，不可把给定参考答案当真。定位结论只能依据给定定位窗口，必须返回合法 JSON。',
            userPrompt: JSON.stringify({ task: '评估参考答案候选、学生选择与定位句。referenceAnswerVerdict 只能为 supported/questionable/insufficient；learnerAnswerVerdict 为 supported/unsupported/uncertain；locatorVerdict 为 valid/partial/invalid/missing；evidenceSentenceIds 必须只来自 locatorWindow；modelAnswerIndex 为 0 起始选项编号或 null。', question: { prompt: currentQuizQuestion.prompt, options: currentQuizQuestion.options, referenceAnswerIndex: currentQuizQuestion.answerIndex, learnerAnswerIndex: currentQuizAnswer }, locatorWindow: windowSentences, fullPassage: currentArticleData.map(sentence => ({ id: sentence.id, text: sentence.text, para: sentence.para })) })
          });
          const allowed = new Set(windowSentences.map(sentence => sentence.id));
          if (!result || !['supported', 'questionable', 'insufficient'].includes(result.referenceAnswerVerdict) || !['valid', 'partial', 'invalid', 'missing'].includes(result.locatorVerdict) || (result.evidenceSentenceIds || []).some(id => !allowed.has(id))) throw new Error('模型返回的评测格式或定位证据不合规。');
          const evaluation = { ...result, generatedAt: new Date().toISOString(), locatorSentenceId: locatorId, disputed: result.referenceAnswerVerdict !== 'supported' || (Number.isInteger(result.modelAnswerIndex) && result.modelAnswerIndex !== currentQuizQuestion.answerIndex) };
          setQuizEvaluations(previous => ({ ...previous, [key]: evaluation }));
          recordLearningEvent({ eventType: 'quiz_evaluated', eventKey: `evaluation:${currentArticleId}:${currentQuizQuestion.id}:${evaluation.generatedAt}`, articleId: currentArticleId, articleTitle: currentArticleTitle, questionId: currentQuizQuestion.id, payload: {
            disputed: evaluation.disputed,
            locatorVerdict: evaluation.locatorVerdict,
            referenceAnswerVerdict: evaluation.referenceAnswerVerdict,
            learnerAnswerVerdict: evaluation.learnerAnswerVerdict || null,
            modelAnswerIndex: Number.isInteger(evaluation.modelAnswerIndex) ? evaluation.modelAnswerIndex : null,
            reasoning: evaluation.reasoning || evaluation.nextStep || null,
            questionPrompt: currentQuizQuestion.prompt,
            options: currentQuizQuestion.options,
            learnerAnswerIndex: currentQuizAnswer,
            referenceAnswerIndex: currentQuizQuestion.answerIndex,
            locatorSentenceId: locatorId,
            locatorWindow: windowSentences,
            evidenceSentenceIds: evaluation.evidenceSentenceIds || []
          } });
          setToastMessage(evaluation.disputed ? '⚠️ AI 发现答案争议，可发起人工校验。' : '✅ AI 评测完成。');
        } catch (error) { setToastMessage(`评测失败：${error.message || '请检查 AI 设置后重试'}`); } finally { setEvaluatingQuestionKey(null); }
      };

      const handleQuizSubmit = () => {
        if (!quizCanSubmit || quizProgress.submitted) return;
        const submittedAt = new Date().toISOString();
        const article = articlesById.get(currentArticleId) || { id: currentArticleId, title: currentArticleTitle, questions: currentArticleQuestions };
        const alreadyCompleted = Boolean(completionRecords[currentArticleId]);
        const sessionDuration = currentArticleId ? getActiveReadingDuration(currentArticleId) : null;
        setQuizProgress(prev => ({
          ...prev,
          submitted: true,
          submittedAt
        }));
        recordLearningEvent({ eventType: 'quiz_submitted', eventKey: `quiz:${currentArticleId}:${submittedAt}`, articleId: currentArticleId, articleTitle: currentArticleTitle, payload: { correct: quizCorrectCount, total: supportedQuizQuestions.length } });
        if (!alreadyCompleted && article?.id) {
          const accuracy = supportedQuizQuestions.length ? Math.round((quizCorrectCount / supportedQuizQuestions.length) * 100) : null;
          setCompletionRecords(previous => ({
            ...previous,
            [article.id]: {
              completedAt: submittedAt,
              durationMs: sessionDuration,
              accuracy,
              correctCount: supportedQuizQuestions.length ? quizCorrectCount : null,
              totalCount: supportedQuizQuestions.length || null,
              tags: []
            }
          }));
          recordLearningEvent({ eventType: 'article_completed', eventKey: `complete:${article.id}:${submittedAt}`, articleId: article.id, articleTitle: article.title, payload: { durationMs: sessionDuration, accuracy, source: 'quiz_submission' } });
          readingSessionRef.current = { articleId: currentArticleId, activeStartedAt: document.visibilityState === 'hidden' ? null : Date.now(), elapsedMs: 0 };
        }
        setToastMessage(alreadyCompleted ? `📝 已交卷：得分 ${quizCorrectCount}/${supportedQuizQuestions.length}` : `✅ 已交卷并完成本篇阅读：${quizCorrectCount}/${supportedQuizQuestions.length}`);
      };

      const handleReturnToLibrary = () => {
        if (currentArticleId && readingSessionRef.current.articleId === currentArticleId) {
          pauseReadingSession();
          setLastReadingSession({ articleId: currentArticleId, durationMs: readingSessionRef.current.elapsedMs });
          readingSessionRef.current = { articleId: null, activeStartedAt: null, elapsedMs: 0 };
        }
        setViewMode('library');
      };

      const handleMarkArticleComplete = (article) => {
        if (!article?.id) return;
        const existing = completionRecords[article.id];
        const sessionDuration = lastReadingSession?.articleId === article.id ? lastReadingSession.durationMs : 0;
        const questions = normalizeArticleQuestions(article);
        const totalCount = questions.filter(isSupportedQuizQuestion).length;
        const progress = normalizeQuizProgress(JSON.parse(localStorage.getItem(getQuizProgressStorageKey(article.id)) || '{}'));
        const correctCount = totalCount ? questions.filter(question => isSupportedQuizQuestion(question) && isQuizAnswerCorrect(question, progress.answers?.[question.id])).length : null;
        const accuracy = totalCount && progress.submitted ? Math.round((correctCount / totalCount) * 100) : null;
        const completedAt = new Date().toISOString();
        setCompletionRecords(prev => ({
          ...prev,
          [article.id]: {
            completedAt,
            durationMs: Math.max(0, Number(existing?.durationMs || 0) + sessionDuration),
            accuracy,
            correctCount: totalCount && progress.submitted ? correctCount : null,
            totalCount: totalCount || null,
            tags: existing?.tags || []
          }
        }));
        recordLearningEvent({ eventType: 'article_completed', eventKey: `complete:${article.id}:${completedAt}`, articleId: article.id, articleTitle: article.title, payload: { durationMs: Math.max(0, Number(existing?.durationMs || 0) + sessionDuration), accuracy } });
        setToastMessage(accuracy == null ? '✅ 已完成本篇阅读' : `✅ 已完成本篇阅读：正确率 ${accuracy}%`);
      };

      const loadTeacherReviewQueue = async () => {
        if (!supabase || !user || !isTeacher) return;
        setIsLoadingTeacherReviews(true);
        try {
          const { data, error } = await supabase.from('quiz_answer_reports')
            .select('id,article_id,article_title,question_id,question_prompt,reported_answer_index,learner_answer_index,proposed_answer_index,locator_sentence_id,locator_sentence_text,locator_window_sentence_ids,note,ai_evaluation,created_at')
            .eq('status', 'pending')
            .order('created_at', { ascending: true });
          if (error) throw error;
          const reports = data || [];
          setTeacherReviewQueue(reports);
          setTeacherReviewEdits(previous => reports.reduce((edits, report) => ({
            ...edits,
            [report.id]: previous[report.id] || { answerIndex: Number.isInteger(report.proposed_answer_index) ? report.proposed_answer_index : null, note: '' }
          }), {}));
        } catch (error) {
          setToastMessage(`加载待审核题目失败：${error.message || '请稍后重试'}`);
        } finally { setIsLoadingTeacherReviews(false); }
      };

      const handleTeacherReview = async (report, status) => {
        if (!supabase || !user || !isTeacher || !report?.id) return;
        const edit = teacherReviewEdits[report.id] || {};
        if (status === 'approved' && !Number.isInteger(edit.answerIndex)) {
          setToastMessage('请先确认本题应采用的答案。');
          return;
        }
        setReviewingReportId(report.id);
        try {
          const reviewedAt = new Date().toISOString();
          const reviewNote = String(edit.note || '').trim() || null;
          if (status === 'approved') {
            const { error: correctionError } = await supabase.from('quiz_answer_corrections').upsert({
              article_id: report.article_id,
              question_id: report.question_id,
              corrected_answer_index: edit.answerIndex,
              teacher_note: reviewNote,
              status: 'approved',
              reviewed_at: reviewedAt
            }, { onConflict: 'article_id,question_id' });
            if (correctionError) throw correctionError;
          }
          const { data: updated, error: reportError } = await supabase.from('quiz_answer_reports')
            .update({ status, reviewer_id: user.id, reviewed_at: reviewedAt, review_note: reviewNote })
            .eq('id', report.id)
            .eq('status', 'pending')
            .select('id')
            .maybeSingle();
          if (reportError) throw reportError;
          if (!updated) throw new Error('这条上报刚刚已被其他老师处理，请刷新队列。');
          setTeacherReviewQueue(previous => previous.filter(item => item.id !== report.id));
          setToastMessage(status === 'approved' ? '✅ 已确认更正答案，学生下次打开文章会自动采用。' : '已驳回该上报，原答案保持不变。');
        } catch (error) {
          setToastMessage(`审核未保存：${error.message || '请稍后重试'}`);
        } finally { setReviewingReportId(null); }
      };

      const handleReportAnswer = async () => {
        if (!currentArticleId || !currentQuizQuestion) return;
        if (!user || !supabase) { setToastMessage('请先登录云同步账号后再上报答案。'); return; }
        if (!Number.isInteger(proposedAnswerIndex)) { setToastMessage('请先选择你认为正确的答案。'); return; }
        if (!currentQuizLocatorSentence) { setToastMessage('请先在左侧原文长按一句，设为本题定位句。'); return; }
        setIsSubmittingAnswerReport(true);
        try {
          const evaluation = quizEvaluations[`${currentArticleId}::${currentQuizQuestion.id}`] || null;
          const locatorIndex = currentArticleData.findIndex(sentence => sentence.id === currentQuizLocatorSentence.id);
          const locatorWindowSentenceIds = locatorIndex < 0 ? [] : currentArticleData.slice(Math.max(0, locatorIndex - 2), locatorIndex + 3).map(sentence => sentence.id);
          const { error } = await supabase.from('quiz_answer_reports').insert({
            reporter_id: user.id,
            article_id: currentArticleId,
            article_title: currentArticleTitle,
            question_id: currentQuizQuestion.id,
            question_prompt: currentQuizQuestion.prompt,
            reported_answer_index: currentQuizQuestion.answerIndex,
            learner_answer_index: Number.isInteger(currentQuizAnswer) ? currentQuizAnswer : null,
            proposed_answer_index: proposedAnswerIndex,
            locator_sentence_id: currentQuizLocatorSentence.id,
            locator_sentence_text: currentQuizLocatorSentence.text,
            note: answerReportNote.trim() || null,
            ai_evaluation: evaluation,
            reference_answer_index: currentQuizQuestion.answerIndex,
            locator_window_sentence_ids: locatorWindowSentenceIds,
            evaluation_input_hash: evaluation ? `${currentArticleId}:${currentQuizQuestion.id}:${evaluation.generatedAt}` : null
          });
          if (error) throw error;
          recordLearningEvent({ eventType: 'answer_review_requested', eventKey: `review:${currentArticleId}:${currentQuizQuestion.id}:${Date.now()}`, articleId: currentArticleId, articleTitle: currentArticleTitle, questionId: currentQuizQuestion.id, payload: { referenceAnswerIndex: currentQuizQuestion.answerIndex, learnerAnswerIndex: currentQuizAnswer, proposedAnswerIndex } });
          setAnswerReportNote('');
          setProposedAnswerIndex(null);
          setToastMessage('📨 已上报老师审核；确认后会自动采用更正答案。');
        } catch (error) {
          const message = String(error?.message || '');
          if (/quiz_answer_reports|schema cache|PGRST205/i.test(message)) {
            setToastMessage('上报服务正在更新，请稍候几秒后重试。');
          } else {
            setToastMessage(`上报失败：${message || '请稍后重试'}`);
          }
        } finally { setIsSubmittingAnswerReport(false); }
      };

      const handleQuizReset = () => {
        setQuizProgress(createEmptyQuizProgress());
        const firstQuestion = currentArticleQuestions[0] || null;
        setQuizActiveQuestionId(firstQuestion?.id || null);
        setToastMessage('已清空当前文章的作答记录');
      };

      const persistGlossaryToCurrentArticle = (glossary) => {
        const normalized = normalizeGlossary(glossary);
        setCurrentArticleGlossary(normalized);
        if (currentArticleId) {
          setSavedArticles(prev => prev.map(article =>
            article.id === currentArticleId ? { ...article, glossary: normalized } : article
          ));
        }
        return normalized;
      };

      const handleExtractGlossary = async () => {
        if (!currentArticleData.length || isExtractingGlossary) return;
        setIsExtractingGlossary(true);
        setActiveAiTask('glossary');
        setAiTaskStartedAt(Date.now());
        setAiTaskPhase('requesting');
        setAiReceivedChars(0);
        setAiReceivedChunks(0);
        setAiLastProgressAt(Date.now());
        try {
          const articleText = joinArticleText(currentArticleData);
          const sysPrompt = `你是英语阅读术语、难词与外来词助手。请从用户提供的英文文章中选择需要中文释义的词条，并严格输出 JSON。
${buildGlossarySelectionRules()}

term 必须是文中实际出现的英文写法；若有常见别名可放 aliases。只输出 JSON，不要 Markdown 代码块，不要解释。

输出格式：
{
  "glossary": [
    {
      "term": "英文词条",
      "translation": "中文翻译",
      "kind": "domain_term | cultural_term | rare_word | loanword | acronym",
      "note": "本文语境说明",
      "aliases": ["可选别名"]
    }
  ]
}`;
          const response = await fetchAiResponse({
            ...aiConfig,
            userPrompt: articleText,
            systemPrompt: sysPrompt,
            expectJson: true,
            onProgress: reportAiProgress
          });
          const parsed = parseAiJsonOrThrow(response, 'Ollama');
          const glossary = normalizeGeneratedGlossary(parsed.glossary || []);
          if (glossary.length === 0) {
            persistGlossaryToCurrentArticle([]);
            setToastMessage('这篇文章没有需要标注的术语、难词或外来词。');
            return;
          }
          persistGlossaryToCurrentArticle(glossary);
          setToastMessage(`✅ 已识别 ${glossary.length} 个术语、难词或外来词`);
        } catch (error) {
          console.error(error);
          setToastMessage(`❌ 术语识别失败：${error.message || '请稍后重试'}`);
        } finally {
          setIsExtractingGlossary(false);
          setActiveAiTask(null);
          setAiTaskStartedAt(null);
          setAiTaskPhase(null);
          setAiReceivedChars(0);
          setAiReceivedChunks(0);
          setAiLastProgressAt(null);
        }
      };

      const clearGlossaryHoverSoon = () => {
        if (glossaryHoverHideTimerRef.current) clearTimeout(glossaryHoverHideTimerRef.current);

      };

      const showGlossaryHover = (entry, event) => {
        if (!entry) return;
        if (glossaryHoverHideTimerRef.current) {
          clearTimeout(glossaryHoverHideTimerRef.current);
          glossaryHoverHideTimerRef.current = null;
        }
        const rect = event.currentTarget.getBoundingClientRect();
        const tipWidth = 256; // max-w-[16rem]
        const tipHeight = 96;
        const margin = 12;
        let left = rect.left + rect.width / 2;
        left = Math.max(margin + tipWidth / 2, Math.min(left, window.innerWidth - margin - tipWidth / 2));
        let top = rect.bottom + 8;
        if (top + tipHeight > window.innerHeight - margin) {
          top = Math.max(margin, rect.top - tipHeight - 8);
        }
        setGlossaryHover({
          entry,
          x: left,
          y: top
        });
      };

      const renderTextWithGlossary = (text = '', glossary = currentArticleGlossary) => {
        const source = String(text || '');
        const matchList = buildGlossaryMatchList(glossary);
        if (!source || matchList.length === 0) return source;

        const pattern = new RegExp(
          `\\b(${matchList.map(item => escapeRegExp(item.match)).join('|')})\\b`,
          'gi'
        );
        const nodes = [];
        let lastIndex = 0;
        let match;
        let key = 0;
        while ((match = pattern.exec(source)) !== null) {
          if (match.index > lastIndex) {
            nodes.push(source.slice(lastIndex, match.index));
          }
          const matchedText = match[0];
          const entry = findGlossaryEntry(glossary, matchedText);
          nodes.push(
            <span
              key={`glossary-${key++}-${match.index}`}
              className="inline cursor-help rounded-sm bg-amber-100/80 px-0.5 decoration-amber-400 underline decoration-dotted underline-offset-2"
              onMouseEnter={(event) => showGlossaryHover(entry, event)}

              onFocus={(event) => showGlossaryHover(entry, event)}
              onBlur={clearGlossaryHoverSoon}
            >
              {matchedText}
            </span>
          );
          lastIndex = match.index + matchedText.length;
        }
        if (lastIndex < source.length) nodes.push(source.slice(lastIndex));
        return nodes.length ? nodes : source;

     · 疑问句/否定句构成（助动词 do/does/did/is/are/was/were 的位置变化）
     · 重点动词及搭配（该动词常见搭配或固定介词用法）
   - 禁忌：严禁重新翻译主干大意，严禁讲修饰成分。
   - 比喻：请使用"语法放大镜"或"词汇变身装"的比喻。

3. modifier (细节修饰小贴纸) 专属职责：

     · 副词/副词短语：贴在动词或形容词上，告诉我们"怎么做/程度如何"。
     · 定语从句（who/which/that 引导）：贴在哪个名词后，进一步说明那个名词是什么/怎么样。
     · 同位语从句（that 引导，紧跟抽象名词）：贴在哪个名词后，解释那个名词的具体内容。

   - 禁忌：绝对不要重复主干意思和动词时态。
