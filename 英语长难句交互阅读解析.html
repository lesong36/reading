      return { id, kind, label: `${kind} · ${id.slice(-4).toUpperCase()}` };
    };
    // Shared by the two GitHub Pages apps under https://lesong36.github.io.
    // It is intentionally an inbox rather than VocabMaster's whole app state,
    // so the receiving app can let its active learner accept the new words.
    const VOCAB_MASTER_READING_INBOX_KEY = 'vocabmaster_reader_inbox_v1';

    const normalizeQuizIdeaTree = (ideaTree) => {
      if (!ideaTree || typeof ideaTree !== 'object') return null;
      const normalizeNode = (node = {}) => ({
        label: String(node.label || '').trim(),
        text: String(node.text || '').trim(),
        blankId: node.blankId == null || node.blankId === '' ? null : String(node.blankId),
        blankIds: Array.isArray(node.blankIds) ? node.blankIds.map(blankId => String(blankId)).filter(Boolean) : [],
        entries: (Array.isArray(node.entries) ? node.entries : [{ text: node.text, blankId: node.blankId }])
          .map(entry => ({
            text: String(entry?.text || '').trim(),
            blankId: entry?.blankId == null || entry.blankId === '' ? null : String(entry.blankId),
            blankIds: Array.isArray(entry?.blankIds) ? entry.blankIds.map(blankId => String(blankId)).filter(Boolean) : []
          }))
          .filter(entry => entry.text)
      });
      const mainIdea = normalizeNode(ideaTree.mainIdea);
      if (!mainIdea.label || !mainIdea.text) return null;
      const normalizeDetails = (details = []) => (Array.isArray(details) ? details : [])
        .map(normalizeNode)
        .filter(detail => detail.label && detail.text);
      return {
        mainIdea,
        branches: (Array.isArray(ideaTree.branches) ? ideaTree.branches : [])
          .map(branch => ({ ...normalizeNode(branch), details: normalizeDetails(branch.details) }))
          .filter(branch => branch.label && branch.text),
        details: normalizeDetails(ideaTree.details)
      };
    };

    const normalizeQuizCompareChart = (compareChart) => {
      if (!compareChart || typeof compareChart !== 'object') return null;
      const groups = Array.isArray(compareChart.groups) ? compareChart.groups
        .map(group => ({
          label: String(group?.label || '').trim(),
          items: (Array.isArray(group?.items) ? group.items : []).map(item => ({
            text: String(item?.text || '').trim(),
            blankIds: Array.isArray(item?.blankIds) ? item.blankIds.map(blankId => String(blankId)).filter(Boolean) : []
          })).filter(item => item.text)
        }))
        .filter(group => group.label && group.items.length > 0)
        : [];
      return groups.length >= 2 ? { groups } : null;
    };

    const normalizeQuizTimeline = (timeline) => {
      if (!timeline || typeof timeline !== 'object') return null;
      const events = Array.isArray(timeline.events) ? timeline.events
        .map(event => ({
          text: String(event?.text || '').trim(),
          blankIds: Array.isArray(event?.blankIds) ? event.blankIds.map(blankId => String(blankId)).filter(Boolean) : []
        }))
        .filter(event => event.text)
        : [];
      return events.length >= 2 ? { events } : null;
    };

    const normalizeQuizKnowledgeChart = (knowledgeChart) => {
      if (!knowledgeChart || typeof knowledgeChart !== 'object') return null;
      const groups = Array.isArray(knowledgeChart.groups) ? knowledgeChart.groups
        .map(group => ({
          label: String(group?.label || '').trim(),
          items: (Array.isArray(group?.items) ? group.items : []).map(item => ({
            text: String(item?.text || '').trim(),
            blankIds: Array.isArray(item?.blankIds) ? item.blankIds.map(blankId => String(blankId)).filter(Boolean) : []
          })).filter(item => item.text)
        }))
        .filter(group => group.label && group.items.length > 0)
        : [];
      return groups.length === 3 ? { groups } : null;
    };

    const normalizeQuizGroupedChart = (chart) => {
      if (!chart || typeof chart !== 'object') return null;
      const groups = Array.isArray(chart.groups) ? chart.groups
        .map(group => ({
          label: String(group?.label || '').trim(),
          items: (Array.isArray(group?.items) ? group.items : []).map(item => ({
            text: String(item?.text || '').trim(),
            blankIds: Array.isArray(item?.blankIds) ? item.blankIds.map(blankId => String(blankId)).filter(Boolean) : []
          })).filter(item => item.text)
        }))
        .filter(group => group.label && group.items.length > 0)
        : [];
      return groups.length >= 2 ? { groups } : null;
    };

    const normalizeQuizQuestion = (question = {}, fallbackIndex = 0) => {
      const options = Array.isArray(question.options)
        ? question.options
            .map(option => String(option ?? '').trim())
            .filter(Boolean)
        : [];
      const parsedIndex = Number(question.index);
      const answerIndex = Number.isInteger(question.answerIndex) ? question.answerIndex : null;
      const answerIndexes = Array.isArray(question.answerIndexes)
        ? [...new Set(question.answerIndexes.filter(index => Number.isInteger(index) && index >= 0 && index < options.length))]
            .sort((left, right) => left - right)
        : [];
      const blanks = Array.isArray(question.blanks)
        ? question.blanks.map((blank, index) => ({
            id: String(blank?.id || `blank-${index + 1}`),
            prompt: String(blank?.prompt || '').trim(),
            answerIndex: Number.isInteger(blank?.answerIndex) && blank.answerIndex >= 0 && blank.answerIndex < options.length
              ? blank.answerIndex
              : null
          })).filter(blank => blank.prompt && Number.isInteger(blank.answerIndex))
        : [];
      const ideaTree = normalizeQuizIdeaTree(question.ideaTree);
      const compareChart = normalizeQuizCompareChart(question.compareChart);
      const timeline = normalizeQuizTimeline(question.timeline);
      const retelling = normalizeQuizTimeline(question.retelling);
      const knowledgeChart = normalizeQuizKnowledgeChart(question.knowledgeChart);
      const fiveWOneH = normalizeQuizGroupedChart(question.fiveWOneH);
      const classification = normalizeQuizGroupedChart(question.classification);
      const explicitType = String(question.type || '').trim().toLowerCase();
      const inferredType = explicitType || (
        Number.isInteger(answerIndex) && options.length >= 2 ? 'single' : 'unsupported'
      );
      const normalizedType = inferredType === 'single' && Number.isInteger(answerIndex) && options.length >= 2
        ? 'single'
        : inferredType === 'multiple' && answerIndexes.length >= 2 && options.length >= 2
          ? 'multiple'
          : inferredType === 'word-bank' && blanks.length >= 2 && options.length >= 2
            ? 'word-bank'
          : 'unsupported';
      return {
        ...question,
        id: String(question.id || `q${parsedIndex || fallbackIndex + 1}`),
        index: Number.isFinite(parsedIndex) ? parsedIndex : fallbackIndex + 1,
        prompt: String(question.prompt || '').trim(),
        options,
        ideaTree,
        compareChart,
        timeline,
        retelling,
        knowledgeChart,
        fiveWOneH,
        classification,
        chartLayout: String(question.chartLayout || '').trim(),
        answerIndex,
        answerIndexes,
        blanks,
        paragraphHint: question.paragraphHint == null || question.paragraphHint === ''
          ? null
          : String(question.paragraphHint).trim(),
        type: normalizedType,
        rawAnswer: question.rawAnswer ? String(question.rawAnswer).trim() : ''
      };
    };

    const normalizeArticleQuestions = (article = {}) => {
      const combined = [
        ...(Array.isArray(article.questions) ? article.questions : []),
        ...(Array.isArray(article.unsupportedQuestions) ? article.unsupportedQuestions : [])
      ];
      return combined
        .map((question, index) => normalizeQuizQuestion(question, index))
        .sort((left, right) => left.index - right.index);
    };

    const isRfdFourOrLater = (articleId = '') => /^rfd(?:[4-9]|[1-9]\d)-/i.test(String(articleId));

    // RFD 4+ uses a repeated "Main idea → Sub-idea → Detail" chart format.
    // Keep the source prompt as the single source of truth, but render those
    // explicit labels as a hierarchy instead of an indented text paragraph.
    const parseQuizIdeaTree = (prompt = '', articleId = '') => {
      if (!isRfdFourOrLater(articleId)) return null;
      const lines = String(prompt)
        .replace(/\r/g, '')
        .split('\n')
        .map(line => line.trim())
        .filter(Boolean);
      const mainIdeaIndex = lines.findIndex(line => /^main\s*idea\s*\d*\s*:/i.test(line));
      if (mainIdeaIndex < 0) return null;

      const parseLabeledLine = (line, pattern) => {
        const match = line.match(pattern);
        return match ? { label: match[1].trim(), text: match[2].trim() } : null;
      };
      const mainIdea = parseLabeledLine(lines[mainIdeaIndex], /^(main\s*idea\s*\d*)\s*:\s*(.+)$/i);
      if (!mainIdea) return null;

      const instruction = lines
        .slice(0, mainIdeaIndex)
        .filter(line => !/^(?:words?\s*:|[a-z]\.)/i.test(line))
        .join(' ');
      const details = [];
      const branches = [];
      let activeBranch = null;

      for (const line of lines.slice(mainIdeaIndex + 1)) {
        if (/^请完成第\s*\d+\s*空。?$/u.test(line)) break;
        const branch = parseLabeledLine(line, /^(sub[-\s]*idea\s*\d*)\s*:\s*(.+)$/i);
        if (branch) {
          activeBranch = { ...branch, details: [] };
          branches.push(activeBranch);
          continue;
        }
        const detail = parseLabeledLine(line.replace(/^(?:[-•]\s*)/, ''), /^(detail\s*\d*)\s*:\s*(.+)$/i);
        if (detail) {
          (activeBranch ? activeBranch.details : details).push(detail);
        }
      }

      return details.length || branches.length
        ? { instruction, mainIdea, details, branches }
        : null;
    };

    const QuizIdeaTree = ({ tree }) => (
      <section className="mt-4" aria-label="主旨与细节结构图">
        {tree.instruction && <p className="mb-4 text-xl font-black leading-relaxed text-slate-900">{tree.instruction}</p>}
        <div className="rounded-3xl border border-indigo-100 bg-gradient-to-br from-indigo-50/80 via-white to-sky-50/70 p-4 shadow-sm sm:p-5">
          <div className="flex items-start gap-3">
            <span className="mt-1 flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-indigo-600 text-xs font-black text-white shadow-sm">★</span>
            <div className="min-w-0 flex-1 rounded-2xl border border-indigo-200 bg-white px-4 py-3 shadow-sm">
              <p className="text-[11px] font-black uppercase tracking-[0.16em] text-indigo-600">{tree.mainIdea.label}</p>
              <p className="mt-1 text-base font-black leading-7 text-slate-900 sm:text-lg">{tree.mainIdea.text}</p>
            </div>
          </div>

          <div className="relative ml-4 mt-1 border-l-2 border-indigo-200 pb-1 pl-6 pt-4 sm:ml-5 sm:pl-7">
            {tree.details.map((detail, index) => (
              <div key={`${detail.label}-${index}`} className="relative pb-3 before:absolute before:-left-6 before:top-5 before:h-0.5 before:w-5 before:bg-indigo-200 sm:before:-left-7 sm:before:w-6">
                <div className="rounded-2xl border border-sky-100 bg-white/90 px-4 py-3">
                  <p className="text-[11px] font-black uppercase tracking-[0.14em] text-sky-700">{detail.label}</p>
                  <p className="mt-1 text-sm font-semibold leading-6 text-slate-800 sm:text-base">{detail.text}</p>
                </div>
              </div>
            ))}
            {tree.branches.map((branch, branchIndex) => (
              <div key={`${branch.label}-${branchIndex}`} className="relative pb-4 before:absolute before:-left-6 before:top-5 before:h-0.5 before:w-5 before:bg-indigo-200 sm:before:-left-7 sm:before:w-6">
                <div className="rounded-2xl border border-violet-200 bg-violet-50/80 px-4 py-3">
                  <p className="text-[11px] font-black uppercase tracking-[0.14em] text-violet-700">{branch.label}</p>
                  <p className="mt-1 text-sm font-black leading-6 text-slate-900 sm:text-base">{branch.text}</p>
                </div>
                {branch.details.length > 0 && (
                  <div className="relative ml-4 mt-2 border-l-2 border-sky-100 pl-5 sm:ml-5 sm:pl-6">
                    {branch.details.map((detail, detailIndex) => (
                      <div key={`${detail.label}-${detailIndex}`} className="relative pb-2 before:absolute before:-left-5 before:top-5 before:h-0.5 before:w-4 before:bg-sky-100 sm:before:-left-6 sm:before:w-5">
                        <div className="rounded-xl border border-sky-100 bg-white/90 px-3 py-2.5">
                          <p className="text-[10px] font-black uppercase tracking-[0.14em] text-sky-700">{detail.label}</p>
                          <p className="mt-0.5 text-sm font-medium leading-6 text-slate-700">{detail.text}</p>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            ))}
          </div>
        </div>
      </section>
    );

    const isSupportedQuizQuestion = (question = {}) => (
      question.type === 'single' && Number.isInteger(question.answerIndex)
      || question.type === 'multiple' && Array.isArray(question.answerIndexes) && question.answerIndexes.length >= 2
      || question.type === 'word-bank' && Array.isArray(question.blanks) && question.blanks.length >= 2 && question.blanks.every(blank => Number.isInteger(blank.answerIndex))
    ) && Array.isArray(question.options) && question.options.length >= 2;

    const normalizeQuizAnswer = (value) => {
      if (Number.isInteger(value)) return value;
      if (Array.isArray(value)) return [...new Set(value.filter(Number.isInteger))].sort((left, right) => left - right);
      if (value && typeof value === 'object') {
        return Object.fromEntries(Object.entries(value).filter(([blankId, index]) => String(blankId).trim() && Number.isInteger(index)));
      }
      return typeof value === 'string' && value.trim() ? value : null;
    };
    const getWordBankAnswers = (answer) => answer && typeof answer === 'object' && !Array.isArray(answer) ? answer : {};
    const isQuizAnswerComplete = (question, answer) => question?.type === 'multiple'
      ? Array.isArray(answer)
        && answer.length === question.answerIndexes.length
        && answer.every(index => Number.isInteger(index) && index >= 0 && index < question.options.length)
      : question?.type === 'word-bank'
        ? question.blanks.every(blank => {
            const answerIndex = getWordBankAnswers(answer)[blank.id];
            return Number.isInteger(answerIndex) && answerIndex >= 0 && answerIndex < question.options.length;
          })
      : Number.isInteger(answer);
    const isQuizAnswerCorrect = (question, answer) => question?.type === 'multiple'
      ? Array.isArray(answer)
        && answer.length === question.answerIndexes.length
        && answer.every((index, position) => index === question.answerIndexes[position])
      : question?.type === 'word-bank'
        ? question.blanks.every(blank => getWordBankAnswers(answer)[blank.id] === blank.answerIndex)
      : answer === question?.answerIndex;
    const isQuizOptionSelected = (answer, optionIndex) => Array.isArray(answer)
      ? answer.includes(optionIndex)
      : answer === optionIndex;
    const getQuizLocatorKey = (question, blankId = null) => question?.type === 'word-bank' && blankId
      ? `${question.id}::${blankId}`
      : question?.id || null;
    const getQuizLocatorKeys = (question) => question?.type === 'word-bank'
      ? question.blanks.map(blank => getQuizLocatorKey(question, blank.id))
      : [getQuizLocatorKey(question)].filter(Boolean);

    const createEmptyQuizProgress = () => ({
      answers: {},
      locatorSentenceIds: {},
      submitted: false,
      submittedAt: null,
      lastAnsweredAt: null
    });

    const normalizeQuizProgress = (progress = {}) => {
      const normalizedAnswers = Object.entries(progress?.answers || {}).reduce((acc, [questionId, value]) => {
        const normalized = normalizeQuizAnswer(value);
        if (normalized !== null && (!Array.isArray(normalized) || normalized.length)) acc[questionId] = normalized;
        return acc;
      }, {});
      const locatorSentenceIds = Object.entries(progress?.locatorSentenceIds || {}).reduce((acc, [questionId, sentenceId]) => {
        if (typeof sentenceId === 'string' && sentenceId.trim()) acc[questionId] = sentenceId.trim();
        return acc;
      }, {});
      return {
        answers: normalizedAnswers,
        locatorSentenceIds,
        submitted: Boolean(progress?.submitted),
        submittedAt: progress?.submittedAt || null,
        lastAnsweredAt: progress?.lastAnsweredAt || null
      };
    };

    const mergeQuizProgress = (local = {}, cloud = {}) => {
      const localProgress = normalizeQuizProgress(local);
      const cloudProgress = normalizeQuizProgress(cloud);
      const localSubmittedAt = Date.parse(localProgress.submittedAt || '') || 0;
      const cloudSubmittedAt = Date.parse(cloudProgress.submittedAt || '') || 0;
      const latestSubmission = localSubmittedAt >= cloudSubmittedAt ? localProgress : cloudProgress;
      const localAnsweredAt = Date.parse(localProgress.lastAnsweredAt || '') || 0;
      const cloudAnsweredAt = Date.parse(cloudProgress.lastAnsweredAt || '') || 0;
      return {
        answers: { ...cloudProgress.answers, ...localProgress.answers },
        locatorSentenceIds: { ...cloudProgress.locatorSentenceIds, ...localProgress.locatorSentenceIds },
        submitted: localProgress.submitted || cloudProgress.submitted,
        submittedAt: latestSubmission.submittedAt || null,
        lastAnsweredAt: localAnsweredAt >= cloudAnsweredAt ? localProgress.lastAnsweredAt : cloudProgress.lastAnsweredAt
      };
    };

    const mergeQuizProgressByArticle = (local = {}, cloud = {}) => {
      const articleIds = new Set([...Object.keys(cloud || {}), ...Object.keys(local || {})]);
      return Array.from(articleIds).reduce((merged, articleId) => {
        merged[articleId] = mergeQuizProgress(local?.[articleId], cloud?.[articleId]);
        return merged;
      }, {});
    };

    const getQuizProgressStorageKey = (articleId) =>
      articleId ? `${QUIZ_PROGRESS_STORAGE_KEY_PREFIX}${articleId}` : null;

    // Paragraph-to-text models are optional content-sidecar files.  They are
    // generated and validated before shipping, so the reader only normalizes
    // the small surface it needs and never asks an AI to reconstruct structure.
    const READING_ACTIVITY_PROGRESS_STORAGE_KEY_PREFIX = 'reader_article_reading_activity_progress_';
    const getReadingActivityProgressStorageKey = (articleId) =>
      articleId ? `${READING_ACTIVITY_PROGRESS_STORAGE_KEY_PREFIX}${articleId}` : null;
    // Unlike a quiz, the article routine stores the child's path through two
    // reading passes.  It deliberately keeps choices separate from the model:
    // the model is teaching material, while this is the learner's work.
    const READING_ROUTINE_PROGRESS_STORAGE_KEY_PREFIX = 'reader_article_reading_routine_v1_';
    const getReadingRoutineProgressStorageKey = (articleId) =>
      articleId ? `${READING_ROUTINE_PROGRESS_STORAGE_KEY_PREFIX}${articleId}` : null;
    const createEmptyReadingRoutineProgress = () => ({
      firstPassIndex: 0,
      notes: {},
      predictions: {},
      functions: {},
      connections: {},
      sections: {},
      structure: {},
      wholeText: {}
    });
    const normalizeReadingRoutineProgress = (value = {}) => ({
      ...createEmptyReadingRoutineProgress(),
      ...(value && typeof value === 'object' ? value : {}),
      notes: value?.notes && typeof value.notes === 'object' ? value.notes : {},
      predictions: value?.predictions && typeof value.predictions === 'object' ? value.predictions : {},
      functions: value?.functions && typeof value.functions === 'object' ? value.functions : {},
      connections: value?.connections && typeof value.connections === 'object' ? value.connections : {},
      sections: value?.sections && typeof value.sections === 'object' ? value.sections : {},
      structure: value?.structure && typeof value.structure === 'object' ? value.structure : {},
      wholeText: value?.wholeText && typeof value.wholeText === 'object' ? value.wholeText : {}
    });
    const normalizeReadingModel = (model = {}) => {
      if (model?.schema_version === '2.0-mvp'
        && model?.article?.id
        && Array.isArray(model?.pedagogy?.checkpoints)
        && Array.isArray(model?.pedagogy?.entry?.options)
        && Array.isArray(model?.pedagogy?.final?.options)) return model;
      if (model?.schema_version !== '1.0' || !model?.article?.id || !Array.isArray(model?.pedagogy?.activities)) return null;
      return model;
    };
    const isArticleReadingMvpV2 = (model) => model?.schema_version === '2.0-mvp';
    const READING_MVP_V2_PROGRESS_STORAGE_KEY_PREFIX = 'reader_article_reading_mvp_v2_';
    const getReadingMvpV2ProgressStorageKey = (articleId) =>
      articleId ? `${READING_MVP_V2_PROGRESS_STORAGE_KEY_PREFIX}${articleId}` : null;
    const createEmptyReadingMvpV2Progress = () => ({
      entryChoiceId: null,
      entryStarted: false,
      checkpoints: {},
      final: {}
    });
    const normalizeReadingMvpV2Progress = (value = {}) => ({
      ...createEmptyReadingMvpV2Progress(),
      ...(value && typeof value === 'object' ? value : {}),
      checkpoints: value?.checkpoints && typeof value.checkpoints === 'object' ? value.checkpoints : {},
      final: value?.final && typeof value.final === 'object' ? value.final : {}
    });
    const sameIdSelection = (left = [], right = []) => {
      const normalized = (values) => [...new Set(values || [])].map(String).sort();
      const a = normalized(left), b = normalized(right);
      return a.length === b.length && a.every((value, index) => value === b[index]);
    };

    const normalizeCompletionRecords = (records = {}) => Object.entries(records || {}).reduce((acc, [articleId, record]) => {
      if (!articleId || !record?.completedAt) return acc;
      acc[articleId] = {
        completedAt: record.completedAt,
        durationMs: record.durationMs == null || record.durationMs === '' ? null : (Number.isFinite(Number(record.durationMs)) ? Math.max(0, Number(record.durationMs)) : null),
        accuracy: Number.isFinite(Number(record.accuracy)) ? Number(record.accuracy) : null,
        correctCount: Number.isFinite(Number(record.correctCount)) ? Number(record.correctCount) : null,
        totalCount: Number.isFinite(Number(record.totalCount)) ? Number(record.totalCount) : null,
        tags: Array.isArray(record.tags) ? record.tags.map(tag => String(tag).trim()).filter(Boolean).slice(0, 8) : []
      };
      return acc;
    }, {});

    const mergeCompletionRecords = (local = {}, cloud = {}) => {
      const byArticleId = { ...normalizeCompletionRecords(cloud) };
      Object.entries(normalizeCompletionRecords(local)).forEach(([articleId, record]) => {
        const existing = byArticleId[articleId];
        if (!existing || (Date.parse(record.completedAt) || 0) >= (Date.parse(existing.completedAt) || 0)) {
          byArticleId[articleId] = record;
        }
      });
      return byArticleId;
    };

    const completionDayKey = (timestamp) => {
      const date = new Date(timestamp);
      return Number.isNaN(date.getTime()) ? '' : date.toLocaleDateString('zh-CN');
    };

    const completionTimeLabel = (timestamp) => {
      const date = new Date(timestamp);
      return Number.isNaN(date.getTime()) ? '' : date.toLocaleString('zh-CN', {
        month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false
      });
    };

      const formatReadingDuration = (durationMs) => {
        if (durationMs == null || durationMs === '' || !Number.isFinite(Number(durationMs))) return '未记录';
      const totalMinutes = Math.max(0, Math.round(Number(durationMs || 0) / 60000));
      if (!totalMinutes) return '不足 1 分钟';
      const hours = Math.floor(totalMinutes / 60);
      const minutes = totalMinutes % 60;
      return hours ? `${hours} 小时${minutes ? ` ${minutes} 分钟` : ''}` : `${minutes} 分钟`;
    };

    const groupVocabForStudy = (vocab = []) => {
      const buckets = new Map();
      vocab.forEach(entry => {
        const day = entry.addedAt || completionDayKey(entry.timestamp) || '未标注日期';
        const article = entry.sourceArticleTitle || '其他来源';
        const key = `${day}::${entry.sourceArticleId || article}`;
        if (!buckets.has(key)) buckets.set(key, { key, day, article, words: [] });
        buckets.get(key).words.push(entry);
      });
      return Array.from(buckets.values())
        .sort((a, b) => String(b.words[0]?.timestamp || 0).localeCompare(String(a.words[0]?.timestamp || 0)))
        .flatMap(bucket => bucket.words.map((_, index) => index % 20 === 0
          ? { ...bucket, words: bucket.words.slice(index, index + 20), batch: Math.floor(index / 20) + 1 }
          : null).filter(Boolean));
    };

    const normalizeSavedArticles = (articles = []) =>
      Array.isArray(articles)
        ? articles.map(article => {
            const { unsupportedQuestions, ...restArticle } = article || {};
            const data = normalizeArticleData(article.data);
            return {
              ...restArticle,
              data,
              questions: normalizeArticleQuestions(article),
              glossary: collectArticleGlossary(article, data),
              readability: article.readability || computeArticleReadability(data)
            };
          })
        : [];

    const fetchBundledLibraryArticles = async () => {
      const bundles = await Promise.all(BUNDLED_LIBRARY_URLS.map(async (url) => {
        const response = await fetch(`${url}?v=${BUNDLED_LIBRARY_SEED_VERSION}`, { cache: 'no-store' });
        if (!response.ok) throw new Error(`预置教材加载失败（${url}，HTTP ${response.status}）`);
        const importedData = await response.json();
        if (!Array.isArray(importedData)) throw new Error(`预置教材文件格式不正确：${url}`);
        return importedData;
      }));
      return mergeSavedArticles([], bundles.flat());
    };

    // Keep the reader's book on the same identity rule as VocabMaster:
    // surrounding whitespace and casing never make a second vocabulary word.
    const normalizeVocabBook = (vocab = []) => {
      const byKey = new Map();
      (Array.isArray(vocab) ? vocab : []).forEach(entry => {
        if (!entry || typeof entry.word !== 'string') return;
        const word = entry.word.trim();
        const key = word.toLowerCase();
        if (!key) return;
        const existing = byKey.get(key);
        if (!existing || (entry.timestamp || 0) >= (existing.timestamp || 0)) {
          byKey.set(key, { ...entry, word });
        }
      });
      return Array.from(byKey.values()).sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
    };
    const getVocabKey = (word = {}) => String(word?.word || word?.id || '').trim().toLowerCase();
    const normalizeDeletedVocabKeys = (keys = []) => Array.from(new Set(
      (Array.isArray(keys) ? keys : []).map(key => String(key || '').trim().toLowerCase()).filter(Boolean)
    ));
    const removeDeletedVocab = (vocab = [], deletedVocabKeys = []) => {
      const deleted = new Set(normalizeDeletedVocabKeys(deletedVocabKeys));
      return normalizeVocabBook(vocab).filter(word => !deleted.has(getVocabKey(word)));

    const LIBRARY_FILTERS = [

      { key: 'rfd3', label: 'RFD3' },
      { key: 'rfd4', label: 'RFD4' },
      { key: 'rfd5', label: 'RFD5' },
      { key: 'rfd6', label: 'RFD6' },

    const getArticleFilterKey = (article = {}) => {
      const sourceText = [
        article.id,
        article.title,
        article.source?.file,
        article.source?.section
      ].filter(Boolean).join(' ').toLowerCase();

      if (sourceText.includes('rfd1')) return 'rfd1';
      if (sourceText.includes('rfd2')) return 'rfd2';
      if (sourceText.includes('rfd3')) return 'rfd3';
      if (sourceText.includes('rfd4')) return 'rfd4';
      if (sourceText.includes('rfd5')) return 'rfd5';
      if (sourceText.includes('rfd6')) return 'rfd6';
      if (sourceText.includes('四上')) return '四上';
      if (sourceText.includes('tpo-')) return 'tpo';
      if (sourceText.includes('og /') || sourceText.includes('og-test') || sourceText.includes('online-test') || sourceText.includes('official-model-exam')) return 'og';
      if (sourceText.includes('re-foundations') || sourceText.includes('re foundations')) return 're';
      if (sourceText.includes('shiwen-') || sourceText.includes('时文阅读')) return 'shiwen';
      return 'other';
    };

    // A library title often carries both its curriculum address and the actual
    // reading topic.  Keep those two jobs separate so the topic is not pushed
    // out of the card by a long address (for example, RE Foundations / 1A).
    const getLibraryArticlePresentation = (article = {}) => {
      const title = String(article.title || '未命名文章').trim();
      const parts = title.split('/').map(part => part.trim()).filter(Boolean);
      const filter = getArticleFilterKey(article);
      const fallback = { location: '', topic: title, detail: '' };

      if (filter === 're' && parts.length >= 3) {
        return { location: parts.slice(0, 2).join(' · '), topic: parts.slice(2).join(' / '), detail: '' };
      }
      if ((filter === 'og' || filter === 'tpo') && parts.length >= 2) {
        return { location: parts[0], topic: parts.slice(1).join(' / '), detail: '' };
      }
      if (filter === 'shiwen' && parts.length >= 3) {
        return {
          location: parts.slice(0, 2).join(' · '),
          topic: parts.slice(2).join(' / '),
          detail: article.source?.type || ''
        };
      }
      return fallback;
    };

    const getTpoArticleCount = (articles = []) =>

        ['rfd5-13-Unit-13-The-First-Scales', 'q8', 'main-idea-tree', 'ideaTree'], ['rfd5-14-Unit-14-Weighing-a-Planet', 'q8', 'timeline', 'timeline'],
        ['rfd5-15-Unit-15-Catching-Rain', 'q8', 'main-idea-tree', 'ideaTree'], ['rfd5-16-Unit-16-Weather-Models', 'q8', 'knowledge-chart', 'knowledgeChart']

      return requiredLayouts.every(([articleId, questionId, layout, field]) => {

        return question?.chartLayout === layout && question?.[field];

    const getReFoundationsArticleCount = (articles = []) =>
      normalizeSavedArticles(articles)
        .filter(article => getArticleFilterKey(article) === 're')
        .length;

    const sortArticlesByTitle = (articles = []) =>
      [...articles].sort((left, right) =>
        String(left.title || '').localeCompare(String(right.title || ''), 'en', {
          numeric: true,
          sensitivity: 'base'
        })
      );

    const mergeSavedArticles = (current = [], incoming = [], { preferIncoming = false } = {}) => {
      const byId = new Map();
      normalizeSavedArticles(current).forEach(article => {
        if (!article || !article.id) return;
        const existing = byId.get(article.id);
        if (!existing || (article.timestamp || 0) >= (existing.timestamp || 0)) {
          byId.set(article.id, article);
        }
      });
      normalizeSavedArticles(incoming).forEach(article => {
        if (!article || !article.id) return;
        const existing = byId.get(article.id);
        if (preferIncoming || !existing || (article.timestamp || 0) >= (existing.timestamp || 0)) {
          byId.set(article.id, article);
        }
      });
      return Array.from(byId.values()).sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
    };

    const mergeVocabBook = (current = [], incoming = [], deletedVocabKeys = []) => {
      const byKey = new Map();
      [...removeDeletedVocab(current, deletedVocabKeys), ...removeDeletedVocab(incoming, deletedVocabKeys)].forEach(word => {
        if (!word) return;
        const key = getVocabKey(word);
        if (!key) return;
        const existing = byKey.get(key);
        if (!existing || (word.timestamp || 0) >= (existing.timestamp || 0)) {
          byKey.set(key, word);
        }
      });
      return Array.from(byKey.values()).sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
    };

    const readLocalDataFile = async () => {
      if (!navigator.storage?.getDirectory) {
        throw new Error('当前浏览器不支持本地文件持久化。');
      }
      const root = await navigator.storage.getDirectory();
      const handle = await root.getFileHandle(LOCAL_DATA_FILE_NAME, { create: true });
      const file = await handle.getFile();
      const text = await file.text();
      if (!text.trim()) return createLocalDataSnapshot();
      const parsed = JSON.parse(text);
      return {
        version: parsed.version || 1,
        savedAt: parsed.savedAt || "",
        savedArticles: Array.isArray(parsed.savedArticles) ? parsed.savedArticles : [],
        vocabBook: Array.isArray(parsed.vocabBook) ? parsed.vocabBook : [],
        completionRecords: normalizeCompletionRecords(parsed.completionRecords || {}),
        deletedVocabKeys: normalizeDeletedVocabKeys(parsed.deletedVocabKeys || [])
      };
    };

    const writeLocalDataFile = async (articles, vocab, completionRecords = {}, deletedVocabKeys = []) => {
      if (!navigator.storage?.getDirectory) {
        throw new Error('当前浏览器不支持本地文件持久化。');
      }
      const root = await navigator.storage.getDirectory();
      const handle = await root.getFileHandle(LOCAL_DATA_FILE_NAME, { create: true });
      const writable = await handle.createWritable();
      await writable.write(JSON.stringify(createLocalDataSnapshot(articles, vocab, completionRecords, deletedVocabKeys), null, 2));
      await writable.close();
    };

    // Full reader bundles are larger than the browser's localStorage quota.
    // OPFS is the primary store; localStorage is a best-effort fallback only.
    const trySetLocalStorage = (key, value) => {
      try {
        localStorage.setItem(key, value);
        return true;
      } catch (error) {
        if (error?.name === 'QuotaExceededError') {
          console.warn(`localStorage quota reached; ${key} will remain in the local data file.`, error);
          return false;
        }
        throw error;
      }
    };

    const clearLocalLearningStorage = async () => {
      localStorage.removeItem('my_local_articles');
      localStorage.removeItem('my_local_vocab_book');
      localStorage.removeItem('reader_deleted_vocab_keys_v1');
      localStorage.removeItem(COMPLETION_RECORDS_STORAGE_KEY);

      if (navigator.storage?.getDirectory) {
        const root = await navigator.storage.getDirectory();
        const handle = await root.getFileHandle(LOCAL_DATA_FILE_NAME, { create: true });
        const writable = await handle.createWritable();
        await writable.write(JSON.stringify(createLocalDataSnapshot([], [], {}, []), null, 2));
        await writable.close();
      }
    };

    const buildAiRequestError = (provider, err) => {
      const message = err?.message || '未知错误';
      if (provider === 'ollama') {
        const fileOriginBlocked = window.location.protocol === 'file:' && (
          message.includes('Failed to fetch') ||
          message.includes('NetworkError')
        );
        if (fileOriginBlocked) {
          return new Error('当前浏览器未能从 file:// 页面访问 Ollama。此机器通常可以直接双击 HTML 使用；如果你的浏览器拦截了本地请求，再考虑改用本地静态服务。');
        }
        return new Error(`Ollama 请求失败：${message}`);
      }
      return new Error(`云端模型请求失败：${message}`);
    };

    const formatElapsed = (ms = 0) => {
      const totalSeconds = Math.max(0, Math.floor(ms / 1000));
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      return minutes > 0 ? `${minutes}分${seconds}秒` : `${seconds}秒`;
    };

    const decodeOpenAICompatStream = async (response, onProgress) => {
      if (!response.body) {
        const data = await response.json();
        return data?.choices?.[0]?.message?.content || "";
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let content = "";
      let chunkCount = 0;

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        const parts = buffer.split("\n\n");
        buffer = parts.pop() || "";

        for (const part of parts) {
          const lines = part.split("\n").map(line => line.trim()).filter(Boolean);
          for (const line of lines) {
            if (!line.startsWith("data:")) continue;
            const payload = line.slice(5).trim();
            if (!payload || payload === "[DONE]") continue;
            try {
              const parsed = JSON.parse(payload);
              const delta = parsed?.choices?.[0]?.delta?.content || "";
              if (delta) {
                content += delta;
                chunkCount += 1;
                onProgress?.({
                  phase: 'streaming',
                  receivedChars: content.length,
                  receivedChunks: chunkCount,
                  lastProgressAt: Date.now(),
                  text: content
                });
              }
            } catch (_) {
              // Ignore malformed interim SSE chunks and continue collecting.
            }
          }
        }
      }

      if (!content.trim()) {
        throw new Error('云端模型返回了空响应。');
      }
      return content;
    };

    const decodeOllamaStream = async (response, onProgress) => {
      if (!response.body) {
        const data = await response.json();
        return data?.message?.content?.trim?.() || "";
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let content = "";
      let chunkCount = 0;

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        const lines = buffer.split("\n");
        buffer = lines.pop() || "";

        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed) continue;
          try {
            const parsed = JSON.parse(trimmed);
            const piece = parsed?.message?.content || "";
            if (piece) {
              content += piece;
              chunkCount += 1;
              onProgress?.({
                phase: 'streaming',
                receivedChars: content.length,
                receivedChunks: chunkCount,
                lastProgressAt: Date.now(),
                text: content
              });
            }
          } catch (_) {
            // Ignore malformed interim NDJSON lines and continue collecting.
          }
        }
      }

      if (!content.trim()) {
        throw new Error('Ollama 返回了空响应。');
      }
      return content.trim();
    };

    const fetchOpenAICompatResponse = async ({
      userPrompt,
      systemPrompt,
      expectJson = false,
      apiKey = DEFAULT_OPENAI_COMPAT_API_KEY,
      model = DEFAULT_OPENAI_COMPAT_MODEL,
      baseUrl = DEFAULT_OPENAI_COMPAT_BASE_URL,
      onProgress
    }) => {
      const trimmedApiKey = sanitizeApiCredential(apiKey);
      if (!trimmedApiKey) {
        throw new Error('请先填写云端模型 API Key。');
      }
      if (/[^\x20-\x7E]/.test(trimmedApiKey)) {
        throw new Error('云端模型 API Key 包含异常字符。请重新粘贴纯文本 Key，避免中文空格、换行或隐藏字符。');
      }

      const url = `${baseUrl.replace(/\/+$/, '')}/chat/completions`;
      if (!baseUrl.trim()) {
        throw new Error('请先填写云端模型 API Base。');
      }
      if (!model.trim()) {
        throw new Error('请先填写云端模型名称。');
      }
      const payload = {
        model,
        stream: true,
        temperature: 0.6,
        max_tokens: 32000,
        response_format: expectJson ? { type: 'json_object' } : { type: 'text' },
        messages: [
          { role: 'system', content: systemPrompt },
          { role: 'user', content: userPrompt }
        ]
      };

      const delays = [1000, 2000];
      let lastError;

      for (let attempt = 0; attempt < 3; attempt++) {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 60000); // 60秒超时限制
        try {
          onProgress?.({ phase: 'requesting', lastProgressAt: Date.now() });
          const response = await fetch(url, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": `Bearer ${trimmedApiKey}`
            },
            body: JSON.stringify(payload),
            signal: controller.signal
          });
          clearTimeout(timeoutId);

          if (!response.ok) {
            const text = await response.text();
            const errMsg = `HTTP ${response.status}${text ? `: ${text}` : ''}`;
            const err = new Error(errMsg);
            // 400(Bad Request), 401(Unauthorized), 403(Forbidden), 404(Not Found) 等属于配置错误，不予重试直接抛出
            if ([400, 401, 403, 404].includes(response.status)) {
              throw err;
            }
            throw err;
          }
          onProgress?.({ phase: 'connected', lastProgressAt: Date.now() });
          const content = await decodeOpenAICompatStream(response, onProgress);
          return content;
        } catch (err) {
          clearTimeout(timeoutId);
          lastError = err;
          // 如果是 AbortError (超时) 或特定的网络配置错误，可以尝试重试；如果是 4xx 错误，直接向上抛出
          const isAbort = err.name === 'AbortError';
          const isConfigError = err.message.includes('HTTP 400') || err.message.includes('HTTP 401') || err.message.includes('HTTP 403') || err.message.includes('HTTP 404');
          if (isConfigError) {
            break;
          }
          if (attempt < 2) {
            await new Promise(r => setTimeout(r, delays[attempt]));
          }
        }
      }
      throw buildAiRequestError('cloud', lastError);
    };

    // 长文解析可能持续远超 5 分钟；用「空闲超时」代替绝对超时：
    // 有流式进度就重置计时，模型卡死无输出才会中断；另设绝对上限防挂死。
    // 空闲窗口略放宽，覆盖长文首 token 前的预填充等待。
    const OLLAMA_IDLE_TIMEOUT_MS = 10 * 60 * 1000;
    const OLLAMA_MAX_TIMEOUT_MS = 45 * 60 * 1000;

    const fetchOllamaResponse = async ({
      userPrompt,
      systemPrompt,
      expectJson = false,
      baseUrl = DEFAULT_OLLAMA_BASE_URL,
      model = DEFAULT_OLLAMA_MODEL,
      onProgress
    }) => {
      const cleanBaseUrl = sanitizeBaseUrl(baseUrl);
      const cleanModel = model.trim();
      if (!cleanModel) {
        throw new Error('请先填写 Ollama 模型名。');
      }

      const abortController = new AbortController();
      let abortReason = '';
      let idleTimeoutId = null;
      const absoluteTimeoutId = setTimeout(() => {
        abortReason = 'absolute';
        abortController.abort();
      }, OLLAMA_MAX_TIMEOUT_MS);

      const clearAllTimeouts = () => {
        if (idleTimeoutId) clearTimeout(idleTimeoutId);
        clearTimeout(absoluteTimeoutId);
      };

      const resetIdleTimeout = () => {
        if (idleTimeoutId) clearTimeout(idleTimeoutId);
        idleTimeoutId = setTimeout(() => {
          abortReason = 'idle';
          abortController.abort();
        }, OLLAMA_IDLE_TIMEOUT_MS);
      };

      const wrappedOnProgress = (progress) => {
        resetIdleTimeout();
        onProgress?.(progress);
      };

      resetIdleTimeout();
      try {
        wrappedOnProgress({ phase: 'requesting', lastProgressAt: Date.now() });
        const response = await fetch(`${cleanBaseUrl}/api/chat`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          signal: abortController.signal,
          body: JSON.stringify({
            model: cleanModel,
            stream: true,
            think: false,
            options: {
              temperature: expectJson ? 0.1 : 0.3,
              num_predict: 32000,
              num_ctx: 32768
            },
            messages: [
              { role: "system", content: systemPrompt },
              { role: "user", content: userPrompt }
            ]
          })
        });

        if (!response.ok) {
          const text = await response.text();
          throw new Error(`HTTP ${response.status}${text ? `: ${text}` : ''}`);
        }

        wrappedOnProgress({ phase: 'connected', lastProgressAt: Date.now() });
        const content = await decodeOllamaStream(response, wrappedOnProgress);
        clearAllTimeouts();
        return content;
      } catch (err) {
        clearAllTimeouts();
        if (err.name === 'AbortError') {
          if (abortReason === 'idle') {
            throw new Error('Ollama 长时间无响应（10分钟无新内容），请检查模型是否正常运行。');
          }
          throw new Error('Ollama 请求超时（已超过 45 分钟），请尝试缩短文本或稍后重试。');
        }
        throw buildAiRequestError('ollama', err);
      }
    };

    const fetchOllamaJsonResponse = async ({
      userPrompt,
      systemPrompt,
      baseUrl = DEFAULT_OLLAMA_BASE_URL,
      model = DEFAULT_OLLAMA_MODEL,
      onProgress
    }) => {
      const primaryPrompt = `${systemPrompt}\n\n【输出要求】\n1. 你必须输出合法 JSON。\n2. 不要输出 Markdown 代码块。\n3. 不要输出解释、前言或结语。\n4. JSON 之外不能有任何文字。`;

      const firstRaw = await fetchOllamaResponse({
        userPrompt,
        systemPrompt: primaryPrompt,
        expectJson: false,
        baseUrl,
        model,
        onProgress
      });

      try {

    const fetchDictionaryJson = async ({ baseUrl, apiKey = '', model, systemPrompt, userPrompt, disableThinking = false }) => {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 15000);
      try {
        const headers = { 'Content-Type': 'application/json' };
        if (apiKey) headers.Authorization = `Bearer ${sanitizeApiCredential(apiKey)}`;
        const response = await fetch(`${baseUrl.replace(/\/+$/, '')}/chat/completions`, {
          method: 'POST',
          headers,
          signal: controller.signal,
          body: JSON.stringify({
            model,
            stream: false,
            temperature: 0.1,
            max_tokens: 180,
            ...(disableThinking ? { chat_template_kwargs: { enable_thinking: false } } : {}),
            messages: [
              { role: 'system', content: systemPrompt },
              { role: 'user', content: userPrompt }
            ]
          })
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}: ${(await response.text()).slice(0, 240)}`);
        const payload = await response.json();
        const content = payload?.choices?.[0]?.message?.content;
        if (!content) throw new Error('服务返回了空释义。');
        return { content, usage: payload.usage || {} };
      } finally {
        clearTimeout(timeoutId);
      }
    };

    function App() {

      // Supabase Auth + cloud-sync state
      const [user, setUser] = useState(null);

      const [isLoginMode, setIsLoginMode] = useState(true);
      const [authError, setAuthError] = useState("");
      const [isAuthenticating, setIsAuthenticating] = useState(false);
      const [showCloudSettings, setShowCloudSettings] = useState(false);
      const [supabaseConfigInput, setSupabaseConfigInput] = useState(() => {

      });
      const [syncPassphrase, setSyncPassphrase] = useState("");
      const [syncVaultUnlocked, setSyncVaultUnlocked] = useState(false);
      const encryptedAiKeyRef = useRef(null);
      const [favoriteArticleIds, setFavoriteArticleIds] = useState(() => {
        try { return JSON.parse(localStorage.getItem('reader_favorite_article_ids') || '[]'); } catch { return []; }
      });
      const [cloudSyncRevision, setCloudSyncRevision] = useState(0);
      const [cloudSyncStatus, setCloudSyncStatus] = useState(() => ({
        enabled: Boolean(supabase),
        message: supabase ? 'Supabase 云同步已准备好，请登录账号。' : '云同步未配置，当前仅保存到本机。'

      const cloudDataLoadedRef = useRef(false);

      const lastCloudSnapshotRef = useRef("");
      const cloudReadingPositionsRef = useRef({});
      const [localPersistenceStatus, setLocalPersistenceStatus] = useState(() => ({
        enabled: false,

      const localDataLoadedRef = useRef(false);

      const [isLoadingBundledLibrary, setIsLoadingBundledLibrary] = useState(false);

      const scheduleCloudSyncRetry = (message, { retryable = true } = {}) => {
        cloudSyncNeedsMergeRef.current = true;
        if (!retryable) {
          cloudDataLoadedRef.current = false;
          setCloudSyncStatus({ enabled: false, message: `${message}；已暂停自动重试，避免重复消耗流量。` });
          return;
        }
        if (cloudDataRetryTimerRef.current) return;
        if (cloudSyncRetryAttemptRef.current >= 5) {
          cloudDataLoadedRef.current = false;
          setCloudSyncStatus({ enabled: false, message: `${message}；已暂停自动重试，请检查云同步配置后重新登录。` });
          return;
        }
        const delay = Math.min(60000, 5000 * (2 ** cloudSyncRetryAttemptRef.current));
        cloudSyncRetryAttemptRef.current += 1;
        setCloudSyncStatus({ enabled: false, message: `${message}；网络恢复后将自动合并并重写。` });
        cloudDataRetryTimerRef.current = setTimeout(() => {
          cloudDataRetryTimerRef.current = null;
          if (navigator.onLine === false) return;
          setCloudSyncRevision(value => value + 1);
        }, delay);
      };

      // --- 教材缓存逻辑 (OPFS File) ---
      const [savedArticles, setSavedArticles] = useState(() => {
        const saved = localStorage.getItem('my_local_articles');
        if (!saved) return [];
        try {
          const parsed = JSON.parse(saved);

      const articleFileInputRef = useRef(null);
      const [libraryFilter, setLibraryFilter] = useState('all');

      // --- 本地生词本逻辑 (Local Storage + OPFS File) ---
      const [vocabBook, setVocabBook] = useState(() => {
        const saved = localStorage.getItem('my_local_vocab_book');
        try {
          return saved ? normalizeVocabBook(JSON.parse(saved)) : [];
        } catch (error) {
          return [];
        }
      });
      const [deletedVocabKeys, setDeletedVocabKeys] = useState(() => {
        try { return normalizeDeletedVocabKeys(JSON.parse(localStorage.getItem('reader_deleted_vocab_keys_v1') || '[]')); } catch { return []; }
      });
      const [completionRecords, setCompletionRecords] = useState(() => {
        try { return normalizeCompletionRecords(JSON.parse(localStorage.getItem(COMPLETION_RECORDS_STORAGE_KEY) || '{}')); } catch { return {}; }
      });
      const [selectedRecordDate, setSelectedRecordDate] = useState(() => localDayKey(new Date()));
      const [recordMonthCursor, setRecordMonthCursor] = useState(() => {
        const date = new Date();
        return new Date(date.getFullYear(), date.getMonth(), 1);
      });
      const [dailyReportPreferences, setDailyReportPreferences] = useState(readDailyReportPreferences);
      const [deviceIdentity, setDeviceIdentity] = useState(readDeviceIdentity);
      const [dailyReportDelivery, setDailyReportDelivery] = useState(null);
      const [isTeacher, setIsTeacher] = useState(false);
      const [teacherReviewQueue, setTeacherReviewQueue] = useState([]);
      const [isLoadingTeacherReviews, setIsLoadingTeacherReviews] = useState(false);
      const [teacherReviewEdits, setTeacherReviewEdits] = useState({});
      const [reviewingReportId, setReviewingReportId] = useState(null);
      const [quizEvaluations, setQuizEvaluations] = useState(() => { try { return JSON.parse(localStorage.getItem('reader_quiz_evaluations_v1') || '{}'); } catch { return {}; } });
      const [evaluatingQuestionKey, setEvaluatingQuestionKey] = useState(null);
      const restoreVocabKeys = (keys = []) => {
        const restored = new Set(normalizeDeletedVocabKeys(keys));
        if (restored.size) setDeletedVocabKeys(previous => previous.filter(key => !restored.has(key)));
      };
      const readingSessionRef = useRef({ articleId: null, activeStartedAt: null, elapsedMs: 0 });
      const [lastReadingSession, setLastReadingSession] = useState(null);
      const [answerReportNote, setAnswerReportNote] = useState('');
      const [proposedAnswerIndex, setProposedAnswerIndex] = useState(null);
      const [isSubmittingAnswerReport, setIsSubmittingAnswerReport] = useState(false);

      const [vocabPopup, setVocabPopup] = useState(null);

      const [refreshingVocabId, setRefreshingVocabId] = useState(null);
      const contextualDictionaryCacheRef = useRef(new Map());
      const autoAddedVocabKeysRef = useRef(new Set());
      const p920DictionaryModelRef = useRef(null);
      const fileInputRef = useRef(null);
      const getActiveReadingDuration = (articleId) => {
        const session = readingSessionRef.current;
        if (!articleId || session.articleId !== articleId) return 0;
        return Math.max(0, session.elapsedMs + (session.activeStartedAt ? Date.now() - session.activeStartedAt : 0));
      };
      const pauseReadingSession = () => {
        const session = readingSessionRef.current;
        if (!session.activeStartedAt) return;
        session.elapsedMs += Math.max(0, Date.now() - session.activeStartedAt);
        session.activeStartedAt = null;
      };
      const resumeReadingSession = () => {
        const session = readingSessionRef.current;

      };
      const filteredLibraryArticles = useMemo(() => {

          ? savedArticles
          : savedArticles.filter(article => getArticleFilterKey(article) === libraryFilter);
        return sortArticlesByTitle(filtered);
      }, [savedArticles, libraryFilter]);
      const articlesById = useMemo(() => new Map(savedArticles.map(article => [article.id, article])), [savedArticles]);
      const dailyLearningRecords = useMemo(() => {
        const days = {};
        const ensure = (day) => days[day] || (days[day] = { day, completions: [], quizzes: [], vocab: [], totalDurationMs: 0, pendingReviews: 0 });
        Object.entries(completionRecords).forEach(([articleId, record]) => {
          const day = localDayKey(record.completedAt); if (!day) return;
          const article = articlesById.get(articleId);
          const item = { articleId, title: article?.title || articleId, ...record };
          ensure(day).completions.push(item); ensure(day).totalDurationMs += Number(record.durationMs || 0);
        });
        vocabBook.forEach(word => { const day = localDayKey(word.addedAt || word.timestamp); if (day) ensure(day).vocab.push(word); });
        savedArticles.forEach(article => {
          try {
            const progress = normalizeQuizProgress(JSON.parse(localStorage.getItem(getQuizProgressStorageKey(article.id)) || '{}'));
            const answered = Object.keys(progress.answers || {}).length;
            const activityAt = progress.submittedAt || progress.lastAnsweredAt;
            if (!answered || !activityAt) return;
            const day = localDayKey(activityAt); if (!day) return;
            const questions = normalizeArticleQuestions(article).filter(isSupportedQuizQuestion);
            const correct = questions.filter(question => isQuizAnswerCorrect(question, progress.answers?.[question.id])).length;
            ensure(day).quizzes.push({ articleId: article.id, title: article.title, submittedAt: progress.submittedAt, lastAnsweredAt: progress.lastAnsweredAt, answered, correct, total: questions.length, submitted: progress.submitted, progress });
          } catch (error) {}
        });
        return days;
      }, [completionRecords, vocabBook, savedArticles, articlesById]);
      const todayReport = dailyLearningRecords[localDayKey(new Date())] || { completions: [], quizzes: [], vocab: [], totalDurationMs: 0, pendingReviews: 0 };
      const recordCalendarDays = useMemo(() => {
        const year = recordMonthCursor.getFullYear(), month = recordMonthCursor.getMonth();
        const firstWeekday = new Date(year, month, 1).getDay();
        const count = new Date(year, month + 1, 0).getDate();
        return Array.from({ length: firstWeekday + count }, (_, index) => index < firstWeekday ? null : new Date(year, month, index - firstWeekday + 1));
      }, [recordMonthCursor]);

      useEffect(() => { localStorage.setItem(DAILY_REPORT_PREFERENCES_STORAGE_KEY, JSON.stringify(dailyReportPreferences)); }, [dailyReportPreferences]);

          .then(({ data, error }) => { if (!cancelled) setIsTeacher(Boolean(data) && !error); })
          .catch(() => { if (!cancelled) setIsTeacher(false); });
        return () => { cancelled = true; };
      }, [user]);

      // A submitted quiz is evidence that the learner finished that article.
      // Backfill the older quiz-only records once, preserving their original
      // submission date so historical daily reports remain accurate.
      useEffect(() => {
        if (!savedArticles.length) return;
        setCompletionRecords(previous => {
          const inferred = {};
          savedArticles.forEach(article => {
            if (!article?.id) return;
            try {
              const progress = normalizeQuizProgress(JSON.parse(localStorage.getItem(getQuizProgressStorageKey(article.id)) || '{}'));
              if (!progress.submitted || !progress.submittedAt) return;
              const existing = previous[article.id];
              // Earlier backfills stored 0 for an unknowable historic duration.
              // Preserve genuine timed records, but migrate that sentinel to null.
              if (existing) {
                if (existing.durationMs === 0 && existing.completedAt === progress.submittedAt) {
                  inferred[article.id] = { ...existing, durationMs: null };
                }
                return;
              }
              const questions = normalizeArticleQuestions(article).filter(isSupportedQuizQuestion);
              const correctCount = questions.filter(question => isQuizAnswerCorrect(question, progress.answers?.[question.id])).length;
              inferred[article.id] = {
                completedAt: progress.submittedAt,
                durationMs: null,
                accuracy: questions.length ? Math.round((correctCount / questions.length) * 100) : null,
                correctCount: questions.length ? correctCount : null,
                totalCount: questions.length || null,
                tags: []
              };
            } catch (_) {}
          });
          return Object.keys(inferred).length ? { ...previous, ...inferred } : previous;
        });
      }, [savedArticles, completionRecords]);

      useEffect(() => {
        let cancelled = false;
        const loadLocalData = async () => {
          try {
            const data = await readLocalDataFile();
            if (cancelled) return;
            if (data.savedArticles.length > 0) setSavedArticles(data.savedArticles);
            const persistedDeletedVocabKeys = normalizeDeletedVocabKeys([...deletedVocabKeys, ...data.deletedVocabKeys]);

            setLocalDataReady(true);
            setLocalPersistenceStatus({
              enabled: true,
              message: `本地数据文件已启用：${LOCAL_DATA_FILE_NAME}`

        if (seedIsCurrent && libraryIsComplete && quizLayoutsAreComplete) return;

        let cancelled = false;
        const seedBundledLibrary = async () => {
          bundledSeedInFlightRef.current = true;
          try {
            const bundled = await fetchBundledLibraryArticles();
            if (cancelled) return;
            trySetLocalStorage(BUNDLED_LIBRARY_SEED_KEY, BUNDLED_LIBRARY_SEED_VERSION);
            setSavedArticles(prev => {
              // Bundled articles are canonical curriculum records. Replace the
              // whole curriculum namespace so an interrupted old download
              // cannot leave stale records beside the latest 275-article set;
              // personal imports are retained.
              const retained = prev.filter(article => !isBundledCurriculumArticle(article));
              const merged = mergeSavedArticles(retained, bundled, { preferIncoming: true });
              // The following persistence effect writes the full bundle to OPFS.
              // Do not put it in localStorage: 104 analysed articles exceed its quota.
              setTimeout(() => {
                setToastMessage(`📚 已合并预置教材 ${bundled.length} 篇到书架`);
              }, 0);
              return merged;
            });
          } catch (error) {
            bundledSeedInFlightRef.current = false;
            console.warn('Bundled library seed skipped:', error);
          }
        };
        seedBundledLibrary();
        return () => {
          cancelled = true;
        };
      }, [localDataReady, savedArticles]);

      useEffect(() => {
        trySetLocalStorage('my_local_articles', JSON.stringify(savedArticles));
        trySetLocalStorage('my_local_vocab_book', JSON.stringify(vocabBook));
        trySetLocalStorage('reader_deleted_vocab_keys_v1', JSON.stringify(deletedVocabKeys));
        trySetLocalStorage('reader_favorite_article_ids', JSON.stringify(favoriteArticleIds));
        trySetLocalStorage(COMPLETION_RECORDS_STORAGE_KEY, JSON.stringify(completionRecords));

        if (!localDataLoadedRef.current || !localPersistenceStatus.enabled) return;
        if (localDataWriteTimerRef.current) clearTimeout(localDataWriteTimerRef.current);
        localDataWriteTimerRef.current = setTimeout(async () => {
          try {
            await writeLocalDataFile(savedArticles, vocabBook, completionRecords, deletedVocabKeys);
            setLocalPersistenceStatus({
              enabled: true,
              message: `本地数据文件已自动保存：${LOCAL_DATA_FILE_NAME}`
            });
          } catch (error) {
            setLocalPersistenceStatus({
              enabled: false,
              message: '本地数据文件写入失败，已使用浏览器本地存储兜底。'
            });
          }
