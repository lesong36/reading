2.1 对于 segments 的 label，必须尽量使用统一、稳定的中文标签，避免同类结构反复换叫法：
   - subject -> 主语
   - verb -> 谓语；如果是 be / seem / become 等系动词，也可以写 系动词
   - object -> 宾语
   - predicative -> 表语
   - conjunction -> 连接词
   - adverbial -> 状语
   - modifier -> 不要机械统称为修饰语。请根据它实际修饰的对象细分：
     能修饰名词、名词短语的，标成 定语 / 同位语 / 补足语 / 补充说明 等名词性修饰标签；
     如果它实际限定的是整个动作、谓语或整句的时间、地点、方式、原因、条件、让步、程度等，也应直接标成 状语
   - clause-* -> 从句核心（专门用于从属子句，如 when/while/because/if/that/which 引导的从句）
   - coord-* -> 并列主句（专门用于并列连词 for/and/nor/but/or/yet/so 引导的第二个独立主句）
     使用规则：如果句子是"主句1 [when从句], so 主句2"这类复合并列结构，主句1用 subject/verb/object，
     when从句用 clause-subject/clause-verb/clause-object，主句2用 coord-subject/coord-verb/coord-object；
     对应的 so/and/but 等连词仍用 conjunction 类型。
     如果只有一个主句加一个从句（无并列主句），则不使用 coord-*。
   不要输出像“同位语/定语”“修饰语”“附加成分”这类混合或过泛标签。
3. **【极度重要：解析的深度】**：在 analysis 字段中，**绝对不能简略！**必须像专业的考研/托福精读老师一样，提供详尽的解析。必须强制使用 Markdown 格式（如 ### 标题、**加粗**、* 列表）。累积包含以下剖析内容：
   ### 【主干结构】详细指出主句的主语、谓语、宾语/表语分别是什么词。
   ### 【主谓一致】分析主谓单复数对应。
   ### 【动词时态与原形】指出时态并给出原形。
   ### 【从句剖析】说明从句类型（若有）。
   ### 【代词指代】分析代词指代对象（若有）。
   ### 【非谓语动词】说明分词、不定式等（若有）。
4. **【极度重要：教学字段】**：为了给孩子做引导式学习，每个句子都必须额外输出 teachingFocus 对象。它不是重复 analysis，而是专门服务“幼儿/低龄孩子，尤其注意力容易漂移或 ADHD 孩子”的脚本线索：
   - mainQuestion: 先抓主干时，老师会先抛给孩子的一个问题
   - grammarQuestion: 看核心语法时，先抛给孩子的一个问题
   - modifierQuestion: 拆修饰语和从句时，先抛给孩子的一个问题
   - relationshipQuestion: 理顺句子关系时，先抛给孩子的一个问题
   - commonMistake: 这句最容易犯的一个错误，必须说得具体
   - thinkingPath: 一个长度 2-4 的字符串数组，表示建议孩子按什么顺序想
   - encouragement: 一句简短的鼓励式收束话术
5. teachingFocus 必须服务“老师直接给孩子讲”的体验，而不是让孩子自己闯关解题：
   - 讲解要细致、系统，但每段短一点，适合注意力容易飘的孩子跟上。
   - 多用孩子能懂的类比和画面感，例如火车、积木、侦探、地图、衣服、骨架等。
   - 四步都要教方法：如何抓主干、如何看核心语法、如何拆修饰语和从句、如何理顺句子关系。
   - 语气要温暖、有情绪价值：告诉孩子“这一步你能学会”“慢一点没关系”“我们一起拆”。
   - 避免考研、托福老师式长篇术语堆叠；不要写“详见”“综上”“本句考查”。
   - 给孩子看的话里不要直接说“动词修饰语、名词修饰语、状语、定语”等术语；要说成“动作旁边的小贴纸”“名词旁边的小标签”“补时间/地点的小卡片”“句子里的小房间”等。
6. ${buildGlossarySelectionRules()}

                              {response.choiceId && <div className="mt-6 border-t border-slate-100 pt-6"><p className="text-sm font-black text-slate-800">让原文来检验这个理解</p><p className="mt-2 text-sm leading-6 text-slate-500">左边第 {checkpoint.paragraph_numbers.join('、')} 段现在可以点选。选一句你认为能作为证据支持这张理解卡的话；点错了可再点一次取消。</p><div className="mt-3 rounded-2xl border border-indigo-100 bg-indigo-50/70 px-4 py-3"><p className="text-xs font-black uppercase tracking-[0.15em] text-indigo-600">我现在的理解</p><p className="mt-1 text-sm font-bold leading-6 text-indigo-950">{selectedOption?.text}</p></div><div className="mt-3 flex flex-wrap gap-2">{(response.evidenceIds || []).length ? response.evidenceIds.map(id => <span key={id} className="rounded-full bg-emerald-50 px-3 py-1.5 text-xs font-bold text-emerald-900">已连 {id.toUpperCase()}</span>) : <span className="text-sm text-slate-400">还没有连上原文</span>}</div><button type="button" disabled={!(response.evidenceIds || []).length} onClick={() => checkReadingMvpV2Evidence(checkpoint)} className="mt-4 rounded-xl bg-indigo-700 px-4 py-2.5 text-sm font-black text-white disabled:cursor-not-allowed disabled:bg-slate-300">检验这条证据和我的理解</button>{response.evidenceChecked && !response.evidenceCorrect && <p className="mt-3 rounded-xl bg-amber-50 px-3 py-2 text-sm leading-6 text-amber-900">这句话主要在说别的内容，还没有支持这张理解卡。你可以换一句原文，或换一个理解后再试。</p>}{response.evidenceChecked && response.evidenceCorrect && <div className="mt-4 rounded-2xl border border-emerald-200 bg-emerald-50 p-4"><p className="text-sm font-black text-emerald-950">原文和这张理解卡连上了。</p><p className="mt-1 text-sm leading-6 text-emerald-900">现在可以把这次有证据的理解留在地图里。</p><button type="button" onClick={() => completeReadingMvpV2Checkpoint(checkpoint)} className="mt-3 rounded-xl bg-emerald-700 px-4 py-2.5 text-sm font-black text-white">放进我的文章地图</button></div>}</div>}

                      {rightPanelTab === 'reading' && currentArticleReadingModel && !readingMvpV2Model && (() => {
                        if (!readingRoutineIsInformational) return (

                        const previousParagraph = paragraph?.index > 0 ? readingRoutineParagraphs[paragraph.index - 1] : null;

                        const previousPredictionOption = previousPredictionActivity?.options?.find(option => option.id === previousPrediction.selected);
                        const previousPredictionCorrect = previousPredictionActivity?.answer?.option_ids?.includes(previousPrediction.selected);
                        // Feedback colours describe only the child's own choice.

                        const progressLabel = readingRoutineStage === 'first_pass' ? `第一遍 · 已留下 ${readingRoutineNoteCount}/${readingRoutineParagraphs.length} 张段落便签`
                          : readingRoutineStage === 'functions' ? '第二遍 · 看每段在文章里做什么'

                              : readingRoutineStage === 'sections' ? '第二遍 · 把段落便签归成几部分'

                              <div className="flex items-start gap-3">
                                <div className="rounded-2xl bg-indigo-700 p-2.5 text-white"><MapIcon className="h-5 w-5" /></div>
                                <div className="min-w-0">
                                  <p className="text-xs font-black uppercase tracking-[0.18em] text-indigo-600">篇章阅读</p>
                                  <h3 className="mt-1 text-xl font-black text-slate-900">先读懂每一段，再拼出整篇</h3>
                                  <p className="mt-2 text-sm leading-6 text-slate-600">{progressLabel}</p>
                                </div>
                              </div>
                              <div className="mt-5 flex gap-2">
                                <div className={`h-2 flex-1 rounded-full ${readingRoutineStage === 'first_pass' ? 'bg-indigo-600' : 'bg-emerald-500'}`} />
                                <div className={`h-2 flex-1 rounded-full ${readingRoutineStage !== 'first_pass' ? 'bg-indigo-600' : 'bg-white ring-1 ring-indigo-100'}`} />
                              </div>
                              <div className="mt-2 flex justify-between text-xs font-bold text-slate-500"><span>第一遍：读懂每段</span><span>第二遍：拼出文章</span></div>
                            </section>

                            {readingRoutineStage === 'first_pass' && paragraph && (
                              <section className="rounded-3xl border border-slate-200 bg-white p-5 shadow-sm md:p-6">
                                <div className="flex items-center justify-between gap-3">
                                  <div><p className="text-xs font-black uppercase tracking-[0.18em] text-sky-600">第 {paragraph.index + 1} 段</p><h3 className="mt-1 text-xl font-black text-slate-900">给这一段留一张小便签</h3></div>
                                  <span className="rounded-full bg-slate-100 px-3 py-1.5 text-xs font-black text-slate-600">读原文，不用打字</span>
                                </div>
                                <div className="mt-5 rounded-2xl border border-sky-100 bg-sky-50 px-4 py-3 text-sm leading-6 text-sky-900">先读左边第 {paragraph.index + 1} 段。遇到不懂的词或句子，仍可点进“句子解析”。</div>
                                {previousPrediction.checked && <div className="mt-4 rounded-2xl border border-indigo-100 bg-indigo-50 px-4 py-3 text-sm leading-6 text-indigo-950"><p className="font-black">回看刚才的猜想</p><p className="mt-1">你猜的是：{previousPredictionOption?.text}</p>{note.complete ? <p className="mt-2">{previousPredictionCorrect ? '读完这一段，你的猜想得到了印证。' : '读完这一段，你可以修正这个猜想：文章实际往另一个方向展开了。'}</p> : <p className="mt-2 text-indigo-700">先完成这一段的小便签，再回来确认或修正。</p>}</div>}

                                <div className="mt-6"><p className="text-sm font-black text-slate-800">1. 这一段主要在说谁 / 什么？</p>
                                  <div className="mt-3 grid gap-2">{getParagraphTopicOptions(paragraph).map(option => <button key={option} type="button" onClick={() => updateRoutineNote(paragraph.id, { topic: option, topicChecked: false })} className={choiceClass(note.topic === option, note.topicChecked, note.topicCorrect)}>{option}</button>)}</div>

                                  {note.topicChecked && <p className={`mt-3 rounded-xl px-3 py-2 text-sm ${note.topicCorrect ? 'bg-emerald-50 text-emerald-900' : 'bg-amber-50 text-amber-900'}`}>{note.topicCorrect ? '抓得很准。现在想想：这段最重要的话是什么？' : '再看看整段，而不只盯着其中一个动作或细节。'}</p>}
                                </div>

                                {note.topicCorrect && <div className="mt-7 border-t border-slate-100 pt-6"><p className="text-sm font-black text-slate-800">2. 这段最想告诉我们什么？</p>

                                  {note.mainIdeaChecked && <p className={`mt-3 rounded-xl px-3 py-2 text-sm ${note.mainIdeaCorrect ? 'bg-emerald-50 text-emerald-900' : 'bg-amber-50 text-amber-900'}`}>{note.mainIdeaCorrect ? '对。这句话能把这一段的大部分内容装进去。' : '这句话可能只是一个细节。找找看哪一句能把整段更多内容装进去。'}</p>}

                                {note.mainIdeaCorrect && <div className="mt-7 border-t border-slate-100 pt-6"><p className="text-sm font-black text-slate-800">3. 去原文找一句支持它的话</p>

                                  <button type="button" disabled={!(note.sourceIds || []).length} onClick={() => checkRoutineEvidence(paragraph)} className="mt-4 rounded-xl bg-indigo-700 px-4 py-2.5 text-sm font-black text-white disabled:cursor-not-allowed disabled:bg-slate-300">{note.evidenceChecked && !note.evidenceCorrect ? '重新检查我的依据' : '检查我的依据'}</button>
                                  {note.evidenceChecked && <p className={`mt-3 rounded-xl px-3 py-2 text-sm ${note.evidenceCorrect ? 'bg-emerald-50 text-emerald-900' : 'bg-amber-50 text-amber-900'}`}>{note.evidenceCorrect ? '找到了。你的便签有原文作依据。' : '还可以继续点左边这段的句子：点错的可再点一次取消，再换一句试试。'}</p>}
                                </div>}

                                {note.complete && <div className="mt-7 rounded-2xl border border-emerald-200 bg-emerald-50 p-4"><p className="text-xs font-black uppercase tracking-[0.16em] text-emerald-700">我的第 {paragraph.index + 1} 段便签</p><p className="mt-2 font-black text-emerald-950">{note.topic}：{note.mainIdea}</p>
                                  {predictionActivity && !prediction.checked && <div className="mt-4 border-t border-emerald-200 pt-4"><p className="text-sm font-black text-emerald-950">读完这一段，你猜下一段会写什么？</p><p className="mt-1 text-sm text-emerald-800">这一步先不用急着判对错；读完下一段，再回来确认或修正。</p><div className="mt-3 grid gap-2">{predictionActivity.options.map(option => <button key={option.id} type="button" onClick={() => setReadingRoutineProgress(previous => ({ ...previous, predictions: { ...previous.predictions, [paragraph.id]: { selected: option.id, checked: false } } }))} className={choiceClass(prediction.selected === option.id, false, false)}>{option.text}</button>)}</div><button type="button" disabled={!prediction.selected} onClick={() => setReadingRoutineProgress(previous => ({ ...previous, predictions: { ...previous.predictions, [paragraph.id]: { ...prediction, checked: true } } }))} className="mt-3 rounded-xl bg-emerald-700 px-4 py-2.5 text-sm font-black text-white disabled:bg-slate-300">带着猜想往下读</button></div>}
                                  {(!predictionActivity || prediction.checked) && <button type="button" onClick={() => continueRoutineFirstPass(paragraph)} className="mt-4 rounded-xl bg-emerald-700 px-4 py-2.5 text-sm font-black text-white">{paragraph.index + 1 < readingRoutineParagraphs.length ? '读下一段' : '进入第二遍，把文章拼起来'}</button>}
                                </div>}
                              </section>
                            )}

                            {readingRoutineStage === 'functions' && paragraph && (() => { const response = readingRoutineProgress.functions?.[paragraph.id] || {}; const correct = getChildFunction(paragraph.function?.type); return <section className="rounded-3xl border border-slate-200 bg-white p-5 shadow-sm md:p-6"><p className="text-xs font-black uppercase tracking-[0.18em] text-indigo-600">第二遍 · 第 {paragraph.index + 1} 段</p><h3 className="mt-2 text-xl font-black text-slate-900">这一段在整篇文章里做什么？</h3><p className="mt-2 text-sm leading-6 text-slate-500">先看看你留下的便签，再选择它承担的工作。</p><div className="mt-4 rounded-2xl bg-slate-50 p-4 text-sm font-bold text-slate-700">{readingRoutineProgress.notes?.[paragraph.id]?.topic}：{readingRoutineProgress.notes?.[paragraph.id]?.mainIdea}</div><div className="mt-5 grid gap-2">{functionChoices.map(option => <button key={option} type="button" onClick={() => setReadingRoutineProgress(previous => ({ ...previous, functions: { ...previous.functions, [paragraph.id]: { selected: option, checked: false, correct: false } } }))} className={choiceClass(response.selected === option, response.checked, response.correct)}>{option}</button>)}</div><button type="button" disabled={!response.selected} onClick={() => checkRoutineFunction(paragraph)} className="mt-4 rounded-xl bg-indigo-700 px-4 py-2.5 text-sm font-black text-white disabled:bg-slate-300">检查</button>{response.checked && <p className={`mt-3 rounded-xl px-3 py-2 text-sm ${response.correct ? 'bg-emerald-50 text-emerald-900' : 'bg-amber-50 text-amber-900'}`}>{response.correct ? '对。现在这张便签有了它在文章中的位置。' : '再想想：作者为什么需要这一段？'}</p>}</section>; })()}

                                      const isDeclaredNounModifier = index => /(?:名词.*修饰|修饰名词|定语)/.test(segments[index]?.label || '');
                                      const isPreVerbalNounModifier = index => {
                                        const text = segments[index]?.text?.trim() || '';
                                        if (!/^(in|on|at|of|with|from|for|by)\b/i.test(text)) return false;
                                        const earlier = allAnchorNodes.filter(node => typeof node.index === 'number' && node.index < index);
                                        const precedingNoun = [...earlier].reverse().find(node => ['subject', 'object', 'predicative'].includes(node.role));
                                        const followingVerb = allAnchorNodes.find(node => typeof node.index === 'number' && node.index > index && (node.role === 'verb' || node.role === 'predicate'));
                                        const precedingVerb = [...earlier].reverse().find(node => node.role === 'verb' || node.role === 'predicate');
                                        return Boolean(precedingNoun && followingVerb && (!precedingVerb || precedingVerb.index < precedingNoun.index));
                                      };
                                      const nearestAnchor = index => {
                                        const isVerbDetail = segments[index]?.type === 'adverbial' || segments[index]?.label === '动词修饰语';
                                        const earlierNodes = allAnchorNodes.filter(node => typeof node.index === 'number' && node.index < index);
                                        const declaredTarget = declaredAttachmentTarget(index);
                                        if (declaredTarget) return declaredTarget;
                                        if (isDeclaredNounModifier(index)) return [...earlierNodes].reverse().find(node => ['subject', 'object', 'predicative'].includes(node.role)) || mainObject;
                                        if (isPreVerbalNounModifier(index)) return [...earlierNodes].reverse().find(node => ['subject', 'object', 'predicative'].includes(node.role)) || mainObject;
                                        if (isVerbDetail) return [...earlierNodes].reverse().find(node => node.role === 'verb' || node.role === 'predicate') || mainVerb;
                                        return allAnchorNodes.find(node => typeof node.index === 'number' && node.index > index && ['subject', 'object', 'predicative'].includes(node.role)) || [...earlierNodes].reverse().find(node => ['subject', 'object', 'predicative'].includes(node.role)) || mainObject;
                                      };
                                      const sources = [
                                        ...clauseGroups.map(frame => {
                                          const connector = connectorFor(frame);
                                          const anchor = clauseAnchor(frame);
                                          return { key: `clause-${frame.key}`, text: frame.indexes.map(index => segments[index]?.text?.trim()).filter(Boolean).join(' '), kind: relationFor(connector), expectedTarget: targetKey(anchor?.index) };
                                        }),
                                        ...modifierIndexes.map(index => {
                                          const anchor = nearestAnchor(index);
                                          const earlierModifier = [...modifierIndexes].reverse().find(previousIndex => previousIndex < index && /^(for|by|through|without)\s+.+ing\b/i.test(segments[previousIndex]?.text?.trim() || ''));
                                          const isNestedTimeDetail = /^(in|on|at|during|before|after)\s+(?:the\s+)?(?:\d{4}|\d{1,2}(?:st|nd|rd|th)?\b)/i.test(segments[index]?.text?.trim() || '');
                                          return {
                                            key: `modifier-${index}`,
                                            text: segments[index]?.text?.trim(),
                                            kind: !isDeclaredNounModifier(index) && !isPreVerbalNounModifier(index) && (segments[index]?.type === 'adverbial' || segments[index]?.label === '动词修饰语') ? '补充动作' : '修饰名词',
                                            expectedTarget: isNestedTimeDetail && earlierModifier !== undefined ? `source-target-modifier-${earlierModifier}` : targetKey(anchor?.index),
                                            targetHint: isNestedTimeDetail && earlierModifier !== undefined ? `挂到「${segments[earlierModifier]?.text?.trim()}」下方` : anchor?.text ? `挂到「${anchor.text}」下方` : ''
                                          };
                                        }),
                                      ].filter(source => source.text);
                                      const sourcesByKey = Object.fromEntries(sources.map(source => [source.key, source]));
                                      const drops = modifierPracticeDrops[selectedSentence.id] || {};
                                      const placedKeys = Object.values(drops).flat();
                                      const moveSource = (destination, sourceKey) => setModifierPracticeDrops(prev => {
                                        const existing = prev[selectedSentence.id] || {};
                                        const cleared = Object.fromEntries(Object.entries(existing).map(([key, keys]) => [key, (keys || []).filter(key => key !== sourceKey)]));
                                        return { ...prev, [selectedSentence.id]: { ...cleared, [destination]: [...(cleared[destination] || []), sourceKey] } };
                                      });
                                      const restoreSource = sourceKey => setModifierPracticeDrops(prev => {
                                        const existing = prev[selectedSentence.id] || {};
                                        return { ...prev, [selectedSentence.id]: Object.fromEntries(Object.entries(existing).map(([key, keys]) => [key, (keys || []).filter(key => key !== sourceKey)])) };
                                      });
                                      const isClausePlaced = frame => (drops[targetKey(clauseAnchor(frame)?.index)] || []).includes(`clause-${frame.key}`);
                                      const DropZone = ({ node, zoneKey = targetKey(node.index), emptyText = '把上方词块拖到这里' }) => {

                                          {placed.map(source => { const nestedSources = sources.filter(item => item.expectedTarget === `source-target-${source.key}`); return <div key={source.key} className="mb-2 rounded-lg border border-emerald-300 bg-emerald-50 px-3 py-2 font-sans text-left text-sm text-emerald-950"><div className="flex items-start justify-between gap-3"><p className="font-mono font-bold">{source.text}</p><button type="button" onClick={() => restoreSource(source.key)} className="shrink-0 rounded border border-current/30 px-2 py-1 text-xs font-bold hover:bg-white/60">撤回</button></div><p className="mt-1 text-xs">已挂到这里</p>{nestedSources.length > 0 && <DropZone node={{ index: source.key }} zoneKey={`source-target-${source.key}`} emptyText={`再把「${nestedSources.map(item => item.text).join('、')}」拖到这条短语下方`} />}</div>; })}
                                          {!placed.length && <p className="font-sans text-xs text-[#7f927a]">{emptyText}</p>}
                                        </div>;
                                      };
                                      const ClauseBranch = ({ frame }) => {
                                        const connector = connectorFor(frame);
                                        const nodes = clauseNodesByKey[frame.key] || [];
                                        return <div className="mt-4 rounded-xl border border-emerald-200 bg-emerald-50/70 p-3"><p className="font-sans text-xs font-black tracking-[0.12em] text-emerald-800">从句内部预览 · {relationFor(connector)} <span className="ml-1 rounded bg-[#e0ead4] px-1.5 py-0.5 font-mono normal-case tracking-normal">{connector || '从句'}</span></p><div className="mt-3 space-y-3 border-l-2 border-dashed border-emerald-300 pl-3">{nodes.map(clauseNode => <div key={clauseNode.index} className="border-t border-emerald-200 pt-3"><p className="font-mono text-base font-bold">{clauseNode.text}</p><p className="mt-1 font-sans text-xs text-emerald-800">{clauseNode.label}</p><DropZone node={clauseNode} /></div>)}</div></div>;
                                      };
                                      return <div className="animate-in fade-in duration-300 space-y-5">
                                        <div><h4 className="text-xl font-black text-slate-900">把词块挂回它修饰的位置</h4><p className="mt-1 text-sm text-slate-500">先拖关系词引导的从句；放对后才展开它的内部结构，再继续挂短语修饰语。虚线区域就是唯一有效的落点，错误位置不会再收下词块。</p></div>
                                        <div className="rounded-2xl border border-slate-200 bg-slate-50 p-4"><p className="mb-3 text-xs font-black tracking-[0.16em] text-slate-400">待挂接词块</p><div className="flex flex-wrap gap-2">{sources.filter(source => !placedKeys.includes(source.key)).map(source => <div key={source.key} draggable onDragStart={event => event.dataTransfer.setData('text/plain', source.key)} className="cursor-grab rounded-xl border border-[#aac09f] bg-white px-3 py-2 shadow-sm active:cursor-grabbing"><p className="font-mono text-base font-bold text-[#173d37]">{source.connector && <span className="mr-2 rounded bg-[#e0ead4] px-1.5 py-0.5 text-xs tracking-wider">{source.connector}</span>}{source.text}</p><p className="mt-1 text-xs font-bold text-[#6d7d55]">{source.kind}</p></div>)}{sources.length === 0 && <span className="text-sm text-slate-400">这句没有需要额外挂接的词块。</span>}</div></div>
                                        <section className="overflow-x-auto rounded-3xl border border-[#dbe5c9] bg-[#fbfdf4] p-5 shadow-[inset_0_0_40px_rgba(221,233,199,0.22)]">
                                          <p className="mb-4 text-xs font-black tracking-[0.16em] text-[#6d7d55]">句法挂接图</p>
                                          <div className="w-full min-w-0 font-mono text-[#173d37]">
                                            <div className="space-y-4">{mainFrames.length ? mainFrames.map((frame, frameIndex) => { const nodes = nodesByFrame[frame.key] || []; const connector = frame.connectorBefore !== null ? segments[frame.connectorBefore]?.text?.trim() : ''; const contrasts = contrastFramesByMainKey[frame.key] || []; return <section key={frame.key} className="rounded-2xl border border-[#e0ead4] bg-white/70 p-4"><p className="mb-3 font-sans text-xs font-black tracking-[0.14em] text-[#6d7d55]">{connector && <span className="mr-2 rounded bg-sky-100 px-2 py-1 text-sky-700">{connector}</span>}{mainFrames.length > 1 ? `主干 ${frameIndex + 1}` : '主干'}</p><div className="grid gap-3" style={{ gridTemplateColumns: `repeat(${Math.max(nodes.length, 1)}, minmax(150px, 1fr))` }}>{nodes.map(node => <div key={node.index} className="min-w-0"><p className="text-2xl font-bold leading-tight">{node.text}</p><p className="mt-1 font-sans text-sm font-bold text-[#58705d]">{node.label}</p><DropZone node={node} />{clauseGroups.filter(clause => clauseAnchor(clause)?.index === node.index && isClausePlaced(clause)).map(clause => <ClauseBranch key={clause.key} frame={clause} />)}</div>)}</div>{contrasts.map(contrast => <div key={contrast.key} className="mt-4 rounded-xl border border-sky-200 bg-sky-50/70 px-3 py-3 font-sans"><p className="text-xs font-black text-sky-800"><span className="mr-2 rounded bg-sky-100 px-1.5 py-0.5">{segments[contrast.connectorBefore]?.text.trim()}</span>同一主干内的对比修饰</p><p className="mt-2 font-mono text-sm font-bold text-slate-800">{contrast.contentIndexes.map(index => segments[index]?.text.trim()).filter(Boolean).join(' ')}</p><p className="mt-1 text-xs leading-5 text-sky-800">这一层沿用上方主干的主语和谓语；其中的修饰语仍挂到本主干的词下。</p></div>)}</section>; }) : <p className="text-2xl font-bold">先回到第 1 步确定主干</p>}</div>
                                          </div>
                                        </section>
                                        <p className="text-xs leading-5 text-slate-400">读法：主干从左到右不动；每个分支只挂在一个词下面。先挂 when / if / that 等关系词带领的从句，再挂短语修饰语。</p>
                                      </div>;

                                    {/* 已整合进结果展示：不再要求为关系线索额外拖拽。 */}
                                    {false && (() => {

                                      const clauses = buildPracticeFrames(segments, selectedSentence.syntaxHints || {}).map(frame => ({

                                      const drops = logicPracticeDrops[selectedSentence.id] || {};
                                      const dropped = Object.values(drops).flat();
                                      const put = (target, index) => setLogicPracticeDrops(prev => ({ ...prev, [selectedSentence.id]: { ...(prev[selectedSentence.id] || {}), [target]: [...((prev[selectedSentence.id] || {})[target] || []), index] }}));
                                      return <div className="animate-in fade-in duration-300 space-y-5">
                                        <div><h4 className="text-xl font-black text-slate-900">连起逻辑</h4><p className="mt-1 text-sm text-slate-500">这里只处理 FANBOYS 并列：把连接词拖到两套并列主干之间。</p></div>
                                        <div className="rounded-2xl border border-slate-200 bg-slate-50 p-4"><p className="mb-3 text-xs font-black tracking-[0.16em] text-slate-400">可用词块（前两步未使用）</p><div className="flex flex-wrap gap-2">{connectors.map(({ seg, index }) => <span key={index} draggable={!dropped.includes(index)} onDragStart={event => event.dataTransfer.setData('text/plain', String(index))} className={`rounded-xl border px-3 py-2 text-base font-semibold ${dropped.includes(index) ? 'border-slate-100 bg-slate-100 text-slate-300' : 'cursor-grab border-slate-300 bg-white text-slate-800'}`}>{seg.text.trim()}</span>)}{connectors.length === 0 && <span className="text-sm text-slate-400">这句没有需要单独连接的词块。</span>}</div></div>
                                        <div className="space-y-3">{clauses.map((clause, index) => <React.Fragment key={clause.key}><div className="rounded-2xl border border-slate-200 bg-white p-4"><p className="text-xs font-black text-slate-400">{clause.label}</p><p className="mt-1 text-lg font-bold text-slate-900">{clause.indexes.map(i => segments[i].text.trim()).join(' ')}</p></div>{index < clauses.length - 1 && <div onDragOver={event => event.preventDefault()} onDrop={event => { event.preventDefault(); put(`between-${index}`, Number(event.dataTransfer.getData('text/plain'))); }} className="rounded-xl border border-dashed border-sky-300 bg-sky-50 p-3 text-center"><span className="text-sm font-bold text-sky-700">{(drops[`between-${index}`] || []).map(i => segments[i]?.text.trim()).join(' ') || '把连接词拖到两套主干之间'}</span></div>}</React.Fragment>)}</div>
                                        {connectors.length === 0 && <p className="text-sm text-slate-500">这句没有 FANBOYS 并列结构；从句和其他修饰关系已在第 2 步完成。</p>}
                                      </div>;
                                    })()}

                                    {/* ── Step 3: 读懂结果 · 整句理解 ── */}
                                    {voiceLessonStepIndex === 2 && (
                                      (() => {
                                        const segments = selectedSentence.segments || [];
                                        const frames = buildPracticeFrames(segments, selectedSentence.syntaxHints || {});
                                        const modifiers = segments.filter(segment => ['modifier', 'adverbial'].includes(segment.type) && /[A-Za-z]/.test(segment.text || ''));
                                        const connectors = segments.filter(segment => segment.type === 'conjunction' && FANBOYS.test(segment.text.trim()));
                                        const clauseSignals = segments.map(segment => segment.text?.trim()).filter(text => /^(when|while|before|after|if|unless|because|since|although|though|that|which|who|whose|where|why)\b/i.test(text || ''));
                                        const terms = normalizeGlossary(selectedSentence.keyTerms || selectedSentence.glossary || []).filter(term => term?.term).slice(0, 6);
                                        const roleText = (frame, role) => {
                                          const explicitText = (frame.roleIndexes[role] || []).map(index => segments[index]?.text.trim()).filter(Boolean).join(' ');
                                          return explicitText || (role === 'subject' ? frameSubjectDisplay(frame) : '');
                                        };
                                        const mainFrame = frames[0];
                                        const mainSubject = roleText(mainFrame, 'subject') || 'it';
                                        const mainObject = roleText(mainFrame, 'object') || roleText(mainFrame, 'predicative');
                                        const althoughSignal = clauseSignals.find(text => /^(although|though)\b/i.test(text || ''));
                                        const reducedAlthough = althoughSignal ? althoughSignal.replace(/^(although|though)\s+/i, '').replace(/[,.]$/, '').trim() : '';
                                        const onModifier = modifiers.find(segment => /^on\b/i.test(segment.text?.trim() || ''))?.text?.trim();
                                        const relationReading = althoughSignal
                                          ? `“${althoughSignal.split(/\s+/)[0]}” 表示“尽管/虽然”。前半句是省略结构，可还原为 “Although ${mainSubject} is ${reducedAlthough}”。`
                                          : clauseSignals.length ? `关系信号是 “${clauseSignals.join(' / ')}”，它告诉你这部分不是主干，而是在补充主句。` : '';
                                        const attachmentReading = onModifier && mainObject
                                          ? `“${onModifier}” 修饰 “${mainObject}”，回答“这些细节是关于什么的”。`
                                          : '';
                                        return <div className="animate-in fade-in duration-300 space-y-5">
                                          <div className="rounded-3xl border border-emerald-200 bg-emerald-50/60 p-5">
                                            <p className="text-sm font-extrabold uppercase tracking-wider text-emerald-700">读懂结果 · 把这一句说清楚</p>
                                            <p className="mt-2 text-xl font-black leading-8 text-slate-900">{selectedSentence.text}</p>
                                            {selectedSentence.translation && <p className="mt-3 text-sm leading-7 text-emerald-900">{selectedSentence.translation}</p>}
                                          </div>
                                          <section className="rounded-2xl border border-violet-100 bg-violet-50/50 p-5"><p className="text-sm font-black text-violet-900">这句真正要读出的关系</p><div className="mt-3 space-y-3 text-sm leading-7 text-slate-700">{relationReading && <p><b className="text-violet-900">让步怎么读：</b>{relationReading}</p>}{attachmentReading && <p><b className="text-violet-900">修饰挂在哪：</b>{attachmentReading}</p>}{selectedSentence.grammarFocus && <p><b className="text-violet-900">本句关键：</b>{selectedSentence.grammarFocus}</p>}{!relationReading && !attachmentReading && !selectedSentence.grammarFocus && <p>先按主干读，再把第 2 步挂回的修饰信息顺序加回来。</p>}</div></section>
                                          <section className="rounded-2xl border border-slate-200 bg-white p-5"><p className="text-sm font-black text-slate-900">句子骨架</p><div className="mt-3 space-y-3">{frames.map((frame, index) => <div key={frame.key} className="rounded-xl bg-slate-50 p-3"><p className="text-xs font-black text-slate-400">{frame.connectorBefore !== null && <span className="mr-2 rounded bg-sky-100 px-2 py-1 text-sky-700">{segments[frame.connectorBefore]?.text.trim()}</span>}{frame.label}{frame.sharedSubject && ' · 沿用上一主语'}</p>{frame.kind === 'predicate-contrast' ? <p className="mt-2 font-bold text-slate-800">{frame.contentIndexes.map(i => segments[i]?.text.trim()).filter(Boolean).join(' ')}</p> : <div className="mt-2 flex flex-wrap gap-2 text-sm font-bold"><span className="rounded bg-rose-50 px-2 py-1 text-rose-800">{roleText(frame, 'subject') || '（主语待核对）'}</span><span className="rounded bg-blue-50 px-2 py-1 text-blue-800">{roleText(frame, 'verb')}</span><span className="rounded bg-emerald-50 px-2 py-1 text-emerald-800">{roleText(frame, 'object')}</span>{roleText(frame, 'complement') && <span className="rounded bg-violet-50 px-2 py-1 text-violet-800">{roleText(frame, 'complement')}</span>}</div>}</div>)}</div></section>
                                          <div className="grid gap-4 md:grid-cols-2"><section className="rounded-2xl border border-amber-100 bg-amber-50/40 p-5"><p className="text-sm font-black text-amber-900">修饰信息</p><div className="mt-3 flex flex-wrap gap-2">{modifiers.length ? modifiers.map((segment, index) => <span key={`${segment.text}-${index}`} className="rounded-lg border border-amber-200 bg-white px-2 py-1 text-sm font-semibold text-amber-900">{segment.text.trim()}</span>) : <span className="text-sm text-slate-500">没有额外修饰语。</span>}</div></section><section className="rounded-2xl border border-sky-100 bg-sky-50/40 p-5"><p className="text-sm font-black text-sky-900">关系线索</p><p className="mt-3 text-sm leading-6 text-slate-700">{[...clauseSignals, ...connectors.map(segment => segment.text.trim())].length ? [...clauseSignals, ...connectors.map(segment => segment.text.trim())].join(' → ') : '没有明显连接词；按主干和修饰层级理解即可。'}</p></section></div>
                                          <section className="rounded-2xl border border-indigo-100 bg-indigo-50/40 p-5"><p className="text-sm font-black text-indigo-900">语法提醒</p><p className="mt-2 text-sm leading-7 text-slate-700">{selectedSentence.grammarFocus || '按主干核对动词形式、主谓一致与语态。'}</p></section>
                                          {terms.length > 0 && <section className="rounded-2xl border border-emerald-100 bg-white p-5"><p className="text-sm font-black text-emerald-900">值得积累的搭配</p><div className="mt-3 grid gap-3 sm:grid-cols-2">{terms.map((term, index) => <div key={`${term.term}-${index}`} className="rounded-xl border border-emerald-100 bg-emerald-50/40 p-3"><p className="font-black text-slate-900">{term.term}</p><p className="mt-1 text-sm text-slate-600">{term.translation || term.note || '结合原句记住它的用法。'}</p><button type="button" onClick={() => handleAddWordToVocab(term.term, selectedSentence.text, { meaning: term.translation, note: term.note })} className="mt-3 rounded-lg bg-emerald-600 px-3 py-2 text-xs font-black text-white hover:bg-emerald-700">加入生词本</button></div>)}</div></section>}
                                        </div>;
                                      })()
                                    )}
                                  </React.Fragment>
                                );
                              })()}

                              <div className="mt-8 flex flex-wrap items-center justify-between gap-3 border-t border-slate-100 pt-5">
                                <button
                                  type="button"
                                  onClick={() => setVoiceLessonStepIndex(index => Math.max(0, index - 1))}
                                  disabled={voiceLessonStepIndex === 0}
                                  className="rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-bold text-slate-600 transition-colors hover:border-slate-400 disabled:cursor-not-allowed disabled:opacity-40"
                                >
                                  上一步
                                </button>
                                {voiceLessonStepIndex < voiceLessonPlan.length - 1 ? (
                                  <button
                                    type="button"
                                    onClick={() => setVoiceLessonStepIndex(index => Math.min(voiceLessonPlan.length - 1, index + 1))}
                                    className="rounded-xl bg-indigo-600 px-4 py-2.5 text-sm font-black text-white shadow-sm transition-colors hover:bg-indigo-700"
                                  >
                                    继续：{voiceLessonPlan[voiceLessonStepIndex + 1]?.title}
                                  </button>
                                ) : (
                                  <button
                                    type="button"
                                    onClick={() => setVoiceLessonStepIndex(0)}
                                    className="rounded-xl border border-emerald-200 bg-emerald-50 px-4 py-2.5 text-sm font-black text-emerald-800 transition-colors hover:bg-emerald-100"
                                  >
                                    再读一遍
                                  </button>
                                )}
                              </div>

                            </div>
                          </div>
                      )}

                      {/* 选项卡 3：AI 互动助教内容 (拟物沉浸式卡片) */}
                      {rightPanelTab === 'ai' && (
                        <div className="animate-in fade-in duration-500 max-w-3xl mx-auto">
                          
                          <div className="mb-8">
                            <button 
                              onClick={handleSimplifySentence}
                              disabled={isSimplifying}
                              className="w-full text-left bg-slate-50 hover:bg-slate-100 text-slate-800 font-bold text-lg py-4 px-6 rounded-2xl transition-all border border-slate-200 flex items-center justify-between disabled:opacity-70 disabled:cursor-not-allowed group"
                            >
                              <span className="flex items-center gap-3">
                                <Sparkles className="w-6 h-6 text-indigo-500 group-hover:scale-110 transition-transform" />

                          <label className="text-xs font-bold text-sky-900">时区<input value={dailyReportPreferences.timezone} onChange={(e) => setDailyReportPreferences(prev => ({ ...prev, timezone: e.target.value }))} className="mt-1 block w-full rounded-xl border border-sky-200 bg-white px-3 py-2 text-sm text-slate-800" /></label>
                        </div>
                        <p className="mt-2 text-xs text-sky-800">{dailyReportDelivery?.status === 'sent' ? `最近一次已发送：${completionTimeLabel(dailyReportDelivery.sent_at)}` : dailyReportDelivery?.status === 'failed' ? `最近一次发送失败：${dailyReportDelivery.error_message || '请稍后重试'}` : '开启后会在设定时间发送当天有学习活动的报告。'}</p>
                        <p className={`mt-2 rounded-lg px-3 py-2 text-xs font-bold ${isTeacher ? 'bg-rose-100 text-rose-800' : 'bg-slate-100 text-slate-600'}`}>{isTeacher ? '教师权限已开通：顶部可进入“教师审核”。' : '当前账号不是教师：若刚完成授权，请退出后重新登录此账号。'}</p>
                      </div>
                      {authError && <p className="text-sm text-red-600">{authError}</p>}
                      <button
                        onClick={handleLogout}
                        className="w-full inline-flex items-center justify-center gap-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-white px-4 py-2.5 font-semibold transition-colors"
                      >
                        <LogOut className="w-4 h-4" />
                        退出账号
                      </button>
                    </div>
                  ) : (
                    <form onSubmit={handleAuthSubmit} className="space-y-4">
                      {!isLoginMode && <div>
                        <label className="block text-sm font-medium text-slate-700 mb-2">用户名</label>
                        <input type="text" value={loginUsername} onChange={(e) => setLoginUsername(e.target.value)} className="w-full rounded-xl border border-slate-300 px-4 py-2.5 text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500/40" autoComplete="username" placeholder="3–32 位字母、数字或下划线" required />
                      </div>}
                      <div>
                        <label className="block text-sm font-medium text-slate-700 mb-2">邮箱</label>
                        <input
                          type="email"
                          value={loginEmail}
                          onChange={(e) => setLoginEmail(e.target.value)}
                          className="w-full rounded-xl border border-slate-300 px-4 py-2.5 text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500/40"
                          autoComplete="email"
                          required
                        />
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-slate-700 mb-2">密码</label>
                        <input
                          type="password"
                          value={loginPassword}
                          onChange={(e) => setLoginPassword(e.target.value)}
                          className="w-full rounded-xl border border-slate-300 px-4 py-2.5 text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500/40"
                          autoComplete={isLoginMode ? 'current-password' : 'new-password'}
                          required
                        />
                      </div>
                      {authError && <p className="text-sm text-red-600 whitespace-pre-line">{authError}</p>}
                      <button
                        type="submit"
                        disabled={isAuthenticating}
                        className="w-full inline-flex items-center justify-center gap-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 font-semibold transition-colors disabled:opacity-70"
                      >
                        {isAuthenticating ? <Loader2 className="w-4 h-4 animate-spin" /> : <KeyRound className="w-4 h-4" />}
                        {isLoginMode ? '登录并同步' : '注册并同步'}
                      </button>
                      <button
                        type="button"
                        onClick={() => {
                          setIsLoginMode(prev => !prev);
                          setAuthError("");
                        }}
                        className="w-full text-sm font-semibold text-emerald-700 hover:text-emerald-800"
                      >
                        {isLoginMode ? '没有账号？切换到注册' : '已有账号？切换到登录'}
                      </button>
                    </form>
                  )}
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
