  <style>
    /* 模拟 tailwindcss-animate 插件的动画效果，保证 UI 优雅过渡 */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideInBottom { from { transform: translateY(1.5rem); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes slideInTop { from { transform: translateY(-1.5rem); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes zoomIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .animate-in {
      animation-duration: 0.4s;
      animation-fill-mode: both;
      animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
    }
    .animate-in.fade-in { animation-name: fadeIn; }
    .animate-in.slide-in-from-bottom-4, .animate-in.slide-in-from-bottom-5 { animation-name: slideInBottom; }
    .animate-in.slide-in-from-top-2, .animate-in.slide-in-from-top-4 { animation-name: slideInTop; }
    .animate-in.zoom-in-95 { animation-name: zoomIn; }

    /* 优化滚动条样式 */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>

    // Default built-in data
    const defaultArticleData = [

        segments: [

      {

        analysis: "### 【主干结构】\n由 but 连接的并列句。前半句主干：**They had seen asteroids**；后半句主干：**this was something**。\n\n### 【主谓一致】\n前半句主语 They 是复数；后半句主语 this 是单数，对应系动词 was。\n\n### 【动词时态与原形】\n* 前半句 `had seen` 为过去完成时（原形 `see`），表示“看”的动作发生在过去某个时间点之前（即“过去的过去”）；\n* 后半句 `was` 为一般过去时（原形 `be`）。\n\n### 【代词指代】\n`They` 是人称代词主格，指代第一句中的 astronomers；`this` 是指示代词，代指刚出现的这个“奇怪物体”；`something` 是不定代词。"

      {

    // --- 优雅排版 Markdown 渲染器 ---
    const formatMarkdown = (text, baseClassName = "") => {
      if (!text) return null;
      
      const lines = text.split('\n');
      const result = [];
      let listItems = [];

      const flushList = () => {
        if (listItems.length > 0) {
          result.push(
            <ul className="list-disc pl-6 my-4 space-y-2 text-inherit marker:text-indigo-300" key={`ul-${result.length}`}>
              {listItems}
            </ul>
          );
          listItems = [];
        }
      };

      const parseInline = (str) => {
        const parts = str.split(/(\*\*.*?\*\*|\*.*?\*|`.*?`)/g);
        return parts.map((part, i) => {
          if (part.startsWith('**') && part.endsWith('**')) {
            return <strong key={i} className="font-bold text-slate-900">{part.slice(2, -2)}</strong>;
          }
          if (part.startsWith('*') && part.endsWith('*') && part.length > 2) {
            return <em key={i} className="italic text-slate-700">{part.slice(1, -1)}</em>;
          }
          if (part.startsWith('`') && part.endsWith('`')) {
            return <code key={i} className="bg-indigo-50 text-indigo-700 px-1.5 py-0.5 rounded-md text-[0.9em] font-mono border border-indigo-100/50">{part.slice(1, -1)}</code>;
          }
          return <React.Fragment key={i}>{part}</React.Fragment>;
        });
      };

      lines.forEach((line, index) => {
        const trimmed = line.trim();
        const listMatch = trimmed.match(/^[-*]\s+(.*)/);
        
        if (listMatch) {
          listItems.push(<li key={index}>{parseInline(listMatch[1])}</li>);
        } else {
          flushList();
          if (trimmed.startsWith('### ')) {
            // 使用优雅的左侧强调线替代下划线和卡片框
            result.push(
              <h3 key={index} className="text-xl font-bold text-slate-900 mt-8 mb-4 flex items-center gap-2.5">
                <div className="w-1.5 h-6 bg-indigo-500 rounded-full"></div>
                {parseInline(trimmed.slice(4))}
              </h3>
            );
          } else if (trimmed.startsWith('## ')) {
            result.push(<h2 key={index} className="text-2xl font-bold text-slate-900 mt-10 mb-4">{parseInline(trimmed.slice(3))}</h2>);
          } else if (trimmed.startsWith('# ')) {
            result.push(<h1 key={index} className="text-3xl font-bold text-slate-900 mt-12 mb-5">{parseInline(trimmed.slice(2))}</h1>);
          } else if (trimmed === '---') {
            result.push(<hr key={index} className="my-8 border-slate-100" />);
          } else if (trimmed === '') {
            result.push(<div key={index} className="h-2"></div>); 
          } else {
            result.push(<p key={index} className="mb-4 text-slate-700">{parseInline(line)}</p>); 
          }
        }
      });
      flushList();

      return <div className={baseClassName}>{result}</div>;
    };

    const DEFAULT_OLLAMA_BASE_URL = 'http://127.0.0.1:11434';
    const DEFAULT_OLLAMA_MODEL = 'qwen3.6:35b-a3b-mxfp8';
    const REMOTE_NV_OLLAMA_BASE_URL = 'http://100.121.25.47:11434';
    const REMOTE_NV_OLLAMA_MODEL = 'qwen3.6:35b-a3b-q8_0';
    const DEFAULT_OPENAI_COMPAT_BASE_URL = '';
    const DEFAULT_OPENAI_COMPAT_MODEL = '';
    const DEFAULT_OPENAI_COMPAT_API_KEY = '';
    const OLLAMA_PRESETS = {
      local: {
        key: 'local',
        label: '本地',
        description: '当前机器上的 Ollama',
        baseUrl: DEFAULT_OLLAMA_BASE_URL,
        model: DEFAULT_OLLAMA_MODEL
      },
      remoteNv: {
        key: 'remoteNv',
        label: '远程 NV',
        description: 'P920 / 100.121.25.47',
        baseUrl: REMOTE_NV_OLLAMA_BASE_URL,
        model: REMOTE_NV_OLLAMA_MODEL
      }
    };

    const stripCodeFence = (text = "") => text.replace(/^```(?:json)?/mi, '').replace(/```$/m, '').trim();
    const GUIDED_STEP_TITLES = ['先抓主干', '再看修饰语', '语法关键点', '整句说清楚'];
    const GUIDED_FALLBACK_PROMPTS = [
      '先把句子的骨架抓出来。',
      '在主干保留的基础上，再看补充信息。',
      '点开你需要关注的关键点，让句子里对应位置亮出来。',
      '最后把整句说清楚。'
    ];

    const extractFirstAnalysisSection = (analysis = "") => {
      if (!analysis) return "";
      const sections = analysis
        .split(/\n(?=###\s)/)
        .map(section => section.trim())
        .filter(Boolean);
      return sections[0] || analysis.trim();
    };

    const buildGuidedFocusOptions = (sentence = {}) => {
      const options = [];
      const text = sentence.text || '';
      const segments = Array.isArray(sentence.segments) ? sentence.segments : [];
      const pushOption = (key, label, matcher, explanation) => {
        const indexes = segments
          .map((seg, index) => matcher(seg, text) ? index : -1)
          .filter(index => index !== -1);
        if (indexes.length > 0) {
          options.push({ key, label, indexes, explanation });
        }
      };

      pushOption(
        'modal',
        '情态动词',
        (seg) => /\b(can|could|may|might|must|shall|should|will|would)\b/i.test(seg.text || ''),
        '先看情态动词，它会改变句子的语气：可能、推测、义务、建议。'
      );
      pushOption(
        'tense',
        '谓语形式',
        (seg) => ['verb', 'clause-verb'].includes(seg.type),
        '先看谓语形式，再判断它在说过去、现在、推测还是持续状态。'
      );
      pushOption(
        'connector',
        '连接关系',
        (seg) => seg.type === 'conjunction' || /\bthat|which|who|because|if|when|but\b/i.test(seg.text || ''),
        '先看连接词，它们决定句子是并列、转折、原因还是从句展开。'
      );
      pushOption(
        'pronoun',
        '指代对象',
        (seg) => /\b(it|they|this|that|these|those|he|she)\b/i.test(seg.text || ''),
        '先看代词指向谁，不然句子里的关系会断掉。'
      );

      return options.slice(0, 4);
    };

    const buildClauseUnits = (sentence = {}) => {
      const text = sentence.text || '';
      const segments = Array.isArray(sentence.segments) ? sentence.segments : [];
      const units = [];
      if (segments.length > 0) {
        units.push({
          key: 'whole',
          label: '整句',
          indexes: segments.map((_, index) => index)
        });
      }

      if (sentence.logicConnector && /\bbut\b/i.test(sentence.logicConnector) && text.includes(',')) {
        const conjunctionIndex = segments.findIndex(seg => /\bbut\b/i.test(seg.text || ''));
        if (conjunctionIndex > 0 && conjunctionIndex < segments.length - 1) {
          units.push(
            { key: 'part-1', label: '并列分句 1', indexes: segments.map((_, index) => index).filter(index => index < conjunctionIndex) },
            { key: 'part-2', label: '并列分句 2', indexes: segments.map((_, index) => index).filter(index => index > conjunctionIndex) }
          );
        }
      }

      const quotedIndexes = segments
        .map((seg, index) => /[“”"]/u.test(seg.text || '') || /^[“"]/.test(seg.text || '') || /[”"]$/.test(seg.text || '') ? index : -1)
        .filter(index => index !== -1);
      if (quotedIndexes.length > 0) {
        const start = Math.min(...quotedIndexes);
        const end = Math.max(...quotedIndexes);
        units.push({
          key: 'quoted-speech',
          label: '直接引语',
          indexes: segments.map((_, index) => index).filter(index => index >= start && index <= end)
        });
        const outsideIndexes = segments.map((_, index) => index).filter(index => index < start || index > end);
        if (outsideIndexes.length > 0) {
          units.push({
            key: 'reporting-clause',
            label: '引述部分',
            indexes: outsideIndexes
          });
        }
      }

      if (/(that|which|who|because|if|when|although|while)\b/i.test(text)) {
        const clauseIndex = segments.findIndex(seg => /\b(that|which|who|because|if|when|although|while)\b/i.test(seg.text || ''));
        if (clauseIndex !== -1) {
          const leftIndexes = segments.map((_, index) => index).filter(index => index < clauseIndex);
          const rightIndexes = segments.map((_, index) => index).filter(index => index >= clauseIndex);
          if (leftIndexes.length > 0) units.push({ key: 'main-clause', label: '主句部分', indexes: leftIndexes });
          if (rightIndexes.length > 0) units.push({ key: 'sub-clause', label: '从句部分', indexes: rightIndexes });
        }
      }

      return units.filter((unit, index, arr) => {
        const signature = JSON.stringify(unit.indexes || []);
        return (unit.indexes || []).length > 0 && arr.findIndex(item => item.label === unit.label && JSON.stringify(item.indexes || []) === signature) === index;
      }).slice(0, 4);
    };

    const buildGuidedHints = (sentence = {}) => {
      return [
        '先把句子的骨架抓出来：谁、做什么、结果落到哪里。',
        sentence.logicConnector || '把不是主干的部分补回来，先分清它是在修饰名词，还是在修饰动作和整句。',
        sentence.sentenceCoach?.keyHint || sentence.grammarFocus || '点一个关键点，再看句子里对应位置。',
        sentence.translation || '把主干和修饰语合起来，用自己的话说说这句话的意思。'

    };

    const buildGuidedSupport = (sentence = {}) => {
      const mainSegments = (sentence.segments || []).filter(seg => ['subject', 'verb', 'object', 'predicative'].includes(seg.type));
      const extraSegments = (sentence.segments || []).filter(seg => !['subject', 'verb', 'object', 'predicative'].includes(seg.type));
      return [
        {
          task: '给句子里的主语、谓语、宾语或表语贴标签。',
          hint: `可以先从这些位置找起：${mainSegments.map(seg => seg.label || seg.text.trim()).join('、') || '主语、谓语、宾语/表语'}`,
          answer: mainSegments.length > 0

    const GUIDED_MAIN_ROLE_OPTIONS = [

    const normalizeSegmentLabel = (seg = {}) => {
      const type = seg.type || '';
      const label = (seg.label || '').trim();
      const text = (seg.text || '').trim();

      if (GUIDED_SKIP_LABELS.has(label)) return '跳过';

      if (type === 'modifier') {
        if (GUIDED_ADVERBIAL_LABELS.has(label)) return '动词修饰语';
        if (
          GUIDED_NOUN_MODIFIER_LABELS.has(label) ||
          GUIDED_NOUN_APPOSITIVE_LABELS.has(label) ||
          GUIDED_NOUN_COMPLEMENT_LABELS.has(label) ||
          GUIDED_SUPPLEMENT_LABELS.has(label) ||
          /同位语|补足语|后置定语|定语从句|定语/.test(label)
        ) return '名词修饰语';
        if (
          /状语|时间|地点|方式|原因|条件|让步|目的|结果|程度|频率/.test(label) ||
          /^(in|on|at|from|to|for|with|by|during|after|before|when|while|because|if|although|though|as|since|through|into|onto|over|under|across|between|among)\b/i.test(text) ||
          /\bly\b/i.test(text)
        ) return '动词修饰语';
        return '名词修饰语';
      }

      if (type === 'conjunction') return '连接词';
      if (type === 'adverbial') return '动词修饰语';
      if (type === 'subject') return '主语';
      if (type === 'verb') return /系动词/.test(label) ? '系动词' : '谓语';
      if (type === 'object') return '宾语';
      if (type === 'predicative') return '表语';
      if (['clause-subject', 'clause-verb', 'clause-object', 'clause-predicative', 'clause'].includes(type)) return '从句核心';

      return label || type;
    };

    const normalizeSentenceSegments = (sentence = {}) => ({
      ...sentence,
      segments: Array.isArray(sentence.segments)
        ? sentence.segments.map(seg => ({
            ...seg,
            label: normalizeSegmentLabel(seg)
          }))
        : []
    });

    const normalizeArticleData = (articleData = []) =>
      Array.isArray(articleData) ? articleData.map(normalizeSentenceSegments) : [];

    const getGuidedStructureRoleKey = (seg = {}) => {
      const type = seg.type || '';
      const label = seg.label || '';
      const normalizedLabel = normalizeSegmentLabel(seg);

      if (type === 'conjunction') return 'conjunction';
      if (['clause-subject', 'clause-verb', 'clause-object', 'clause-predicative', 'clause', 'subject-verb'].includes(type)) return 'clause';
      if (normalizedLabel === '跳过') return 'skip';
      if (type === 'adverbial' || normalizedLabel === '动词修饰语' || /状语|时间|地点|方式|原因|条件|让步/.test(label)) return 'verb-modifier';

      if (type === 'modifier') {
        if (normalizedLabel === '动词修饰语') return 'verb-modifier';
        return 'noun-modifier';
      }

      return null;
    };

    const GUIDED_STRUCTURE_ROLE_OPTIONS = [
      { key: 'conjunction', label: '连接词', types: ['conjunction'] },
      {
        key: 'noun-modifier',
        label: '名词修饰语',
        match: (seg) => getGuidedStructureRoleKey(seg) === 'noun-modifier'
      },
      {
        key: 'verb-modifier',
        label: '动词修饰语',
        match: (seg) => getGuidedStructureRoleKey(seg) === 'verb-modifier'
      },
      {
        key: 'clause',
        label: '从句核心',
        match: (seg) => getGuidedStructureRoleKey(seg) === 'clause'
      }
    ];

    const buildExpectedRoleMap = (segments = [], options = []) => {
      const expected = {};
      options.forEach(option => {
        const indexes = segments
          .map((seg, index) => {
            const typeMatch = option.types ? (option.types || []).includes(seg.type) : true;
            const extraMatch = typeof option.match === 'function' ? option.match(seg) : true;
            return typeMatch && extraMatch ? index : -1;
          })
          .filter(index => index !== -1);
        if (indexes.length > 0) expected[option.key] = indexes;
      });
      return expected;
    };

    const getAvailableGuidedRoleOptions = (segments = [], options = []) => {
      const expectedMap = buildExpectedRoleMap(segments, options);
      return options.filter(option => option.key !== 'skip' && (expectedMap[option.key] || []).length > 0);
    };

    const filterSegmentsByText = (segments = [], targetText = "") => {
      const trimmedTarget = (targetText || '').trim();
      if (!trimmedTarget) return segments;
      return segments.filter(seg => trimmedTarget.includes((seg.text || '').trim()));
    };

    const splitTextForGuidedParts = (text = "") => {
      const cleaned = text.trim();
      if (!cleaned) return [];
      const chunks = cleaned
        .replace(/[“”"]/g, '')
        .split(/\s+/)
        .filter(Boolean);

      if (chunks.length <= 3) {
        return [{ text: cleaned }];
      }

      const parts = [];
      const subject = chunks[0];
      const beLikeIndex = chunks.findIndex(token => /^(am|is|are|was|were|be|been|being|can|could|may|might|must|shall|should|will|would|has|have|had|do|does|did)$/i.test(token));
      if (beLikeIndex > 0) {
        parts.push({ text: subject, forcedRole: 'subject' });
        const predicateTokens = [];
        let objectTokens = [];
        for (let i = beLikeIndex; i < chunks.length; i++) {
          const token = chunks[i];
          if (i === beLikeIndex || /^(be|being|been|am|is|are|was|were|can|could|may|might|must|shall|should|will|would|has|have|had|do|does|did)$/i.test(token)) {
            predicateTokens.push(token);
          } else {
            objectTokens = chunks.slice(i);
            break;
          }
        }
        if (predicateTokens.length > 0) parts.push({ text: predicateTokens.join(' '), forcedRole: 'verb' });
        if (objectTokens.length > 0) parts.push({ text: objectTokens.join(' '), forcedRole: 'object' });
        return parts;
      }

      return chunks.map(token => ({ text: token }));
    };

    const mapsMatch = (left = {}, right = {}) => {
      const keys = Array.from(new Set([...Object.keys(left), ...Object.keys(right)])).sort();
      return keys.every(key => {
        const leftList = [...(left[key] || [])].sort((a, b) => a - b);
        const rightList = [...(right[key] || [])].sort((a, b) => a - b);
        return leftList.length === rightList.length && leftList.every((value, index) => value === rightList[index]);
      });
    };

    const extractFirstJsonBlock = (text = "") => {
      const cleaned = stripCodeFence(text);
      const startCandidates = ['{', '['];
      let startIndex = -1;

      for (const candidate of startCandidates) {
        const idx = cleaned.indexOf(candidate);
        if (idx !== -1 && (startIndex === -1 || idx < startIndex)) {
          startIndex = idx;
        }
      }

      if (startIndex === -1) return cleaned;

      const stack = [];
      let inString = false;
      let escaped = false;

      for (let i = startIndex; i < cleaned.length; i++) {
        const char = cleaned[i];

        if (escaped) {
          escaped = false;
          continue;
        }

        if (char === '\\') {
          escaped = true;
          continue;
        }

        if (char === '"') {
          inString = !inString;
          continue;
        }

        if (inString) continue;

        if (char === '{' || char === '[') {
          stack.push(char);
        } else if (char === '}' || char === ']') {
          const last = stack[stack.length - 1];
          if ((last === '{' && char === '}') || (last === '[' && char === ']')) {
            stack.pop();
            if (stack.length === 0) {
              return cleaned.slice(startIndex, i + 1).trim();
            }
          }
        }
      }

      return cleaned.slice(startIndex).trim();
    };

    const parseJsonWithRecovery = (text = "") => {
      const candidate = extractFirstJsonBlock(text);
      return {
        candidate,
        parsed: JSON.parse(candidate)
      };
    };

    const parseAiJsonOrThrow = (text = "", providerLabel = "AI") => {
      try {
        return parseJsonWithRecovery(text).parsed;
      } catch (error) {
        throw new Error(`${providerLabel} 返回内容不是合法 JSON：${error.message}`);
      }
    };

    const sanitizeBaseUrl = (value) => (value || DEFAULT_OLLAMA_BASE_URL).trim().replace(/\/+$/, '');
    const sanitizeApiCredential = (value = "") => value
      .normalize('NFKC')
      .replace(/[\u0000-\u001F\u007F-\u009F\u200B-\u200D\uFEFF\u00A0\u3000\s]+/g, '')
      .trim();

    const LOCAL_DATA_FILE_NAME = 'reading-local-data.json';
    const createLocalDataSnapshot = (articles = [], vocab = []) => ({
      version: 1,
      savedAt: new Date().toISOString(),
      savedArticles: articles,
      vocabBook: vocab
    });

    const normalizeSavedArticles = (articles = []) =>
      Array.isArray(articles)
        ? articles.map(article => ({
            ...article,
            data: normalizeArticleData(article.data)
          }))
        : [];

    const normalizeVocabBook = (vocab = []) => Array.isArray(vocab) ? vocab : [];

    const mergeSavedArticles = (current = [], incoming = []) => {
      const byId = new Map();
      [...normalizeSavedArticles(current), ...normalizeSavedArticles(incoming)].forEach(article => {
        if (!article || !article.id) return;
        const existing = byId.get(article.id);
        if (!existing || (article.timestamp || 0) >= (existing.timestamp || 0)) {
          byId.set(article.id, article);
        }
      });
      return Array.from(byId.values()).sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
    };

    const mergeVocabBook = (current = [], incoming = []) => {
      const byKey = new Map();
      [...normalizeVocabBook(current), ...normalizeVocabBook(incoming)].forEach(word => {
        if (!word) return;
        const key = (word.word || word.id || '').toString().trim().toLowerCase();
        if (!key) return;
        const existing = byKey.get(key);
        if (!existing || (word.timestamp || 0) >= (existing.timestamp || 0)) {
          byKey.set(key, word);
        }
      });
      return Array.from(byKey.values()).sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
    };

    const readLocalDataFile = async () => {
      if (!navigator.storage?.getDirectory) {
        throw new Error('当前浏览器不支持本地文件持久化。');
      }
      const root = await navigator.storage.getDirectory();
      const handle = await root.getFileHandle(LOCAL_DATA_FILE_NAME, { create: true });
      const file = await handle.getFile();
      const text = await file.text();
      if (!text.trim()) return createLocalDataSnapshot();
      const parsed = JSON.parse(text);
      return {
        version: parsed.version || 1,
        savedAt: parsed.savedAt || "",
        savedArticles: Array.isArray(parsed.savedArticles) ? parsed.savedArticles : [],
        vocabBook: Array.isArray(parsed.vocabBook) ? parsed.vocabBook : []
      };
    };

    const writeLocalDataFile = async (articles, vocab) => {
      if (!navigator.storage?.getDirectory) {
        throw new Error('当前浏览器不支持本地文件持久化。');
      }
      const root = await navigator.storage.getDirectory();
      const handle = await root.getFileHandle(LOCAL_DATA_FILE_NAME, { create: true });
      const writable = await handle.createWritable();
      await writable.write(JSON.stringify(createLocalDataSnapshot(articles, vocab), null, 2));
      await writable.close();
    };

    const buildAiRequestError = (provider, err) => {
      const message = err?.message || '未知错误';
      if (provider === 'ollama') {
        const fileOriginBlocked = window.location.protocol === 'file:' && (
          message.includes('Failed to fetch') ||
          message.includes('NetworkError')
        );
        if (fileOriginBlocked) {
          return new Error('当前浏览器未能从 file:// 页面访问 Ollama。此机器通常可以直接双击 HTML 使用；如果你的浏览器拦截了本地请求，再考虑改用本地静态服务。');
        }
        return new Error(`Ollama 请求失败：${message}`);
      }
      return new Error(`云端模型请求失败：${message}`);
    };

    const formatElapsed = (ms = 0) => {
      const totalSeconds = Math.max(0, Math.floor(ms / 1000));
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      return minutes > 0 ? `${minutes}分${seconds}秒` : `${seconds}秒`;
    };

    const decodeOpenAICompatStream = async (response, onProgress) => {
      if (!response.body) {
        const data = await response.json();
        return data?.choices?.[0]?.message?.content || "";
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let content = "";
      let chunkCount = 0;

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        const parts = buffer.split("\n\n");
        buffer = parts.pop() || "";

        for (const part of parts) {
          const lines = part.split("\n").map(line => line.trim()).filter(Boolean);
          for (const line of lines) {
            if (!line.startsWith("data:")) continue;
            const payload = line.slice(5).trim();
            if (!payload || payload === "[DONE]") continue;
            try {
              const parsed = JSON.parse(payload);
              const delta = parsed?.choices?.[0]?.delta?.content || "";
              if (delta) {
                content += delta;
                chunkCount += 1;
                onProgress?.({
                  phase: 'streaming',
                  receivedChars: content.length,
                  receivedChunks: chunkCount,
                  lastProgressAt: Date.now()
                });
              }
            } catch (_) {
              // Ignore malformed interim SSE chunks and continue collecting.
            }
          }
        }
      }

      if (!content.trim()) {
        throw new Error('云端模型返回了空响应。');
      }
      return content;
    };

    const decodeOllamaStream = async (response, onProgress) => {
      if (!response.body) {
        const data = await response.json();
        return data?.message?.content?.trim?.() || "";
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let content = "";
      let chunkCount = 0;

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        const lines = buffer.split("\n");
        buffer = lines.pop() || "";

        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed) continue;
          try {
            const parsed = JSON.parse(trimmed);
            const piece = parsed?.message?.content || "";
            if (piece) {
              content += piece;
              chunkCount += 1;
              onProgress?.({
                phase: 'streaming',
                receivedChars: content.length,
                receivedChunks: chunkCount,
                lastProgressAt: Date.now()
              });
            }
          } catch (_) {
            // Ignore malformed interim NDJSON lines and continue collecting.
          }
        }
      }

      if (!content.trim()) {
        throw new Error('Ollama 返回了空响应。');
      }
      return content.trim();
    };

    const fetchOpenAICompatResponse = async ({
      userPrompt,
      systemPrompt,
      expectJson = false,
      apiKey = DEFAULT_OPENAI_COMPAT_API_KEY,
      model = DEFAULT_OPENAI_COMPAT_MODEL,
      baseUrl = DEFAULT_OPENAI_COMPAT_BASE_URL,
      onProgress
    }) => {
      const trimmedApiKey = sanitizeApiCredential(apiKey);
      if (!trimmedApiKey) {
        throw new Error('请先填写云端模型 API Key。');
      }
      if (/[^\x20-\x7E]/.test(trimmedApiKey)) {
        throw new Error('云端模型 API Key 包含异常字符。请重新粘贴纯文本 Key，避免中文空格、换行或隐藏字符。');
      }

      const url = `${baseUrl.replace(/\/+$/, '')}/chat/completions`;
      if (!baseUrl.trim()) {
        throw new Error('请先填写云端模型 API Base。');
      }
      if (!model.trim()) {
        throw new Error('请先填写云端模型名称。');
      }
      const payload = {
        model,
        stream: true,
        temperature: 0.6,
        response_format: expectJson ? { type: 'json_object' } : { type: 'text' },
        messages: [
          { role: 'system', content: systemPrompt },
          { role: 'user', content: userPrompt }
        ]
      };

      const delays = [1000, 2000, 4000, 8000, 16000];
      let lastError;

      for (let attempt = 0; attempt < 6; attempt++) {
        try {
          onProgress?.({ phase: 'requesting', lastProgressAt: Date.now() });
          const response = await fetch(url, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": `Bearer ${trimmedApiKey}`
            },
            body: JSON.stringify(payload)
          });
          if (!response.ok) {
            const text = await response.text();
            throw new Error(`HTTP ${response.status}${text ? `: ${text}` : ''}`);
          }
          onProgress?.({ phase: 'connected', lastProgressAt: Date.now() });
          const content = await decodeOpenAICompatStream(response, onProgress);
          return content;
        } catch (err) {
          lastError = err;
          if (attempt < 5) await new Promise(r => setTimeout(r, delays[attempt]));
        }
      }
      throw buildAiRequestError('cloud', lastError);
    };

    const fetchOllamaResponse = async ({
      userPrompt,
      systemPrompt,
      expectJson = false,
      baseUrl = DEFAULT_OLLAMA_BASE_URL,
      model = DEFAULT_OLLAMA_MODEL,
      onProgress
    }) => {
      const cleanBaseUrl = sanitizeBaseUrl(baseUrl);
      const cleanModel = model.trim();
      if (!cleanModel) {
        throw new Error('请先填写 Ollama 模型名。');
      }

      try {
        onProgress?.({ phase: 'requesting', lastProgressAt: Date.now() });
        const response = await fetch(`${cleanBaseUrl}/api/chat`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            model: cleanModel,
            stream: true,
            think: false,
            options: {
              temperature: expectJson ? 0.1 : 0.3
            },
            messages: [
              { role: "system", content: systemPrompt },
              { role: "user", content: userPrompt }
            ]
          })
        });

        if (!response.ok) {
          const text = await response.text();
          throw new Error(`HTTP ${response.status}${text ? `: ${text}` : ''}`);
        }

        onProgress?.({ phase: 'connected', lastProgressAt: Date.now() });
        const content = await decodeOllamaStream(response, onProgress);
        return content;
      } catch (err) {
        throw buildAiRequestError('ollama', err);
      }
    };

    const fetchOllamaJsonResponse = async ({
      userPrompt,
      systemPrompt,
      baseUrl = DEFAULT_OLLAMA_BASE_URL,
      model = DEFAULT_OLLAMA_MODEL
    }) => {
      const primaryPrompt = `${systemPrompt}\n\n【输出要求】\n1. 你必须输出合法 JSON。\n2. 不要输出 Markdown 代码块。\n3. 不要输出解释、前言或结语。\n4. JSON 之外不能有任何文字。`;

      const firstRaw = await fetchOllamaResponse({
        userPrompt,
        systemPrompt: primaryPrompt,
        expectJson: false,
        baseUrl,
        model
      });

      try {
        return parseJsonWithRecovery(firstRaw).candidate;
      } catch (firstError) {
        const repairPrompt = `你刚才的输出不是合法 JSON。请在不降低要求、不省略字段的前提下，把下面内容修复成唯一的合法 JSON 输出。\n\n【原始输出开始】\n${firstRaw}\n【原始输出结束】`;

        const repairedRaw = await fetchOllamaResponse({
          userPrompt: repairPrompt,
          systemPrompt: `${systemPrompt}\n\n【修复要求】\n1. 保留原任务要求和字段结构。\n2. 只输出合法 JSON。\n3. 不要输出代码块。\n4. 不要输出任何解释。`,
          expectJson: false,
          baseUrl,
          model
        });

        try {
          return parseJsonWithRecovery(repairedRaw).candidate;
        } catch (repairError) {
          throw new Error(`Ollama 返回内容未通过 JSON 校验。首次错误：${firstError.message}；修复后仍失败：${repairError.message}`);
        }
      }
    };

    const fetchOpenAICompatJsonResponse = async ({
      userPrompt,
      systemPrompt,
      apiKey = DEFAULT_OPENAI_COMPAT_API_KEY,
      model = DEFAULT_OPENAI_COMPAT_MODEL,
      baseUrl = DEFAULT_OPENAI_COMPAT_BASE_URL,
      onProgress
    }) => {
      const primaryPrompt = `${systemPrompt}\n\n【输出要求】\n1. 你必须输出合法 JSON。\n2. 不要输出 Markdown 代码块。\n3. 不要输出解释、前言或结语。\n4. JSON 之外不能有任何文字。`;

      const firstRaw = await fetchOpenAICompatResponse({
        userPrompt,
        systemPrompt: primaryPrompt,
        expectJson: false,
        apiKey,
        model,
        baseUrl,
        onProgress
      });

      try {
        onProgress?.({ phase: 'validating_json', lastProgressAt: Date.now() });
        return parseJsonWithRecovery(firstRaw).candidate;
      } catch (firstError) {
        onProgress?.({ phase: 'repairing_json', lastProgressAt: Date.now() });
        const repairPrompt = `你刚才的输出不是合法 JSON，很可能存在字符串未闭合、转义不完整、换行破坏 JSON、或末尾截断。请在不降低要求、不省略字段的前提下，把下面内容修复成唯一的合法 JSON 输出。\n\n【原始输出开始】\n${firstRaw}\n【原始输出结束】`;

        const repairedRaw = await fetchOpenAICompatResponse({
          userPrompt: repairPrompt,
          systemPrompt: `${systemPrompt}\n\n【修复要求】\n1. 保留原任务要求和字段结构。\n2. 只输出合法 JSON。\n3. 不要输出代码块。\n4. 不要输出任何解释。`,
          expectJson: false,
          apiKey,
          model,
          baseUrl,
          onProgress
        });

        try {
          onProgress?.({ phase: 'validating_json', lastProgressAt: Date.now() });
          return parseJsonWithRecovery(repairedRaw).candidate;
        } catch (repairError) {
          throw new Error(`云端模型返回内容未通过 JSON 校验。首次错误：${firstError.message}；修复后仍失败：${repairError.message}`);
        }
      }
    };

    const fetchAiResponse = async ({

      userPrompt,
      systemPrompt,
      expectJson = false,
      cloudApiKey = DEFAULT_OPENAI_COMPAT_API_KEY,

      return fetchOpenAICompatResponse({

        systemPrompt,
        expectJson,
        apiKey: cloudApiKey,

      });

      const aiLooksStalled = aiProvider === 'cloud' && activeAiTask === 'analyze' && aiTaskPhase && !['validating_json', 'repairing_json'].includes(aiTaskPhase) && aiIdleMs >= 45000;

      const getSegmentStyles = (type) => {

          case 'clause-subject': return "bg-red-50 text-red-800 border-b-2 border-red-300 border-dashed font-bold rounded-sm px-1";
          case 'clause-verb': return "bg-blue-50 text-blue-800 border-b-2 border-blue-300 border-dashed font-bold rounded-sm px-1";
          case 'clause-object': 
          case 'clause-predicative': return "bg-green-50 text-green-800 border-b-2 border-green-300 border-dashed font-bold rounded-sm px-1";
          case 'conjunction': return "bg-purple-100 text-purple-900 border-b-2 border-purple-400 border-dotted rounded-sm px-1";
          case 'modifier': return "bg-yellow-100 text-yellow-900 border-b-2 border-yellow-400 border-dotted rounded-sm px-1";
          case 'adverbial': return "bg-gray-200 text-gray-700 border-b-2 border-gray-400 border-dotted rounded-sm px-1";

          default: return "text-slate-800";

      };

      const guidedInteractiveStep = rightPanelTab === 'guided' && (guidedStepIndex === 0 || guidedStepIndex === 1);
      const effectiveUnderlineMain = rightPanelTab === 'guided' ? false : underlineMain;
      const effectiveHighlightMode = rightPanelTab === 'guided' ? false : highlightMode;
      const guidedHints = useMemo(() => buildGuidedHints(selectedSentence), [selectedSentence]);
      const guidedSupport = useMemo(() => buildGuidedSupport(selectedSentence), [selectedSentence]);
      const guidedFocusOptions = useMemo(() => buildGuidedFocusOptions(selectedSentence), [selectedSentence]);
      const guidedClauseUnits = useMemo(() => buildClauseUnits(selectedSentence), [selectedSentence]);
      const guidedCurrentClause = guidedClauseSelection[selectedSentence.id] || guidedClauseUnits[0]?.key || 'whole';
      const guidedVisibleText = useMemo(() => {
        const activeUnit = guidedClauseUnits.find(unit => unit.key === guidedCurrentClause);
        return activeUnit?.indexes || (selectedSentence.segments || []).map((_, index) => index);
      }, [guidedClauseUnits, guidedCurrentClause, selectedSentence]);
      const guidedVisibleSegments = useMemo(
        () => (selectedSentence.segments || []).filter((_, index) => guidedVisibleText.includes(index)),
        [selectedSentence, guidedVisibleText]
      );
      const guidedNeedsSubSegmentation = guidedInteractiveStep && guidedVisibleSegments.length === 1 && guidedCurrentClause !== 'whole';
      const guidedSubSegments = useMemo(() => {
        if (!guidedNeedsSubSegmentation) return [];
        return splitTextForGuidedParts(guidedVisibleSegments[0]?.text || '');
      }, [guidedNeedsSubSegmentation, guidedVisibleSegments]);
      const guidedRoleSegments = guidedNeedsSubSegmentation
        ? guidedSubSegments.map((seg, index) => ({
            text: `${seg.text}${index === guidedSubSegments.length - 1 ? '' : ' '}`,
            type: seg.forcedRole || 'modifier'

      const guidedRoleOptions = useMemo(() => {
        if (guidedStepIndex !== 1) return GUIDED_MAIN_ROLE_OPTIONS;
        return getAvailableGuidedRoleOptions(guidedRoleSegments, GUIDED_STRUCTURE_ROLE_OPTIONS);
      }, [guidedStepIndex, guidedRoleSegments]);
      const guidedDefaultRole = guidedRoleOptions[0]?.key || (guidedStepIndex === 1 ? 'noun-modifier' : 'subject');
      const sentenceGuidedSelections = guidedSelections[selectedSentence.id] || {};
      const sentenceGuidedChecks = guidedCheckState[selectedSentence.id] || {};
      const clauseGuidedSelections = sentenceGuidedSelections[guidedCurrentClause] || {};
      const clauseGuidedChecks = sentenceGuidedChecks[guidedCurrentClause] || {};
      const guidedMainSelections = clauseGuidedSelections[0] || {};
      const guidedExpectedSelections = useMemo(
        () => buildExpectedRoleMap(guidedRoleSegments, guidedRoleOptions),

      );
      const guidedCurrentSelections = clauseGuidedSelections[guidedStepIndex] || {};
      const guidedCurrentCheck = clauseGuidedChecks[guidedStepIndex] || null;
      const guidedCurrentFocus = guidedFocusSelection[selectedSentence.id] || null;
      const guidedCurrentWordInput = guidedWordInput[selectedSentence.id] || '';
      const guidedCurrentWordGuess = guidedWordGuess[selectedSentence.id] || '';
      const guidedCurrentTranslationDraft = guidedTranslationDraft[selectedSentence.id] || '';
      const guidedCurrentShowTranslation = guidedShowTranslation[selectedSentence.id] || false;
      const grammarFocusFallback = useMemo(() => {

      useEffect(() => {
        if (!guidedInteractiveStep) return;
        const validRoleKeys = guidedRoleOptions.map(option => option.key);
        if (validRoleKeys.length === 0) return;
        if (!validRoleKeys.includes(guidedActiveRole)) {
          setGuidedActiveRole(guidedDefaultRole);
        }
      }, [guidedInteractiveStep, guidedRoleOptions, guidedActiveRole, guidedDefaultRole]);

      const handleGuidedSegmentToggle = (sentence, segmentIndex) => {
        if (!guidedInteractiveStep) return;
        const sentenceId = sentence.id;
        const clauseKey = guidedCurrentClause;
        const stepKey = guidedStepIndex;
        const roleKey = guidedActiveRole;
        setGuidedSelections(prev => {
          const sentenceSelections = prev[sentenceId] || {};
          const clauseSelections = sentenceSelections[clauseKey] || {};
          const stepSelections = clauseSelections[stepKey] || {};
          const roleSelections = stepSelections[roleKey] || [];
          const nextRoleSelections = roleSelections.includes(segmentIndex)
            ? roleSelections.filter(index => index !== segmentIndex)
            : [...roleSelections, segmentIndex].sort((a, b) => a - b);
          return {
            ...prev,
            [sentenceId]: {
              ...sentenceSelections,
              [clauseKey]: {
                ...clauseSelections,
                [stepKey]: {
                  ...stepSelections,
                  [roleKey]: nextRoleSelections
                }
              }
            }
          };
        });
        setGuidedCheckState(prev => ({
          ...prev,
          [sentenceId]: {
            ...(prev[sentenceId] || {}),
            [clauseKey]: {
              ...((prev[sentenceId] || {})[clauseKey] || {}),
              [stepKey]: null
            }
          }
        }));
      };

      const handleGuidedDrop = (sentence, segmentIndex, roleKey) => {
        if (!guidedInteractiveStep || !roleKey) return;
        setGuidedActiveRole(roleKey);
        const sentenceId = sentence.id;
        const clauseKey = guidedCurrentClause;
        const stepKey = guidedStepIndex;
        setGuidedSelections(prev => {
          const sentenceSelections = prev[sentenceId] || {};
          const clauseSelections = sentenceSelections[clauseKey] || {};
          const stepSelections = clauseSelections[stepKey] || {};
          const nextStepSelections = Object.fromEntries(
            Object.entries(stepSelections).map(([key, indexes]) => [key, (indexes || []).filter(index => index !== segmentIndex)])
          );
          const roleSelections = nextStepSelections[roleKey] || [];
          nextStepSelections[roleKey] = [...roleSelections, segmentIndex].sort((a, b) => a - b);
          return {
            ...prev,
            [sentenceId]: {
              ...sentenceSelections,
              [clauseKey]: {
                ...clauseSelections,
                [stepKey]: nextStepSelections
              }
            }
          };
        });
        setGuidedCheckState(prev => ({
          ...prev,
          [sentenceId]: {
            ...(prev[sentenceId] || {}),
            [clauseKey]: {
              ...((prev[sentenceId] || {})[clauseKey] || {}),
              [stepKey]: null
            }
          }
        }));
      };

      const handleGuidedCheck = () => {
        const isCorrect = mapsMatch(guidedCurrentSelections, guidedExpectedSelections);
        setGuidedCheckState(prev => ({
          ...prev,
          [selectedSentence.id]: {
            ...(prev[selectedSentence.id] || {}),
            [guidedCurrentClause]: {
              ...((prev[selectedSentence.id] || {})[guidedCurrentClause] || {}),
              [guidedStepIndex]: isCorrect ? 'correct' : 'incorrect'
            }
          }
        }));
      };

      const revealGuidedAnswer = () => {
        setGuidedSelections(prev => ({
          ...prev,
          [selectedSentence.id]: {
            ...(prev[selectedSentence.id] || {}),
            [guidedCurrentClause]: {
              ...((prev[selectedSentence.id] || {})[guidedCurrentClause] || {}),
              [guidedStepIndex]: guidedExpectedSelections
            }
          }
        }));
        setGuidedCheckState(prev => ({
          ...prev,
          [selectedSentence.id]: {
            ...(prev[selectedSentence.id] || {}),
            [guidedCurrentClause]: {
              ...((prev[selectedSentence.id] || {})[guidedCurrentClause] || {}),
              [guidedStepIndex]: 'revealed'
            }
          }
        }));
      };

      const resetGuidedCurrentStep = () => {
        setGuidedSelections(prev => ({
          ...prev,
          [selectedSentence.id]: {
            ...(prev[selectedSentence.id] || {}),
            [guidedCurrentClause]: {
              ...((prev[selectedSentence.id] || {})[guidedCurrentClause] || {}),
              [guidedStepIndex]: {}
            }
          }
        }));
        setGuidedCheckState(prev => ({
          ...prev,
          [selectedSentence.id]: {
            ...(prev[selectedSentence.id] || {}),
            [guidedCurrentClause]: {
              ...((prev[selectedSentence.id] || {})[guidedCurrentClause] || {}),
              [guidedStepIndex]: null
            }
          }
        }));

      const getGuidedSegmentClassName = (sentence, segmentIndex) => {
        if (sentence.id !== selectedSentence.id) return 'text-slate-800';
        const basePalette = {
          subject: 'bg-red-100 text-red-900 border border-red-200',
          verb: 'bg-blue-100 text-blue-900 border border-blue-200',
          object: 'bg-green-100 text-green-900 border border-green-200',
          predicative: 'bg-emerald-100 text-emerald-900 border border-emerald-200',
          conjunction: 'bg-purple-100 text-purple-900 border border-purple-200',

        const mainRole = GUIDED_MAIN_ROLE_OPTIONS.find(option => (guidedMainSelections[option.key] || []).includes(segmentIndex));
        const currentRole = guidedRoleOptions.find(option => (guidedCurrentSelections[option.key] || []).includes(segmentIndex));
        const focusIndexes = guidedFocusOptions.find(option => option.key === guidedCurrentFocus)?.indexes || [];

        if (guidedStepIndex === 2 && focusIndexes.includes(segmentIndex)) {
          return 'bg-indigo-100 text-indigo-900 border border-indigo-300 ring-2 ring-indigo-300';
        }
        if (currentRole) {
          return basePalette[currentRole.key] || 'bg-indigo-100 text-indigo-900 border border-indigo-200';
        }
        if (mainRole) {
          return basePalette[mainRole.key] || 'bg-indigo-100 text-indigo-900 border border-indigo-200';
        }
        if (!guidedInteractiveStep) return 'text-slate-800 border border-transparent';
        const palette = {
          subject: 'bg-red-100 text-red-900 border border-red-200',
          verb: 'bg-blue-100 text-blue-900 border border-blue-200',
          object: 'bg-green-100 text-green-900 border border-green-200',
          predicative: 'bg-emerald-100 text-emerald-900 border border-emerald-200',

        };
        return guidedInteractiveStep ? 'text-slate-800 hover:bg-indigo-50 border border-transparent' : 'text-slate-800 border border-transparent';
      };

      const handleGuidedWordDoubleClick = (e, sentenceText) => {
        const selection = window.getSelection();
        const selectedText = selection?.toString().trim();
        if (!selectedText || /\s/.test(selectedText)) return;
        const range = selection.getRangeAt(0);
        const rect = range.getBoundingClientRect();
        setVocabPopup({
          word: selectedText.replace(/[.,!?;:"“”()]/g, ''),

          y: rect.top + window.scrollY,

      const renderGuidedSentenceWorkbench = () => (
        <div className="rounded-3xl border border-slate-200 bg-white p-5 shadow-sm">
          <div className="flex flex-col gap-3 md:flex-row md:items-center md:justify-between mb-4">
            <div>
              <p className="text-sm font-semibold text-slate-700">操作句子</p>
              <p className="text-sm text-slate-500">
                {guidedInteractiveStep

              <div className="text-sm font-medium text-indigo-700 bg-indigo-50 border border-indigo-100 rounded-full px-3 py-1.5">

                  className={`px-3 py-1.5 rounded-full border text-sm font-semibold transition-colors ${

                      : 'bg-white text-slate-700 border-slate-200 hover:border-indigo-300'

          <div

            title={!guidedInteractiveStep ? '双击单词可查词并加入生词本' : ''}
          >

                      className={`inline rounded-md px-1 py-0.5 mx-[1px] transition-all ${getGuidedSegmentClassName(selectedSentence, index)}`}
                      title={seg.forcedRole || ''}
                    >

                : (selectedSentence.segments || []).map((seg, index) => {

          </div>

      // --- Auth Handlers ---
      const handleAuthSubmit = async (e) => {
        e.preventDefault();
        if (!auth) {
          setAuthError("Auth 服务未初始化");
          return;
        }
        setIsAuthenticating(true);
        setAuthError("");
        try {
          if (isLoginMode) {
            await signInWithEmailAndPassword(auth, loginEmail, loginPassword);
          } else {
            await createUserWithEmailAndPassword(auth, loginEmail, loginPassword);
          }
          setShowLoginModal(false);
        } catch (err) {
          if (err.code === 'auth/invalid-credential') setAuthError("邮箱或密码错误，请检查。");
          else if (err.code === 'auth/email-already-in-use') setAuthError("该邮箱已被注册，请直接登录。");
          else setAuthError("认证失败：" + err.message);
        } finally {
          setIsAuthenticating(false);
        }
      };

          return;
        }

        setIsAuthenticating(true);
        setAuthError("");
        try {
          const provider = new GoogleAuthProvider();
          await signInWithPopup(auth, provider);
          setShowLoginModal(false);
        } catch (err) {
          setAuthError("Google 登录失败：" + err.message);
        } finally {
          setIsAuthenticating(false);
        }

        try {
          await signOut(auth);

        setAddingWordId(word);
        setActiveAiTask('vocab');
        setAiTaskStartedAt(Date.now());
        try {
          const sysPrompt = `你是一个专业的英语词汇与词源拓展助手。用户正在阅读英文文章，并希望将生词加入专属卡片本。
请提供以下细节，严格输出JSON格式：
{
  "meaning": "简明扼要的中文释义（请根据原文语境给出最合适的翻译）",
  "pronunciation": "英式或美式音标，例如 /əˈstrɒnəmə(r)/",
  "etymology": "词源简述，解释词根词缀。例如：由 astro-(星星) + -nomer(命名者) 组成，源自希腊语。",
  "exampleSentence": "造一个符合A2/B1难度的简短英文例句，并在括号内附带中文翻译。"
}`;
          const userPrompt = `【目标单词】：${word}\n【原文语境】：${contextSentenceText}`;

            expectJson: true

          const newWordEntry = {
            id: generateId(),

            etymology: data.etymology || "暂无词源信息",
            exampleSentence: data.exampleSentence || "",

            timestamp: Date.now()

          setVocabBook(prev => [newWordEntry, ...prev]);
          setToastMessage(`✅ 成功添加生词: ${word}`);

        const downloadAnchorNode = document.createElement('a');

        downloadAnchorNode.setAttribute("download", `vocab_backup_${new Date().toISOString().split('T')[0]}.json`);

        const file = e.target.files[0];
        if (!file) return;
        const fileReader = new FileReader();
        fileReader.readAsText(file, "UTF-8");
        fileReader.onload = event => {
          try {
            const importedData = JSON.parse(event.target.result);
            if (Array.isArray(importedData)) {
              setVocabBook(prev => {
                const newDict = [...prev];
                importedData.forEach(newWord => {
                  if(!newDict.some(w => w.word === newWord.word)) {
                    newDict.push(newWord);
                  }
                });
                newDict.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                return newDict;
              });
              setToastMessage(`✅ 成功导入了 ${importedData.length} 个单词记录！`);
            } else {
              setToastMessage("❌ 文件格式不正确，应该是一个包含单词对象的数组。");
            }
          } catch (err) {
            setToastMessage("❌ 导入失败，JSON 格式可能已损坏！");
          }
          e.target.value = null;
        };
      };

      // --- Article Library Logic ---
      const handleSaveCurrentArticle = () => {
        setArticleTitleInput(`分析文章 ${new Date().toLocaleDateString()}`);
        setSaveModalOpen(true);
      };

      const handleRemoveArticle = (id) => {

      const handleLoadArticle = (article) => {
        const normalizedData = normalizeArticleData(article.data);
        setCurrentArticleData(normalizedData);
        setSelectedSentence(normalizedData[0]);

      const exportArticlesData = () => {

        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(savedArticles, null, 2));
        const downloadAnchorNode = document.createElement('a');
        downloadAnchorNode.setAttribute("href", dataStr);
        downloadAnchorNode.setAttribute("download", `articles_backup_${new Date().toISOString().split('T')[0]}.json`);
        document.body.appendChild(downloadAnchorNode); 
        downloadAnchorNode.click();
        downloadAnchorNode.remove();
        setToastMessage("💾 书架备份已成功导出");

      const importArticlesData = (e) => {

        fileReader.onload = event => {
          try {
            const importedData = JSON.parse(event.target.result);
            if (Array.isArray(importedData)) {

      const handleSentenceDoubleClick = (e, sentenceText) => {

      const handleCheckOllamaConnection = async () => {
        if (isFileProtocol) {

            ok: true,
            message: '当前是双击打开模式。部分浏览器会拦截 file:// 页面主动探测本地服务，所以这里不做强检测；请直接点击解析按钮验证 Ollama 是否可用。'
          });
          return;
        }

        setIsCheckingOllama(true);
        setOllamaStatus({ ok: false, message: '正在检测 Ollama 服务...' });

        try {
          const cleanBaseUrl = sanitizeBaseUrl(ollamaBaseUrl);
          const response = await fetch(`${cleanBaseUrl}/api/tags`);
          if (!response.ok) {
            const text = await response.text();
            throw new Error(`HTTP ${response.status}${text ? `: ${text}` : ''}`);
          }

          const data = await response.json();
          const models = data?.models || [];
          const matched = models.find(item => item.name === ollamaModel.trim());
          const modelList = models.map(item => item.name).filter(Boolean);

          if (matched) {
            setOllamaStatus({
              ok: true,
              message: `已连接到 ${cleanBaseUrl}，当前模型 ${ollamaModel.trim()} 可用。`
            });
          } else if (modelList.length > 0) {
            setOllamaStatus({
              ok: false,
              message: `服务已连接，但未找到模型 ${ollamaModel.trim()}。当前可用模型：${modelList.join('、')}`
            });
          } else {
            setOllamaStatus({
              ok: false,
              message: '服务已连接，但没有发现可用模型。请先在本机拉取模型。'
            });
          }
        } catch (error) {
          const hint = isFileProtocol
            ? ' 当前浏览器拦截了 file:// 页面发起的本地探测，这不一定代表 Ollama 不可用。'
            : '';
          setOllamaStatus({
            ok: false,
            message: `检测失败：${error.message}${hint}`

          setIsCheckingOllama(false);

          setAiTaskStartedAt(null);

      const sysPrompt = `你是一款专业的英文长难句解析工具。请将用户提供的英文文本**逐句、逐字**进行深度解析，并严格按照 JSON 格式返回。
【绝对警告】：**绝不允许缩写、总结、省略或修改任何原句内容**。无论是带有序号的列表、短句还是长句，你必须按顺序解析用户输入的**每一个句子**，确保文章完整无缺！如果用户输入包含序号（如 1. 2.），请将其作为普通文本处理，确保正常解析。

要求：
1. 必须切分出正确的段落号(para)和句子ID(id)。
2. 将整句拆分为片段(segments)，片段拼接后必须与原句 text 完全一致（包括空格和标点）。
2.1 对于 segments 的 label，必须尽量使用统一、稳定的中文标签，避免同类结构反复换叫法：
   - subject -> 主语
   - verb -> 谓语；如果是 be / seem / become 等系动词，也可以写 系动词
   - object -> 宾语
   - predicative -> 表语
   - conjunction -> 连接词
   - adverbial -> 状语
   - modifier -> 不要机械统称为修饰语。请根据它实际修饰的对象细分：
     能修饰名词、名词短语的，标成 定语 / 同位语 / 补足语 / 补充说明 等名词性修饰标签；
     如果它实际限定的是整个动作、谓语或整句的时间、地点、方式、原因、条件、让步、程度等，也应直接标成 状语
   - clause-* -> 从句核心
   不要输出像“同位语/定语”“修饰语”“附加成分”这类混合或过泛标签。
3. **【极度重要：解析的深度】**：在 analysis 字段中，**绝对不能简略！**必须像专业的考研/托福精读老师一样，提供详尽的解析。必须强制使用 Markdown 格式（如 ### 标题、**加粗**、* 列表）。累积包含以下剖析内容：
   ### 【主干结构】详细指出主句的主语、谓语、宾语/表语分别是什么词。
   ### 【主谓一致】分析主谓单复数对应。
   ### 【动词时态与原形】指出时态并给出原形。
   ### 【从句剖析】说明从句类型（若有）。
   ### 【代词指代】分析代词指代对象（若有）。
   ### 【非谓语动词】说明分词、不定式等（若有）。

输出必须符合以下 JSON 格式：
{
  "articleData": [
    {
      "id": "s1",
      "para": 1,
      "text": "完整英文原句",
      "translation": "精准中文翻译",
      "grammarFocus": "核心语法点",
      "pronounRef": "代词指代简要解释",
      "logicConnector": "逻辑连词解释",
      "sentenceCoach": {
        "summary": "可选：一句像老师带读的简短提示",
        "keyHint": "可选：最值得孩子先注意的一个提醒"
      },
      "analysis": "中文深度结构剖析(使用Markdown排版)。",
      "segments": [
        {
          "text": "切分后的片段(必须包含周围标点及空格)",
          "type": "必须是: subject, verb, object, predicative, clause-subject, clause-verb, clause-object, clause-predicative, conjunction, modifier, adverbial",
          "label": "中文语法标签（优先使用：主语 / 谓语 / 系动词 / 宾语 / 表语 / 连接词 / 定语 / 同位语 / 补足语 / 补充说明 / 状语 / 从句核心）"
        }
      ]
    }
  ]
}`;
        try {
          let response = await fetchAiResponse({
            ...aiConfig,
            userPrompt: inputText,
            systemPrompt: sysPrompt,
            expectJson: true,
            onProgress: reportAiProgress
          });
          const parsedData = parseAiJsonOrThrow(response, 'Ollama');
          
          if (parsedData.articleData && parsedData.articleData.length > 0) {
            const normalizedData = normalizeArticleData(parsedData.articleData);
            setCurrentArticleData(normalizedData);
            setSelectedSentence(normalizedData[0]);
            setViewMode('reading');
            setInputText("");
            setToastMessage("✅ 全新文章已成功解析！");

          setAiTaskStartedAt(null);
          setAiTaskPhase(null);
          setAiReceivedChars(0);
          setAiReceivedChunks(0);

                                type="submit" 
                                disabled={isAiAnswering || !aiQuestion.trim()}
                                className="absolute right-3 top-3 bottom-3 bg-indigo-600 hover:bg-indigo-700 text-white px-4 rounded-xl transition-colors disabled:opacity-50 flex items-center justify-center shadow-sm"
                              >
                                {isAiAnswering ? <Loader2 className="w-5 h-5 animate-spin" /> : <Send className="w-5 h-5" />}
                              </button>
                            </form>

                            {aiAnswer && (
                              <div className="mt-6 bg-slate-50 rounded-2xl p-6 md:p-8 animate-in fade-in slide-in-from-bottom-4 border border-slate-100">
                                <div className="flex items-center gap-2 mb-5 text-indigo-600 font-bold text-sm border-b border-slate-200/60 pb-3">
                                  <Sparkles className="w-5 h-5" />
                                  AI 助教解答
                                </div>
                                {formatMarkdown(aiAnswer, "text-slate-800 text-lg leading-[1.8]")}
                              </div>
                            )}
                          </div>

                        </div>
                      )}

                      </div>

                    </div>
                    
                    <div className="bg-slate-50 p-4 border-t border-slate-100 flex items-center gap-2 text-slate-500 text-sm justify-center shrink-0 rounded-b-2xl">
                      <MousePointerClick className="w-4 h-4 shrink-0" />
                      <span>点选左侧句子可切换分析，双击单词加生词本</span>
                    </div>
                  </div>

                </div>
              </div>
            )}

            {/* Global Toast Notification */}
            {toastMessage && (
              <div className="fixed top-6 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-2xl z-[120] animate-in slide-in-from-top-4 flex items-center gap-2 font-medium">
                <Info className="w-4 h-4 text-indigo-400" />
                {toastMessage}
              </div>
            )}

            {/* Custom Confirm Dialog */}
            {confirmDialog && (
              <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-[110] p-4">
                <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6 relative animate-in zoom-in-95">
                  <h3 className="text-lg font-bold text-slate-800 mb-2">请确认</h3>
                  <p className="text-slate-600 mb-6">{confirmDialog.message}</p>
                  <div className="flex justify-end gap-3">
                    <button onClick={() => setConfirmDialog(null)} className="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg font-medium transition-colors">取消</button>
                    <button onClick={confirmDialog.onConfirm} className="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg font-medium transition-colors">确定</button>
                  </div>
                </div>
              </div>
            )}

            {/* Save Article Modal */}
            {saveModalOpen && (
              <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-[110] p-4">
                <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6 relative animate-in zoom-in-95">
                  <h3 className="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                    <Save className="w-5 h-5 text-indigo-600" />
                    保存到书架
                  </h3>
                  <input 
                    type="text" 
                    value={articleTitleInput}
                    onChange={e => setArticleTitleInput(e.target.value)}
                    className="w-full border border-slate-300 rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-indigo-500 outline-none mb-6 text-slate-800"
                    placeholder="给文章起个名字"
                    autoFocus
                  />
                  <div className="flex justify-end gap-3">
                    <button onClick={() => setSaveModalOpen(false)} className="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg font-medium transition-colors">取消</button>
                    <button 
                      onClick={() => {
                        if (!articleTitleInput.trim()) return;
                        const newArticle = {
                          id: window.crypto?.randomUUID ? crypto.randomUUID() : Math.random().toString(36).substring(2, 15),
                          title: articleTitleInput,
                          timestamp: Date.now(),
                          data: currentArticleData
                        };
                        setSavedArticles(prev => [newArticle, ...prev]);
                        setSaveModalOpen(false);
                        setToastMessage("✅ 文章已成功保存到本地书架！");
                      }} 
                      className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-medium transition-colors"
                    >
                      保存
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* Cloud Sync Login Modal */}
            {showLoginModal && (
              <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-[110] p-4">
                <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6 relative animate-in zoom-in-95">
                  <button
                    onClick={() => {
                      setShowLoginModal(false);
                      setAuthError("");
                    }}
                    className="absolute top-4 right-4 text-slate-400 hover:text-slate-600"
                    title="关闭"
                  >
                    <X className="w-5 h-5" />
                  </button>

                  <h3 className="text-lg font-bold text-slate-800 mb-2 flex items-center gap-2">
                    <User className="w-5 h-5 text-emerald-600" />
                    {user && !user.isAnonymous ? '云同步账号' : (isLoginMode ? '登录云同步' : '注册云同步账号')}
                  </h3>
                  <p className="text-sm text-slate-500 mb-5">
                    文章书架和生词本会按这个账号保存到云端；其他电脑打开网页后登录同一账号即可同步。
                  </p>

                  {user && !user.isAnonymous ? (
                    <div className="space-y-4">
                      <div className="rounded-2xl border border-emerald-100 bg-emerald-50 p-4 text-sm text-emerald-900">
                        当前已登录：{user.email || user.uid}
                        <div className="mt-2 text-xs">{cloudSyncStatus.message}</div>
                      </div>
                      <button
                        onClick={handleLogout}
                        className="w-full inline-flex items-center justify-center gap-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-white px-4 py-2.5 font-semibold transition-colors"
                      >
                        <LogOut className="w-4 h-4" />
                        退出账号
                      </button>
                    </div>
                  ) : (
                    <form onSubmit={handleAuthSubmit} className="space-y-4">
                      <div>
                        <label className="block text-sm font-medium text-slate-700 mb-2">邮箱</label>
                        <input
                          type="email"
                          value={loginEmail}
                          onChange={(e) => setLoginEmail(e.target.value)}
                          className="w-full rounded-xl border border-slate-300 px-4 py-2.5 text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500/40"
                          autoComplete="email"
                          required
                        />
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-slate-700 mb-2">密码</label>
                        <input
                          type="password"
                          value={loginPassword}
                          onChange={(e) => setLoginPassword(e.target.value)}
                          className="w-full rounded-xl border border-slate-300 px-4 py-2.5 text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500/40"
                          autoComplete={isLoginMode ? 'current-password' : 'new-password'}
                          required
                        />
                      </div>
                      {authError && <p className="text-sm text-red-600 whitespace-pre-line">{authError}</p>}
                      <button
                        type="submit"
                        disabled={isAuthenticating}
                        className="w-full inline-flex items-center justify-center gap-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 font-semibold transition-colors disabled:opacity-70"
                      >
                        {isAuthenticating ? <Loader2 className="w-4 h-4 animate-spin" /> : <KeyRound className="w-4 h-4" />}
                        {isLoginMode ? '登录并同步' : '注册并同步'}
                      </button>
                      <button
                        type="button"
                        onClick={handleGoogleLogin}
                        disabled={isAuthenticating}
                        className="w-full rounded-xl border border-slate-300 bg-white hover:bg-slate-50 text-slate-700 px-4 py-2.5 font-semibold transition-colors disabled:opacity-70"
                      >
                        使用 Google 登录
                      </button>
                      <button
                        type="button"
                        onClick={() => {
                          setIsLoginMode(prev => !prev);
                          setAuthError("");
                        }}
                        className="w-full text-sm font-semibold text-emerald-700 hover:text-emerald-800"
                      >
                        {isLoginMode ? '没有账号？切换到注册' : '已有账号？切换到登录'}
                      </button>
                    </form>
                  )}
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
