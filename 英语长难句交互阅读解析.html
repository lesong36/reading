  <style>
    /* 模拟 tailwindcss-animate 插件的动画效果，保证 UI 优雅过渡 */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideInBottom { from { transform: translateY(1.5rem); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes slideInTop { from { transform: translateY(-1.5rem); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes zoomIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes readerSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .animate-in {
      animation-duration: 0.4s;
      animation-fill-mode: both;
      animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
    }
    .animate-in.fade-in { animation-name: fadeIn; }
    .animate-in.slide-in-from-bottom-4, .animate-in.slide-in-from-bottom-5 { animation-name: slideInBottom; }
    .animate-in.slide-in-from-top-2, .animate-in.slide-in-from-top-4 { animation-name: slideInTop; }
    .animate-in.zoom-in-95 { animation-name: zoomIn; }
    .reader-boot-spinner { animation: readerSpin 0.9s linear infinite; }

    /* 优化滚动条样式 */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    .safe-area-pad { padding-left: max(0.75rem, env(safe-area-inset-left)); padding-right: max(0.75rem, env(safe-area-inset-right)); padding-bottom: max(0.75rem, env(safe-area-inset-bottom)); }
    /* iPad / touch */
    html { -webkit-text-size-adjust: 100%; }
    body { overscroll-behavior-y: none; }
    button, a, [role="button"] { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    @media (pointer: coarse) {
      button, .touch-target { min-height: 44px; }
      .reader-word-target { -webkit-touch-callout: none; }
      .reader-article-body {
        font-size: 1.375rem !important;
        line-height: 1.95 !important;
      }
      .reader-article-panel {
        padding: 1.5rem 1.25rem !important;
      }
      @media (min-width: 768px) {
        .reader-article-body {
          font-size: 1.5rem !important;
          line-height: 2 !important;
        }
        .reader-article-panel {
          padding: 1.75rem 1.5rem !important;
        }
      }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased">
  
  <div id="root">
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#f8fafc;color:#0f172a;">
      <div style="width:min(560px,100%);background:rgba(255,255,255,0.92);border:1px solid #e2e8f0;border-radius:28px;padding:32px;box-shadow:0 20px 50px rgba(15,23,42,0.08);text-align:center;">
        <div style="font-size:28px;font-weight:800;letter-spacing:-0.02em;">ReadMaster 阅读达人</div>

          正在启动阅读器并加载页面资源。首次打开或更新后，可能需要等待几秒。

        <div class="reader-boot-spinner" style="margin:20px auto 0;width:44px;height:44px;border-radius:9999px;border:4px solid #cbd5e1;border-top-color:#4f46e5;"></div>
      </div>
    </div>
  </div>

  <!-- 使用 data-type="module" 允许 Babel 编译 ES6 模块导入 -->
  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useRef, useMemo, Fragment } from 'https://esm.sh/react@18.2.0?target=es2022';
    import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client?bundle';
    import { BookOpen, Search, Info, MousePointerClick, Zap, AlignLeft, Underline, Link as LinkIcon, Tag, Sparkles, Send, Loader2, UploadCloud, FileText, ArrowLeft, BookMarked, Printer, Plus, Trash2, CheckCircle2, Download, Upload, MessageSquare, Library, Save, FolderOpen, User, LogOut, X, Bot, RefreshCw, KeyRound, ZoomIn, ZoomOut, Clock3, CalendarDays, ChevronLeft, ChevronRight, Mail, AlertTriangle, ClipboardCheck, Volume2, Square, Gauge, Map as MapIcon } from 'https://esm.sh/lucide-react@0.292.0?bundle&deps=react@18.2.0';
    import readability from 'https://esm.sh/text-readability@1.1.1?bundle';
    
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2?bundle';

    // Supabase uses a publishable key in the browser. The secret/service key
    // must never be added here, to local-config.js, or to GitHub Pages.
    const SUPABASE_CONFIG_STORAGE_KEY = 'reader_supabase_config';
    // Keep sync reads explicit.  The state row can grow with a learner's
    // history, so `select('*')` turns every reconnect into a full backup
    // download (including fields this reader never consumes).
    const READER_SYNC_STATE_FIELDS = 'vocabulary,favorites,reading_positions,quiz_progress,completion_records,preferences,encrypted_ai_key';
    const DEFAULT_SUPABASE_CONFIG = {
      url: 'https://faeixgpjhnwpfzfkgjsu.supabase.co',
      publishableKey: 'sb_publishable_vg-bfePJ4OSgoOOiMEJeCg_7YxdAdkx'
    };
    const LOCAL_PRIVATE_CONFIG = typeof window !== 'undefined' ? (window.__reader_local_config || {}) : {};
    // GitHub Pages 是静态站点；段落朗读经由 P920 的 Tailscale HTTPS 服务。
    // 桌面 App 仍使用同源的本地 Python 服务。local-config.js 可覆盖此地址。
    const P920_EDGE_TTS_ORIGIN = String(
      LOCAL_PRIVATE_CONFIG.p920EdgeTtsOrigin || 'https://p920.tail1462ad.ts.net:8443'
    ).replace(/\/$/, '');
    const getParagraphTtsEndpoint = () => {
      const hostname = window.location.hostname;
      return hostname === '127.0.0.1' || hostname === 'localhost'
        ? '/api/tts/edge'
        : `${P920_EDGE_TTS_ORIGIN}/api/tts/edge`;
    };
    // GitHub Pages / iPad 静态部署：不依赖语音与本地 Ollama
    const ENABLE_VOICE_FEATURES = false;
    const ENABLE_LOCAL_OLLAMA = false;
    const DEFAULT_AI_PROVIDER = 'cloud';
    const DEFAULT_DOUBAO_VOICE_APP_ID = LOCAL_PRIVATE_CONFIG.volcengineAppId || '';
    const DEFAULT_DOUBAO_VOICE_TOKEN = LOCAL_PRIVATE_CONFIG.volcengineAccessToken || '';
    const DEFAULT_DOUBAO_VOICE_CLUSTER = 'volcano_tts';
    const DEFAULT_DOUBAO_VOICE_TYPE = 'zh-female-warm';
    // 临时关闭豆包云端 TTS（按量计费）；恢复时改为 true
    const DOUBAO_VOICE_ENABLED = false;
    const LEGACY_DOUBAO_VOICE_TYPE_MAP = {
      BV701_streaming: 'zh-female-warm',
      BV002_streaming: 'zh-female-reporter',
      BV001_streaming: 'zh-male-warm'
    };
    const normalizeDoubaoVoiceType = (value) => {
      const cleaned = String(value || '').trim();
      if (!cleaned) return DEFAULT_DOUBAO_VOICE_TYPE;
      return LEGACY_DOUBAO_VOICE_TYPE_MAP[cleaned] || cleaned;
    };
    const getStoredSupabaseConfig = () => {
      try {
        const stored = localStorage.getItem(SUPABASE_CONFIG_STORAGE_KEY);
        return stored ? JSON.parse(stored) : null;
      } catch (error) {
        console.warn('Stored Supabase config is invalid:', error);
        return null;
      }
    };

    const SYNC_VAULT_VERSION = 1;
    const textEncoder = new TextEncoder();
    const textDecoder = new TextDecoder();
    const bytesToBase64 = (bytes) => btoa(String.fromCharCode(...bytes));
    const base64ToBytes = (value) => Uint8Array.from(atob(value), char => char.charCodeAt(0));
    const deriveSyncVaultKey = async (passphrase, salt) => {
      const material = await crypto.subtle.importKey('raw', textEncoder.encode(passphrase), 'PBKDF2', false, ['deriveKey']);
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt, iterations: 310000, hash: 'SHA-256' },
        material,
        { name: 'AES-GCM', length: 256 },
        false,
        ['encrypt', 'decrypt']
      );
    };
    const encryptForSyncVault = async (value, passphrase) => {
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const key = await deriveSyncVaultKey(passphrase, salt);
      const ciphertext = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, textEncoder.encode(value));
      return { v: SYNC_VAULT_VERSION, salt: bytesToBase64(salt), iv: bytesToBase64(iv), ciphertext: bytesToBase64(new Uint8Array(ciphertext)) };
    };
    const decryptFromSyncVault = async (payload, passphrase) => {
      if (!payload || payload.v !== SYNC_VAULT_VERSION) throw new Error('不支持的加密数据版本');
      const key = await deriveSyncVaultKey(passphrase, base64ToBytes(payload.salt));
      const plaintext = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: base64ToBytes(payload.iv) }, key, base64ToBytes(payload.ciphertext));
      return textDecoder.decode(plaintext);
    };

    let supabase = null, supabaseConfigSource = 'none';
    const suppliedSupabaseConfig = LOCAL_PRIVATE_CONFIG.supabaseUrl && LOCAL_PRIVATE_CONFIG.supabasePublishableKey
      ? { url: LOCAL_PRIVATE_CONFIG.supabaseUrl, publishableKey: LOCAL_PRIVATE_CONFIG.supabasePublishableKey }
      : getStoredSupabaseConfig() || DEFAULT_SUPABASE_CONFIG;
    if (suppliedSupabaseConfig?.url && suppliedSupabaseConfig?.publishableKey) {
      try {
        supabase = createClient(suppliedSupabaseConfig.url, suppliedSupabaseConfig.publishableKey, {
          auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
        });
        supabaseConfigSource = LOCAL_PRIVATE_CONFIG.supabaseUrl ? 'local' : 'bundled';
      } catch (e) {
        console.error('Supabase Initialization Error:', e);
      }
    }

    // Default built-in data
    const defaultArticleGlossary = [
      {
        term: 'astronomers',
        translation: '天文学家',

    const defaultArticleData = [
      {
        id: 's1',
        para: 1,

        segments: [
          { text: "In October 2017, ", type: "adverbial", label: "状语" },

          { text: "in Hawaii ", type: "modifier", label: "定语" },
          { text: "saw ", type: "verb", label: "谓语(过去时)" },
          { text: "something ", type: "object", label: "宾语" },
          { text: "surprising.", type: "modifier", label: "定语(分词)" }
        ],
        translation: "2017年10月，夏威夷的天文学家看到了一些令人惊讶的现象。",
        grammarFocus: "时态与原形 / 主谓一致 / 非谓语",
        analysis: "### 【主干结构】\n主句的主语是 **astronomers**，谓语是 **saw**，宾语是 **something**。\n\n### 【主谓一致】\n主语 astronomers（天文学家）为可数名词复数形式。\n\n### 【动词时态与原形】\n谓语动词 `saw` 是一般过去时，其动词原形为 `see`。由于是一般过去时，谓语动词的形态不受主语单复数影响。\n\n### 【非谓语动词】\n`surprising`（令人惊讶的）是现在分词（原形 `surprise`）在此处作后置定语，修饰不定代词 `something`（英语规则：修饰不定代词的形容词必须后置）。\n\n### 【代词指代】\n`something` 为不定代词，指代某种未知的现象或物体。"
      },
      {
        id: 's2',
        para: 1,
        text: "A strange object was moving through the solar system.",
        segments: [
          { text: "A strange object ", type: "subject", label: "主语(单数)" },

        ],

        grammarFocus: "时态 / 主谓一致",
        analysis: "### 【主干结构】\n主句主语是 **object**，谓语是 **was moving**，`through the solar system` 作地点状语。\n\n### 【主谓一致】\n主语 object 为单数第三人称名词，因此系动词严格对应使用单数形式的 `was`。\n\n### 【动词时态与原形】\n`was moving` 构成过去进行时，强调在过去某一特定时间段内正在持续发生的动作。动词原形为 `move`。\n\n### 【被动语态】\n本句为主动语态，物体自己正在移动。"
      },
      {
        id: 's3',
        para: 1,
        text: "They had seen many asteroids before, but this was something different.",

          { text: "had seen ", type: "verb", label: "谓语(过去完成时)" },
          { text: "many asteroids ", type: "object", label: "宾语" },
          { text: "before, ", type: "adverbial", label: "状语" },

      },
      {
        id: 's5',
        para: 1,
        text: "The object's speed and direction also showed something surprising.",
        segments: [
          { text: "The object's speed and direction ", type: "subject", label: "主语(并列)" },

        ],

          { text: "—the first ever seen.", type: "modifier", label: "同位语/定语" }
        ],
        translation: "这是一个星际物体——有史以来第一个被观测到的。",
        grammarFocus: "被动语态(省略) / 非谓语动词",
        pronounRef: "This 指代前文观测到的长条形物体。",

    // --- 优雅排版 Markdown 渲染器 ---
    const formatMarkdown = (text, baseClassName = "") => {
      if (!text) return null;
      
      const lines = text.split('\n');
      const result = [];
      let listItems = [];

      const flushList = () => {
        if (listItems.length > 0) {
          result.push(
            <ul className="list-disc pl-6 my-4 space-y-2 text-inherit marker:text-indigo-300" key={`ul-${result.length}`}>
              {listItems}
            </ul>
          );
          listItems = [];
        }
      };

      const parseInline = (str) => {
        const parts = str.split(/(\*\*.*?\*\*|\*.*?\*|`.*?`)/g);
        return parts.map((part, i) => {
          if (part.startsWith('**') && part.endsWith('**')) {
            return <strong key={i} className="font-bold text-slate-900">{part.slice(2, -2)}</strong>;
          }
          if (part.startsWith('*') && part.endsWith('*') && part.length > 2) {
            return <em key={i} className="italic text-slate-700">{part.slice(1, -1)}</em>;
          }
          if (part.startsWith('`') && part.endsWith('`')) {
            return <code key={i} className="bg-indigo-50 text-indigo-700 px-1.5 py-0.5 rounded-md text-[0.9em] font-mono border border-indigo-100/50">{part.slice(1, -1)}</code>;
          }
          return <React.Fragment key={i}>{part}</React.Fragment>;
        });
      };

      lines.forEach((line, index) => {
        const trimmed = line.trim();
        const listMatch = trimmed.match(/^[-*]\s+(.*)/);
        
        if (listMatch) {
          listItems.push(<li key={index}>{parseInline(listMatch[1])}</li>);
        } else {
          flushList();
          if (trimmed.startsWith('### ')) {
            // 使用优雅的左侧强调线替代下划线和卡片框
            result.push(
              <h3 key={index} className="text-xl font-bold text-slate-900 mt-8 mb-4 flex items-center gap-2.5">
                <div className="w-1.5 h-6 bg-indigo-500 rounded-full"></div>
                {parseInline(trimmed.slice(4))}
              </h3>
            );
          } else if (trimmed.startsWith('## ')) {
            result.push(<h2 key={index} className="text-2xl font-bold text-slate-900 mt-10 mb-4">{parseInline(trimmed.slice(3))}</h2>);
          } else if (trimmed.startsWith('# ')) {
            result.push(<h1 key={index} className="text-3xl font-bold text-slate-900 mt-12 mb-5">{parseInline(trimmed.slice(2))}</h1>);
          } else if (trimmed === '---') {
            result.push(<hr key={index} className="my-8 border-slate-100" />);
          } else if (trimmed === '') {
            result.push(<div key={index} className="h-2"></div>); 
          } else {
            result.push(<p key={index} className="mb-4 text-slate-700">{parseInline(line)}</p>); 
          }

      const text = String(segment.text || '');
      if (!['subject', 'object', 'predicative', 'coord-subject', 'coord-object', 'coord-predicative', 'clause-subject', 'clause-object', 'clause-predicative'].includes(type)) return [segment];
      const match = text.match(/^(\s*)((?:(?:the|a|an|this|that|these|those|my|your|his|her|our|their|some|many|several)\s+)?(?:[A-Za-z][A-Za-z'-]*\s+)+)([A-Za-z][A-Za-z'-]*)(\s+(?:of|with|from|in|on|for|at|by|about)\b[\s\S]*)$/i);
      if (!match) return [segment];
      const [, leading, beforeHead, head, tail] = match;
      const prefix = `${leading}${beforeHead}`;
      return [
        { ...segment, text: prefix, type: 'modifier', label: '前置定语' },
        { ...segment, text: head, type, label: normalizeSegmentLabel({ ...segment, type }) },
        { ...segment, text: tail, type: 'modifier', label: '后置定语' }
      ];
    };

    const repairMisclassifiedObjectComplements = (segments = []) => {
      const complementVerbs = /^(make|let|keep|find|consider|call|name|elect|paint|think|believe|want|expect|get|have)\b/i;
      return segments.map((segment, index, all) => {
        if (!['modifier', 'adverbial'].includes(segment.type) || all[index - 1]?.type !== 'object') return segment;
        const preceding = all.slice(0, index).reverse().find(item => ['verb', 'coord-verb'].includes(item.type));
        const text = String(segment.text || '').trim();
        if (!preceding || !complementVerbs.test(String(preceding.text || '').trim()) || !/^[A-Za-z][A-Za-z' -]*[.!?,;:]*$/.test(text)) return segment;
        return { ...segment, type: 'object-complement', label: '宾语补足语' };
      });
    };

    const normalizeSentenceSegments = (sentence = {}) => ({
      ...sentence,
      syntaxHints: sentence.syntaxHints && typeof sentence.syntaxHints === 'object'
        ? {
            mainClause: sentence.syntaxHints.mainClause && typeof sentence.syntaxHints.mainClause === 'object'
              ? {
                  subjectMode: subjectHintModes.has(sentence.syntaxHints.mainClause.subjectMode) ? sentence.syntaxHints.mainClause.subjectMode : '',
                  note: String(sentence.syntaxHints.mainClause.note || '').trim()
                }
              : null
          }
        : null,
      teachingFocus: sentence.teachingFocus && typeof sentence.teachingFocus === 'object'
        ? {
            mainQuestion: sentence.teachingFocus.mainQuestion || '',
            grammarQuestion: sentence.teachingFocus.grammarQuestion || '',
            modifierQuestion: sentence.teachingFocus.modifierQuestion || '',
            relationshipQuestion: sentence.teachingFocus.relationshipQuestion || '',
            commonMistake: sentence.teachingFocus.commonMistake || '',
            thinkingPath: Array.isArray(sentence.teachingFocus.thinkingPath)
              ? sentence.teachingFocus.thinkingPath.map(item => String(item || '').trim()).filter(Boolean)
              : [],
            encouragement: sentence.teachingFocus.encouragement || ''
          }
        : null,
      keyTerms: normalizeGlossary(sentence.keyTerms || sentence.glossary || []),
      segments: Array.isArray(sentence.segments)
        ? repairMisclassifiedObjectComplements(sentence.segments).flatMap(seg => splitLegacyNounPhraseForPractice({
            ...seg,
            type: normalizeSegmentType(seg),
            label: normalizeSegmentLabel(seg),
            clauseDepth: Number.isInteger(seg.clauseDepth) && seg.clauseDepth > 0 ? seg.clauseDepth : undefined
          }).map(part => ({
            ...part,
            type: normalizeSegmentType(part),
            label: normalizeSegmentLabel(part),
            clauseDepth: Number.isInteger(part.clauseDepth) && part.clauseDepth > 0 ? part.clauseDepth : undefined
          })))
        : []
    });

    const normalizeArticleData = (articleData = []) =>
      Array.isArray(articleData) ? articleData.map(normalizeSentenceSegments) : [];

    // Build practice frames from the sentence order, rather than assuming a
    // sentence has only one main clause and one coordinated clause. FANBOYS
    // at the top level split independent frames. A frame can also have a
    // subject that is structurally present but not printed (for example the
    // implicit "you" of an imperative), so an empty subject slot is never
    // automatically treated as a parsing failure.
    const FANBOYS = /^(for|and|nor|but|or|yet|so)$/i;
    const practiceRole = (type = '') => String(type).replace(/^(?:coord|clause)-/, '');
    const subjectHintModes = new Set(['explicit', 'implicit-you', 'shared-previous', 'existential-there', 'unknown']);
    const getMainClauseSubjectHint = (syntaxHints = {}) => {
      const hint = syntaxHints?.mainClause;
      if (!hint || typeof hint !== 'object' || !subjectHintModes.has(hint.subjectMode)) return null;
      return { subjectMode: hint.subjectMode, note: String(hint.note || '').trim() };
    };
    const inferFrameSubjectState = ({ roleIndexes = {}, segments = [], isFirstFrame = false, syntaxHints = {} }) => {
      const explicitIndexes = roleIndexes.subject || [];
      if (explicitIndexes.length) {
        const hint = isFirstFrame ? getMainClauseSubjectHint(syntaxHints) : null;
        return {
          mode: hint?.subjectMode === 'existential-there' ? 'existential-there' : 'explicit',
          displayText: '',
          note: hint?.note || ''
        };
      }

      const verbText = (roleIndexes.verb || []).map(index => segments[index]?.text?.trim()).filter(Boolean).join(' ');
      if (!verbText) return { mode: 'unknown', displayText: '', note: '' };

      const hinted = isFirstFrame ? getMainClauseSubjectHint(syntaxHints) : null;
      if (hinted?.subjectMode === 'implicit-you') return { mode: 'implicit-you', displayText: 'you（祈使句中省略）', note: hinted.note };
      if (hinted?.subjectMode === 'shared-previous') return { mode: 'shared-previous', displayText: '沿用上一分句的主语', note: hinted.note };
      if (hinted?.subjectMode === 'existential-there') return { mode: 'existential-there', displayText: 'there（形式主语）', note: hinted.note };
      if (hinted?.subjectMode === 'unknown') return { mode: 'unknown', displayText: '主语未显式出现，需核对倒装、省略或上下文', note: hinted.note };

      if (!isFirstFrame) return { mode: 'shared-previous', displayText: '沿用上一分句的主语', note: '' };
      // A top-level finite verb with no printed subject is normally an imperative.
      // Do not make this guess for non-finite forms such as "to do" or "doing".
      if (!/^(to\s+|\w+ing\b)/i.test(verbText)) {
        return { mode: 'implicit-you', displayText: 'you（祈使句中省略）', note: '主句以动词原形开头，按祈使句处理。' };
      }
      return { mode: 'unknown', displayText: '主语未显式出现，需核对倒装、省略或上下文', note: '' };
    };
    const frameSubjectDisplay = (frame = {}) => frame.subjectState?.displayText || '';
    const buildPracticeFrames = (segments = [], syntaxHints = {}) => {
      const groups = [];
      let start = 0;
      let depth = 0;
      let connectorBefore = null;
      const addFrame = (end, connectorIndex = null) => {
        const indexes = Array.from({ length: Math.max(0, end - start) }, (_, offset) => start + offset)
          .filter(index => !/^clause-/.test(segments[index]?.type || ''));
        const roleIndexes = { subject: [], verb: [], object: [], complement: [] };
        indexes.forEach(index => {
          const role = practiceRole(segments[index]?.type);
          if (role === 'subject' || role === 'verb') roleIndexes[role].push(index);
          if (role === 'object' || role === 'predicative') roleIndexes.object.push(index);
          if (role === 'object-complement') roleIndexes.complement.push(index);
        });
        const contentIndexes = indexes.filter(index => /[A-Za-z]/.test(segments[index]?.text || ''));
        if (roleIndexes.subject.length || roleIndexes.verb.length || roleIndexes.object.length || roleIndexes.complement.length) {
          const subjectState = inferFrameSubjectState({ roleIndexes, segments, isFirstFrame: groups.length === 0, syntaxHints });
          groups.push({
            key: `frame-${groups.length}`,
            label: groups.length ? `并列主干 ${groups.length + 1}` : '主干 1',
            connectorBefore,
            connectorIndex,
            roleIndexes,
            contentIndexes,
            sharedSubject: subjectState.mode === 'shared-previous',
            subjectState
          });
        } else if (groups.length > 0 && connectorBefore !== null && contentIndexes.length) {
          groups.push({
            key: `frame-${groups.length}`,
            label: '并列对比修饰层',
            connectorBefore,
            connectorIndex,
            roleIndexes,
            contentIndexes,
            kind: 'predicate-contrast',
            sharedSubject: true
          });
        }
        start = end + (connectorIndex === null ? 0 : 1);
        connectorBefore = connectorIndex;
      };
      segments.forEach((segment, index) => {
        const text = String(segment?.text || '');
        const opened = (text.match(/\(/g) || []).length;
        const closed = (text.match(/\)/g) || []).length;
        const isDivider = depth === 0 && segment?.type === 'conjunction' && FANBOYS.test(text.trim());
        if (isDivider) addFrame(index, index);
        depth += opened - closed;
      });
      addFrame(segments.length, null);
      return groups;
    };

    const buildModifierClauseFrames = (segments = []) => {
      const clauseIndexes = segments.map((segment, index) => /^clause-/.test(segment?.type || '') ? index : -1).filter(index => index >= 0);
      const runs = clauseIndexes.reduce((all, index) => {
        const last = all[all.length - 1];
        if (last && index === last.indexes[last.indexes.length - 1] + 1) last.indexes.push(index);
        else all.push({ indexes: [index] });
        return all;
      }, []);
      const frames = [];
      runs.forEach(run => {
        let inferredDepth = 1;
        let hasVerbAtCurrentDepth = false;
        let current = null;
        run.indexes.forEach(index => {
          const segment = segments[index];
          const role = practiceRole(segment?.type);
          const declaredDepth = Number.isInteger(segment?.clauseDepth) && segment.clauseDepth > 0 ? segment.clauseDepth : 0;
          // Old data has no depth. When another clause-subject appears after
          // a clause verb, it normally starts an embedded clause: "they say
          // [something has ...]". New data supplies clauseDepth directly.
          if (declaredDepth) inferredDepth = declaredDepth;
          else if (role === 'subject' && hasVerbAtCurrentDepth) {
            inferredDepth += 1;
            hasVerbAtCurrentDepth = false;
          }
          const depth = inferredDepth;
          if (!current || current.depth !== depth) {
            current = {
              key: `clause-${frames.length}`,
              label: `从句 ${frames.length + 1}`,
              depth,
              indexes: [],
              roleIndexes: { subject: [], verb: [], object: [], complement: [] }
            };
            frames.push(current);
          }
          current.indexes.push(index);
          if (role === 'subject' || role === 'verb') current.roleIndexes[role].push(index);
          if (role === 'object' || role === 'predicative') current.roleIndexes.object.push(index);
          if (role === 'object-complement') current.roleIndexes.complement.push(index);
          if (role === 'verb') hasVerbAtCurrentDepth = true;
        });
      });
      return frames.map((frame, number) => {
        const first = frame.indexes[0];
        const lead = frame.depth === 1 && first > 0 && segments[first - 1]?.type === 'conjunction' && !FANBOYS.test(String(segments[first - 1]?.text || '').trim()) ? first - 1 : null;
        const parent = frame.depth > 1 ? [...frames].slice(0, number).reverse().find(item => item.depth < frame.depth) : null;
        return { ...frame, indexes: lead === null ? frame.indexes : [lead, ...frame.indexes], parentKey: parent?.key || null };
      });
    };

    const collectArticleGlossary = (article = {}, articleData = []) => {
      const fromArticle = normalizeGlossary(article.glossary || []);
      const fromSentences = normalizeArticleData(articleData || article.data || [])
        .flatMap(sentence => sentence.keyTerms || []);
      return normalizeGlossary([...fromArticle, ...fromSentences]);
    };

    const joinArticleText = (articleData = []) =>
      normalizeArticleData(articleData)
        .map(sentence => (sentence?.text || '').trim())
        .filter(Boolean)
        .join(' ');

    const getDifficultyBand = (grade = 0) => {
      if (grade < 3) return 'Very Easy';
      if (grade < 6) return 'Easy';
      if (grade < 9) return 'Moderate';
      if (grade < 12) return 'Challenging';
      return 'Advanced';
    };

    const LEXILE_CALIBRATION_ANCHORS = [
      { raw: -455.6, lexile: 100 },
      { raw: -146.0196, lexile: 100 },
      { raw: 25.86, lexile: 300 },
      { raw: 61.4336, lexile: 300 },
      { raw: 78.0987, lexile: 400 },
      { raw: 117.8813, lexile: 400 },
      { raw: 119.1587, lexile: 400 },
      { raw: 121.1713, lexile: 500 },
      { raw: 130.4541, lexile: 500 },
      { raw: 135.752, lexile: 600 },
      { raw: 143.3362, lexile: 600 },
      { raw: 145.9475, lexile: 700 },
      { raw: 175.8632, lexile: 700 },
      { raw: 179.9582, lexile: 700 },
      { raw: 214.0281, lexile: 700 },
      { raw: 226.067, lexile: 800 },
      { raw: 235.5329, lexile: 900 },
      { raw: 429.1575, lexile: 900 }
    ];

    const estimateLexileRawScore = ({ fkGrade = 0, avgSentenceLength = 0, difficultWordRatio = 0, wordCount = 0 }) => {
      let raw = -100 + (fkGrade * 20) + (avgSentenceLength * 14) + (difficultWordRatio * 50);

      // Short early-reader texts behave very differently from normal passages,
      // so we downshift them using the public RIF calibration set.
      if (wordCount < 80) raw -= 180;
      if (wordCount < 50) raw -= 220;

      return raw;
    };

    const calibrateLexileEstimate = (rawScore = 0) => {
      if (!Number.isFinite(rawScore)) return null;
      const anchors = LEXILE_CALIBRATION_ANCHORS;

      if (rawScore <= anchors[0].raw) return Math.round(anchors[0].lexile / 10) * 10;
      if (rawScore >= anchors[anchors.length - 1].raw) return Math.round(anchors[anchors.length - 1].lexile / 10) * 10;

      for (let index = 0; index < anchors.length - 1; index += 1) {
        const current = anchors[index];
        const next = anchors[index + 1];
        if (rawScore < current.raw || rawScore > next.raw) continue;

        if (Math.abs(next.raw - current.raw) < 1e-9) {
          return Math.round(next.lexile / 10) * 10;
        }

        const progress = (rawScore - current.raw) / (next.raw - current.raw);
        const calibrated = current.lexile + (next.lexile - current.lexile) * progress;
        return Math.max(0, Math.round(calibrated / 10) * 10);
      }

      return Math.max(0, Math.round(rawScore / 10) * 10);
    };

    const estimateLexileFromReadability = ({ fkGrade = 0, avgSentenceLength = 0, difficultWordRatio = 0, wordCount = 0 }) => {
      const rawScore = estimateLexileRawScore({ fkGrade, avgSentenceLength, difficultWordRatio, wordCount });
      return calibrateLexileEstimate(rawScore);
    };

    const computeArticleReadability = (articleData = []) => {
      const text = joinArticleText(articleData);
      if (!text) {
        return {
          wordCount: 0,
          sentenceCount: 0,
          avgSentenceLength: 0,
          difficultWordCount: 0,
          difficultWordRatio: 0,
          fkGrade: null,
          readingEase: null,
          estimatedLexile: null,
          difficultyBand: 'Unknown'
        };
      }

      const wordCount = Number(readability.lexiconCount(text) || 0);
      const sentenceCount = Number(readability.sentenceCount(text) || 0);
      const avgSentenceLength = Number(readability.averageSentenceLength(text) || 0);
      const difficultWordCount = Number(readability.difficultWords(text) || 0);
      const fkGrade = Number(readability.fleschKincaidGrade(text) || 0);
      const readingEase = Number(readability.fleschReadingEase(text) || 0);
      const difficultWordRatio = wordCount > 0 ? difficultWordCount / wordCount : 0;
      const estimatedLexile = estimateLexileFromReadability({ fkGrade, avgSentenceLength, difficultWordRatio, wordCount });

      return {
        wordCount,
        sentenceCount,
        avgSentenceLength,
        difficultWordCount,
        difficultWordRatio,
        fkGrade: Number.isFinite(fkGrade) ? fkGrade : null,
        readingEase: Number.isFinite(readingEase) ? readingEase : null,
        estimatedLexile,
        difficultyBand: getDifficultyBand(fkGrade)
      };
    };

    const formatLexile = (value) => {
      if (value === null || value === undefined || Number.isNaN(value)) return 'N/A';
      return `${Math.round(value)}L`;
    };

    const formatGrade = (value) => {
      if (value === null || value === undefined || Number.isNaN(value)) return 'N/A';
      return `Grade ${Number(value).toFixed(1)}`;
    };

    const getDifficultyBandShortLabel = (band = '') => {
      if (band === 'Very Easy') return 'VE.';
      if (band === 'Easy') return 'EZ.';
      if (band === 'Moderate') return 'MOD.';
      if (band === 'Challenging') return 'CH.';
      if (band === 'Advanced') return 'ADV.';
      return 'N/A';
    };

    const HoverTip = ({ text, align = 'left', wide = false, children }) => (
      <span className="group relative inline-flex">
        {children}
        <span
          className={`pointer-events-none absolute top-full z-30 mt-2 rounded-xl bg-slate-950 px-3 py-2 text-[11px] leading-4 text-white shadow-xl ring-1 ring-white/10 opacity-0 translate-y-1 transition-all duration-150 group-hover:opacity-100 group-hover:translate-y-0 group-focus-within:opacity-100 group-focus-within:translate-y-0 ${
            wide ? 'w-72' : 'w-max max-w-[16rem]'
          } ${
            align === 'right' ? 'right-0' : 'left-0'
          }`}
        >
          {text}
        </span>
      </span>
    );

    const getGradeShortLabel = (value) => (
      value === null || value === undefined || Number.isNaN(value)
        ? 'G-N/A'
        : `G${Number(value).toFixed(1)}`
    );

    const getWordCountShortLabel = (value) => (
      value === null || value === undefined || Number.isNaN(value)
        ? 'N/A'
        : `${value}w`
    );

    const getReadabilityTooltip = (kind, readability = {}) => {
      if (kind === 'lexile') {
        return `Lexile 估算值：${formatLexile(readability.estimatedLexile)}。基于公开样本校准的自动难度估算，并非官方认证分值。`;
      }
      if (kind === 'grade') {
        const grade = Number(readability.fkGrade ?? 0).toFixed(1);
        return `Flesch-Kincaid 年级估算。G${grade} 表示大约适合 ${grade} 年级阅读。`;
      }
      if (kind === 'words') {
        return `全文词数。${readability.wordCount ?? 0}w 表示约 ${readability.wordCount ?? 0} 个单词。`;
      }
      if (kind === 'band') {
        return `难度分级。${getDifficultyBandShortLabel(readability.difficultyBand)} 表示 ${readability.difficultyBand || 'Unknown'}。`;
      }
      return '';
    };

    const ReadabilityBadge = ({ kind, readability = {}, theme = 'dark' }) => {
      const tone = theme === 'light'
        ? 'bg-white text-slate-700 border border-slate-200'
        : 'bg-white/10 text-slate-100 border border-white/10';
      const lexileTone = theme === 'light'
        ? 'bg-indigo-50 text-indigo-700 border border-indigo-200'
        : 'bg-white/10 text-indigo-100 border border-white/10';

      const contentByKind = {
        lexile: {
          label: `LX ${formatLexile(readability.estimatedLexile)}`,
          icon: <Info className="w-3.5 h-3.5" />,
          className: lexileTone
        },
        grade: {
          label: getGradeShortLabel(readability.fkGrade),
          icon: null,
          className: tone
        },
        words: {
          label: getWordCountShortLabel(readability.wordCount),
          icon: null,
          className: tone
        },
        band: {
          label: getDifficultyBandShortLabel(readability.difficultyBand),
          icon: null,
          className: tone
        }
      };

      const content = contentByKind[kind];
      if (!content) return null;

      return (
        <HoverTip text={getReadabilityTooltip(kind, readability)}>
          <span className={`inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full cursor-help ${content.className}`}>
            {content.icon}
            {content.label}
          </span>
        </HoverTip>
      );
    };

    const ReadabilityBadgeRow = ({ readability = {}, theme = 'dark', compact = false }) => (
      <div className={`flex flex-wrap gap-2 ${compact ? 'text-[11px]' : 'text-xs'}`}>
        <ReadabilityBadge kind="lexile" readability={readability} theme={theme} />
        <ReadabilityBadge kind="grade" readability={readability} theme={theme} />
        <ReadabilityBadge kind="words" readability={readability} theme={theme} />
        <ReadabilityBadge kind="band" readability={readability} theme={theme} />
      </div>
    );

    const segmentTextList = (segments = []) => segments.map(seg => seg.text?.trim()).filter(Boolean);
    const formatTeachingList = (items = []) => {
      const cleaned = items.map(item => String(item || '').trim()).filter(Boolean);
      if (cleaned.length === 0) return '';
      if (cleaned.length === 1) return cleaned[0];
      if (cleaned.length === 2) return `${cleaned[0]} 和 ${cleaned[1]}`;
      return `${cleaned.slice(0, -1).join('、')}，以及 ${cleaned[cleaned.length - 1]}`;
    };
    const pickFirstMeaningful = (items = []) => items.find(item => String(item || '').trim()) || '';
    const classifyGrammarFocus = (grammarPoints = []) => {
      const text = grammarPoints.join(' / ');
      return {
        hasAgreement: /主谓一致/.test(text),
        hasPronoun: /代词|指代/.test(text),
        hasTenseVoice: /时态|语态|被动/.test(text),
        hasVerbPattern: /动词|非谓语|原形|搭配/.test(text),
        hasPrepPattern: /介词|介宾/.test(text)
      };
    };


    const describeSegmentForChild = (seg = {}) => {
      const text = (seg.text || '').trim();
      const label = normalizeSegmentLabel(seg) || seg.label || '';
      const type = seg.type || '';
      const lower = text.toLowerCase();
      const prefix = text ? `${text} ` : '这一块 ';

      if (type === 'adverbial' || label === '动词修饰语') {
        if (/^(in|on|at|during|before|after|when|while)\b/i.test(lower) || /时间/.test(seg.label || '')) return `${prefix}像一个“时间/地点小贴纸”，告诉我们事情在什么时候、什么地方发生`;
        if (/^(because|for|to|so that)\b/i.test(lower) || /原因|目的/.test(seg.label || '')) return `${prefix}像一个“原因小贴纸”，告诉我们为什么做、为了什么做`;
        return `${prefix}像贴在动作旁边的小贴纸，让动作说得更清楚`;
      }

      if (label === '名词修饰语' || type === 'modifier') {
        if (/^[-—]/.test(text)) return `${prefix}像补充说明的小尾巴，给前面的词多加一点信息`;
        return `${prefix}像贴在名词旁边的小标签，告诉我们这个人或东西是什么样的`;
      }

      if (type === 'conjunction' || label === '连接词') return `${prefix}像一座小桥，把前后两块意思接起来`;
      if (String(type).startsWith('clause') || label === '从句核心') return `${prefix}像句子里的“小房间”，里面也有自己的小结构`;
      return `${prefix}是补充信息，先放在旁边，等主干站稳了再加回来`;
    };

    const getSegmentTextByTypes = (segments = [], types = []) =>
      formatTeachingList(segmentTextList(segments.filter(seg => types.includes(seg.type))));

    const getExcludedMainPartsExplanation = (segments = []) => {
      const extras = segments
        .filter(seg => !['subject', 'verb', 'object', 'predicative', 'object-complement', 'clause-subject', 'clause-verb', 'clause-object', 'clause-predicative', 'coord-subject', 'coord-verb', 'coord-object', 'coord-predicative'].includes(seg.type))
        .map(seg => {
          const text = (seg.text || '').trim();
          if (!text) return '';
          return `${describeSegmentForChild(seg)}，先不放进骨架里`;
        })
        .filter(Boolean);
      return extras.length ? `旁边的词先放一放：${extras.join('；')}。` : '这句话的补充信息不多，所以主干会比较清楚。';
    };

    const IRREGULAR_VERB_BASE_MAP = {
      saw: 'see',
      seen: 'see',
      was: 'be',
      were: 'be',
      had: 'have',
      showed: 'show',
      went: 'go',
      came: 'come',
      took: 'take',
      made: 'make',
      found: 'find',
      thought: 'think',
      said: 'say',
      told: 'tell',
      knew: 'know',
      gave: 'give',
      became: 'become',
      wrote: 'write',
      read: 'read',
      felt: 'feel',
      kept: 'keep',
      left: 'leave'
    };

    const inferVerbBaseForm = (verbText = '') => {
      const cleaned = String(verbText || '').trim().toLowerCase();
      if (!cleaned) return '';
      const words = cleaned.split(/\s+/).filter(Boolean);
      const mainWord = words[words.length - 1] || '';
      if (IRREGULAR_VERB_BASE_MAP[mainWord]) return IRREGULAR_VERB_BASE_MAP[mainWord];
      if (mainWord.endsWith('ing')) {
        if (mainWord.endsWith('ying')) return `${mainWord.slice(0, -4)}ie`;
        if (/([b-df-hj-np-tv-z])\1ing$/.test(mainWord)) return mainWord.slice(0, -4);
        if (mainWord.endsWith('ing')) return mainWord.slice(0, -3);
      }
      if (mainWord.endsWith('ied')) return `${mainWord.slice(0, -3)}y`;
      if (mainWord.endsWith('ed')) {
        const stem = mainWord.slice(0, -2);
        return stem.endsWith('e') ? stem : stem;
      }
      return mainWord;
    };

    const describeVerbFormForChild = (verbText = '') => {
      const cleaned = String(verbText || '').trim();
      if (!cleaned) return { label: '动作', explanation: '先看这个动作词，它会告诉我们句子正在说什么。' };

      const lower = cleaned.toLowerCase();
      const base = inferVerbBaseForm(cleaned);
      const baseText = base ? `，它的原形是 ${base}` : '';

      if (/\b(was|were)\s+\w+ing\b/.test(lower)) {
        return {
          label: '过去进行时',
          explanation: `${cleaned} 是过去进行时，表示那时候“正在”发生这个动作${baseText}。`
        };
      }

      if (/\bhad\s+\w+/.test(lower)) {
        return {
          label: '过去完成时',
          explanation: `${cleaned} 是过去完成时，表示这个动作发生在过去某个时间点之前${baseText}。`
        };
      }

      if (/\b(is|am|are|was|were)\s+\w+(ed|en)\b/.test(lower)) {
        return {
          label: '被动表达',
          explanation: `${cleaned} 带有“被怎么样”的感觉，重点是主语受到这个动作影响${baseText}。`
        };
      }

      if (/\b(was|were|did|saw|showed|found|came|went|made|thought|told|knew|gave|became|wrote|felt|kept|left)\b/.test(lower) || /\w+ed\b/.test(lower)) {
        return {
          label: '一般过去时',
          explanation: `${cleaned} 是过去式，表示这件事已经发生过了${baseText}。`
        };
      }

      return {
        label: '核心动作',
        explanation: `${cleaned} 是这句里最重要的动作词${baseText}。`
      };
    };

    const joinRoleSummary = (subjectText = '', verbText = '', objectText = '') =>
      [subjectText, verbText, objectText].filter(Boolean).join(' | ');

    const buildStepSentenceExample = ({ subjectText = '', verbText = '', objectText = '', modifierText = '', clauseText = '', logicConnector = '', pronounRef = '' } = {}) => {
      const parts = [];
      if (subjectText) parts.push(`谁在做：${subjectText}`);
      if (verbText) parts.push(`动作是：${verbText}`);
      if (objectText) parts.push(`动作落点：${objectText}`);
      if (modifierText) parts.push(`旁边的小贴纸：${modifierText}`);
      if (clauseText) parts.push(`句子里的小房间：${clauseText}`);
      if (logicConnector) parts.push(`连接线索：${logicConnector}`);
      if (pronounRef) parts.push(`代词回收：${pronounRef}`);
      return parts;
    };

    const buildMainStepTeaching = (sentence = {}, mainSegments = []) => {
      const firstMainFrame = buildPracticeFrames(sentence.segments || [], sentence.syntaxHints || {})[0];
      const inferredSubject = frameSubjectDisplay(firstMainFrame);
      const subjectText = formatTeachingList(segmentTextList(mainSegments.filter(seg => seg.type === 'subject'))) || inferredSubject;
      const verbText = formatTeachingList(segmentTextList(mainSegments.filter(seg => seg.type === 'verb')));
      const objectText = formatTeachingList(segmentTextList(mainSegments.filter(seg => ['object', 'predicative', 'object-complement'].includes(seg.type))));
      const answerParts = [subjectText, verbText, objectText].filter(Boolean);
      const answerText = answerParts.length ? answerParts.join(' | ') : (sentence.text || '先从核心动作开始。');
      const teachingFocus = sentence.teachingFocus || {};
      const thinkingPath = Array.isArray(teachingFocus.thinkingPath) ? teachingFocus.thinkingPath : [];
      const guidingQuestion = teachingFocus.mainQuestion || '这句里真正的动作是什么？谁在做这个动作？';
      const hintLine = thinkingPath.length
        ? `你可以按这个顺序想：${formatTeachingList(thinkingPath)}。`
        : '提示你一下，先找真正的动作，再找动作前后的核心名词或代词。';
      const mistakeLine = teachingFocus.commonMistake || '常见错误是把介词短语、形容词或长修饰语直接误当成主干。';
      const encouragement = teachingFocus.encouragement || '慢慢来，你已经抓到句子的骨架了。';
      const excludedExplanation = getExcludedMainPartsExplanation(sentence.segments || []);
      const verbForm = describeVerbFormForChild(verbText);
      return {
        prompt: `这一小步只做一件事：把句子的骨架找出来。先看动作 ${verbText || '核心动作'}，再看是谁在做，最后看动作落到谁或什么上面。`,
        explanation: `这句的主干可以先收成：${answerText}。其中 ${subjectText || '主语'} 是“谁在做”，${verbText || '谓语'} 是“在做什么”，${objectText || '宾语/表语'} 是“动作落到哪里”或“最后变成什么”。${firstMainFrame?.subjectState?.note ? ` ${firstMainFrame.subjectState.note}` : ''}${excludedExplanation}`,
        coachLine: `${encouragement} 这一步只要先把骨架站稳，后面的补充信息就不会把你绕晕。`,
        focusLabel: '先把主线找出来',
        screenTitle: '先找谁在做什么',
        screenPrompt: '我们先把最重要的三块找出来。',
        sentenceCardTitle: '这句里的骨架',
        sentenceCardLines: [
          `谁在做：${subjectText || '还没找到时，先盯动作前面的核心名词'}`,
          `动作是：${verbText || '先找最能表示动作或状态的词'}`,
          `动作落点：${objectText || '再看动作后面最重要的对象或结果'}`
        ],
        voiceSegments: [
          { kind: 'explain', text: `第一步，我们只做一件事：给句子找骨架。骨架通常有三块，谁在做、做了什么、动作落到谁或什么上面。` },
          { kind: 'explain', text: `这句里，${subjectText || '前面的核心成员'} 是主语，表示谁在做；${verbText || '这个动作词'} 是谓语，表示在做什么；${objectText || '后面的结果部分'} 是宾语或表语，表示动作落点或最后的状态。` },
          { kind: 'explain', text: `${verbForm.explanation}` },
          { kind: 'explain', text: `${hintLine}${mistakeLine} ${excludedExplanation}` },
          { kind: 'encourage', text: `${encouragement} 所以这句的主干可以收成：${answerText}。` }
        ]
      };
    };
    const buildGrammarStepTeaching = (sentence = {}, grammarPoints = [], segments = []) => {
      const grammarFlags = classifyGrammarFocus(grammarPoints);
      const verbText = pickFirstMeaningful(segmentTextList(segments.filter(seg => seg.type === 'verb')));
      const subjectText = pickFirstMeaningful(segmentTextList(segments.filter(seg => seg.type === 'subject')));
      const objectText = pickFirstMeaningful(segmentTextList(segments.filter(seg => ['object', 'predicative'].includes(seg.type))));
      const pronounTip = sentence.pronounRef ? `这句还要回收代词指代：${sentence.pronounRef}` : '';
      const teachingFocus = sentence.teachingFocus || {};
      const verbForm = describeVerbFormForChild(verbText);
      const checks = [
        grammarFlags.hasAgreement ? `先看主语 ${subjectText || '的中心词'} 和谓语 ${verbText || '动词'} 是不是搭得上` : '',
        grammarFlags.hasTenseVoice ? `再看谓语 ${verbText || '动词'} 的时态或语态，它会告诉我们动作发生在什么时候、是主动还是被动` : '',
        grammarFlags.hasPronoun ? pronounTip || '再看代词到底指谁，不要让 it、they、this 飘在空中' : '',
        grammarFlags.hasVerbPattern ? '如果看到非谓语或动词搭配，要先分清哪个是核心谓语，哪个只是补充动作' : '',
        grammarFlags.hasPrepPattern ? '看到介词时别急着往主干里塞，先判断它是在补地点、时间，还是固定搭配' : ''
      ].filter(Boolean);
      const fallbackChecks = [
        `先看主语 ${subjectText || '的中心词'} 和谓语 ${verbText || '动词'} 能不能对上`,
        '再看时态语态，判断动作发生在什么时候',
        sentence.pronounRef ? pronounTip : '如果句里有代词，再追问它到底指谁'
      ].filter(Boolean);
      const checklist = checks.length ? checks : fallbackChecks;
      const guidingQuestion = teachingFocus.grammarQuestion || '这句最先该盯哪个语法信号，才能不走偏？';
      const mistakeLine = teachingFocus.commonMistake || '常见错误是看见很多术语就慌，却没有先盯住谓语和主语的配合。';
      const encouragement = teachingFocus.encouragement || '语法不是背标签，而是按顺序排查。';
      return {
        prompt: `现在只看语法信号。先盯住谓语 ${verbText || '动词'}，因为它最能告诉我们动作发生在什么时候，以及主语和它配得对不对。`,
        explanation: `这句可以按顺序检查：${formatTeachingList(checklist)}。${grammarPoints.length ? `这句最值得注意的点是：${grammarPoints.join('、')}。` : ''}`,
        coachLine: `${encouragement} 先看谓语，再看主语搭配，最后看代词和补充结构，语法就不会乱。`,
        focusLabel: '看看动作的样子',
        screenTitle: '先看动作长什么样',
        screenPrompt: '这个动作一露面，就会告诉我们很多事。',
        sentenceCardTitle: '这句里的语法信号',
        sentenceCardLines: [
          `主语：${subjectText || '先找动作前最核心的人或物'}`,
          `谓语：${verbText || '先看动作词'}`,
          `谓语说明：${verbForm.explanation}`,
          objectText ? `动作落点：${objectText}` : ''
        ].filter(Boolean),
        voiceSegments: [
          { kind: 'explain', text: `第二步，我们看语法信号。最先盯的不是一大串术语，而是谓语长什么样。` },
          { kind: 'explain', text: `${verbForm.explanation}` },
          { kind: 'explain', text: `再看主语 ${subjectText || '这个成员'} 和谓语 ${verbText || '这个动作'} 配不配。如果主语是单个成员，谓语形式也要跟它搭上。` },
          { kind: 'explain', text: `${pronounTip || '如果句子里有 it、they、this 这样的词，还要回头找它到底指谁。'} ${mistakeLine}`.trim() },
          { kind: 'encourage', text: `${encouragement}${grammarPoints.length ? ` 这句最需要记住的是：${grammarPoints.join('、')}。` : ''}` }
        ]
      };
    };
    const buildModifierStepTeaching = (sentence = {}, modifierSegments = [], clauseSegments = []) => {
      const modifierText = formatTeachingList(segmentTextList(modifierSegments));
      const clauseText = formatTeachingList(segmentTextList(clauseSegments));
      const hasClauseCore = clauseSegments.length > 0;
      const teachingFocus = sentence.teachingFocus || {};
      const guidingQuestion = teachingFocus.modifierQuestion || '这些长长的部分，哪些是在修饰名词，哪些是在补充动作，哪些其实是从句？';
      const mistakeLine = teachingFocus.commonMistake || '常见错误是把所有长结构都一股脑塞回主干，结果主干越找越乱。';
      const encouragement = teachingFocus.encouragement || '你不是在拆碎句子，而是在给主干减负。';
      return {
        prompt: `主干抓住以后，再看旁边的小贴纸和小房间。它们不是骨架，但会告诉我们更多细节。`,
        explanation: `${modifierText ? `${modifierText} 更像贴在名词或动作旁边的小标签，告诉我们时间、地点、样子或补充说明。` : '这句补充部分不多，所以更适合练习把骨架和补充分开。'}${hasClauseCore ? ` 如果看到 ${clauseText}，就把它当成句子里的小房间，里面也有自己的小结构。` : ''}`,
        coachLine: `${encouragement} 先分清骨架和补充，长句就会立刻轻很多。`,
        focusLabel: '把旁边的小信息理一理',
        screenTitle: '看看哪些是小贴纸',
        screenPrompt: '这些小贴纸会补充意思，但不用抢主位。',
        sentenceCardTitle: '这句里的补充信息',
        sentenceCardLines: [
          modifierText ? `小贴纸：${modifierText}` : '这句补充信息不多，重点是别把小贴纸误当骨架。',
          hasClauseCore ? `小房间：${clauseText}` : '这句没有特别大的从句小房间。',
          '主干先站好，补充信息再慢慢挂回去。'
        ],
        voiceSegments: [
          { kind: 'explain', text: `第三步，我们看补充信息。补充信息不是骨架，但它会让句子更完整。` },
          { kind: 'explain', text: `${modifierText ? `这句里的小贴纸主要有：${modifierText}。它们告诉我们时间、地点、样子，或者多加一点说明。` : '这句补充信息不多，所以更适合练习“先骨架，后补充”。'}` },
          { kind: 'explain', text: `${hasClauseCore ? `如果看到 ${clauseText}，就把它想成句子里的小房间。它自己也有小结构，但它是来补充主句的。` : '这句没有特别大的从句，所以我们重点练习把修饰语和主干分开。'}` },
          { kind: 'explain', text: `${mistakeLine} 看到长尾巴时，不要全塞进主干里。` },
          { kind: 'encourage', text: `${encouragement} 你现在是在帮句子减负。` }
        ]
      };
    };
    const buildRelationshipStepTeaching = (sentence = {}, clauseSegments = []) => {
      const clauseText = formatTeachingList(segmentTextList(clauseSegments));
      const pronounTip = sentence.pronounRef ? `代词还要回收到前文：${sentence.pronounRef}` : '';
      const teachingFocus = sentence.teachingFocus || {};
      const guidingQuestion = teachingFocus.relationshipQuestion || '这句到底是在并列推进、转折，还是主句带着补充信息往前走？';
      const mistakeLine = teachingFocus.commonMistake || '常见错误是每一块都懂一点，但拼不回整句，不知道哪块最重要。';
      const encouragement = teachingFocus.encouragement || '最后这一步，是把零件重新装回去。';
      return {
        prompt: '最后把零件重新装回去。先说主干，再把补充信息按顺序加回来，整句话就会顺起来。',
        explanation: `这一句先用主干打底，再把时间、地点、修饰或从句挂回去。${sentence.logicConnector ? `关系线索是：${sentence.logicConnector}。` : ''}${pronounTip ? ` ${pronounTip}` : ''}${!sentence.logicConnector && clauseText ? ` 结构信号也可以从 ${clauseText} 这些位置读出来。` : ''}`,
        coachLine: `${encouragement} 当你能说清骨架、补充和连接，这句就真的读懂了。`,
        focusLabel: '把整句话顺一遍',
        screenTitle: '把意思重新串起来',
        screenPrompt: '骨架站好以后，意思就能顺顺地连起来。',
        sentenceCardTitle: '这句怎么串起来',
        sentenceCardLines: [
          sentence.logicConnector ? `连接线索：${sentence.logicConnector}` : '没有明显连词时，就看哪块在推进主要意思。',
          pronounTip || '如果有代词，就回头找它指谁。',
          clauseText ? `结构提示：${clauseText}` : '把补充说明按顺序挂回主干里。'
        ],
        voiceSegments: [
          { kind: 'explain', text: `第四步，我们把整句重新装回去。先说主干，再把补充信息一层层加回来。` },
          { kind: 'explain', text: `${sentence.logicConnector ? `这句最直接的关系线索是：${sentence.logicConnector}。` : clauseText ? `这句可以从 ${clauseText} 这些结构信号来判断句子关系。` : '这句没有很明显的连词，所以要看哪块在推进主要意思，哪块只是补充。'}` },
          { kind: 'explain', text: `${pronounTip || '如果句子里有代词，也要记得回头找它指谁。'}` },
          { kind: 'explain', text: `${mistakeLine} 所以重装的时候，一定要先说主干，再加细节。` },
          { kind: 'encourage', text: `${encouragement} 当你能把骨架、补充和连接讲顺，这句就真正变成你的了。` }
        ]
      };
    };

    const buildDeepDiveLessonPlan = (sentence = {}) => {
      const segments = Array.isArray(sentence.segments) ? sentence.segments : [];
      const mainSegments = segments.filter(seg => ['subject', 'verb', 'object', 'predicative', 'object-complement', 'coord-subject', 'coord-verb', 'coord-object', 'coord-predicative'].includes(seg.type));
      const modifierSegments = segments.filter(seg => ['modifier', 'adverbial'].includes(seg.type));
      const clauseSegments = segments.filter(seg => String(seg.type || '').startsWith('clause') || seg.type === 'conjunction' || String(seg.type || '').startsWith('coord'));
      const firstMainFrame = buildPracticeFrames(segments, sentence.syntaxHints || {})[0];
      const subjectText = mainSegments
        .filter(seg => seg.type === 'subject')
        .map(seg => seg.text?.trim())
        .filter(Boolean)
        .join(' ') || frameSubjectDisplay(firstMainFrame);
      const verbText = mainSegments
        .filter(seg => seg.type === 'verb')
        .map(seg => seg.text?.trim())
        .filter(Boolean)
        .join(' ');
      const objectText = mainSegments
        .filter(seg => ['object', 'predicative', 'object-complement'].includes(seg.type))
        .map(seg => seg.text?.trim())
        .filter(Boolean)
        .join(' ');
      const answerText = [subjectText, verbText, objectText].filter(Boolean).join(' ');
      const modifierText = modifierSegments
        .map(seg => seg.text?.trim())
        .filter(Boolean)
        .join(' / ');
      const clauseText = clauseSegments
        .map(seg => seg.text?.trim())
        .filter(Boolean)
        .join(' / ');
      const grammarPoints = (sentence.grammarFocus || '')
        .split(/[\/、，,]/)
        .map(item => item.trim())
        .filter(Boolean);
      const mainStep = buildMainStepTeaching(sentence, mainSegments);
      const grammarStep = buildGrammarStepTeaching(sentence, grammarPoints, segments);
      const modifierStep = buildModifierStepTeaching(sentence, modifierSegments, clauseSegments);
      const relationshipStep = buildRelationshipStepTeaching(sentence, clauseSegments);
      const vocabularyTerms = normalizeGlossary(sentence.keyTerms || sentence.glossary || [])
        .filter(term => term?.term)
        .slice(0, 6);

      return [
        {
          key: 'main',
          title: '先抓主干',
          prompt: mainStep.prompt,
          explanation: mainStep.explanation,
          coachLine: mainStep.coachLine,
          voiceSegments: mainStep.voiceSegments,
          focusLabel: mainStep.focusLabel,
          screenTitle: mainStep.screenTitle,
          screenPrompt: mainStep.screenPrompt,
          sentenceCardTitle: mainStep.sentenceCardTitle,
          sentenceCardLines: mainStep.sentenceCardLines,
          displayKeywords: makeKeywordList(`${answerText} ${verbText} ${subjectText} ${objectText}`, ['动作', '谁做', '落点']),
          displaySummary: `主干：${answerText || joinRoleSummary(subjectText, verbText, objectText)}`
        },
        {
          key: 'modifier',
          title: '再挂修饰语',
          prompt: modifierStep.prompt,
          explanation: modifierStep.explanation,
          coachLine: modifierStep.coachLine,
          voiceSegments: modifierStep.voiceSegments,
          focusLabel: modifierStep.focusLabel,
          screenTitle: modifierStep.screenTitle,
          screenPrompt: modifierStep.screenPrompt,
          sentenceCardTitle: modifierStep.sentenceCardTitle,
          sentenceCardLines: modifierStep.sentenceCardLines,
          displayKeywords: makeKeywordList(`${modifierText} ${clauseText}`, ['小贴纸', '小标签', '小房间']),
          displaySummary: modifierText ? `补充：${modifierText}` : '守住主干'
        },
        {
          key: 'relationship',
          title: '读懂结果',
          prompt: '现在不用再拖词块：核对关系和语法信号，然后把主干与补充信息重新串成完整意思。',
          explanation: `${relationshipStep.explanation} ${grammarStep.explanation} ${sentence.translation || ''}`.trim(),
          coachLine: grammarStep.coachLine || relationshipStep.coachLine,
          voiceSegments: [...relationshipStep.voiceSegments, ...grammarStep.voiceSegments],
          focusLabel: '看清关系与信号，再说清整句',
          screenTitle: '读懂结果',
          screenPrompt: '关系、语法信号和整句意思都在这里核对；不再需要操作。',
          sentenceCardTitle: '读懂结果',
          sentenceCardLines: vocabularyTerms.length ? vocabularyTerms.map(term => `${term.term}${term.translation ? `：${term.translation}` : ''}`) : ['选中一个重要词或词组，再决定是否加入生词本。'],
          displayKeywords: makeKeywordList(`${sentence.logicConnector || ''} ${sentence.pronounRef || ''} ${clauseText} ${grammarPoints.join(' ')} ${vocabularyTerms.map(term => term.term).join(' ')}`, ['连接', '谓语', '信号']),
          displaySummary: sentence.translation || (vocabularyTerms.length ? `带走：${vocabularyTerms.map(term => term.term).join(' · ')}` : '把整句顺着说出来')
        }
      ];
    };


    const buildLessonSpeechSegments = (step = {}) => {
      if (step.hasAiTeachingScript && step.aiVoiceText) return [{ kind: 'explain', text: step.aiVoiceText }];
      if (Array.isArray(step.voiceSegments) && step.voiceSegments.length > 0) return step.voiceSegments;
      if (step.aiVoiceText) return [{ kind: 'explain', text: step.aiVoiceText }];
      const parts = [
        step.prompt ? { kind: 'explain', text: step.prompt } : null,
        step.explanation ? { kind: 'explain', text: step.explanation } : null,

      const id = typeof crypto?.randomUUID === 'function' ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`;
